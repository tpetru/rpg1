<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Fundalul temei "Plante" de pe /casa (tema inchisa - de aceea verzii sunt deschisi,
       ca sa se vada pe fundalul verde-negru). Formele sunt definite o data in <defs> si asezate cu
       <use> in 16 pozitii care nu se suprapun si nu ies din carou, ca sa se repete curat. -->
  <defs>
    <!-- Frunza ovala, cu nervuri -->
    <g id="p-leaf">
      <path d="M20 3 C31 10 31 28 20 37 C9 28 9 10 20 3 Z" fill="#93c477"/>
      <path d="M20 5 L20 35" stroke="#6f9f56" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M20 12 L13.5 9 M20 12 L26.5 9 M20 20 L12.5 17 M20 20 L27.5 17 M20 27.5 L14.5 25 M20 27.5 L25.5 25"
            stroke="#6f9f56" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Feriga -->
    <g id="p-fern">
      <path d="M20 38 L20 4" stroke="#84b86a" stroke-width="1.8" stroke-linecap="round"/>
      <g fill="#93c477">
        <ellipse cx="14.5" cy="9"  rx="5.2" ry="2.4" transform="rotate(-32 14.5 9)"/>
        <ellipse cx="25.5" cy="9"  rx="5.2" ry="2.4" transform="rotate(32 25.5 9)"/>
        <ellipse cx="13.5" cy="16" rx="6"   ry="2.6" transform="rotate(-28 13.5 16)"/>
        <ellipse cx="26.5" cy="16" rx="6"   ry="2.6" transform="rotate(28 26.5 16)"/>
        <ellipse cx="14"   cy="23" rx="5.4" ry="2.4" transform="rotate(-24 14 23)"/>
        <ellipse cx="26"   cy="23" rx="5.4" ry="2.4" transform="rotate(24 26 23)"/>
        <ellipse cx="15.5" cy="30" rx="4.2" ry="2"   transform="rotate(-20 15.5 30)"/>
        <ellipse cx="24.5" cy="30" rx="4.2" ry="2"   transform="rotate(20 24.5 30)"/>
      </g>
    </g>

    <!-- Monstera: taieturile sunt goluri in aceeasi forma (fill-rule evenodd), ca sa ramana
         transparente indiferent de ce e in spate. -->
    <g id="p-monstera">
      <path fill="#84b86a" fill-rule="evenodd" d="
        M20 3 C32 7 35 21 28 33 C24.5 38 15.5 38 12 33 C5 21 8 7 20 3 Z
        M21 9.5 L30 13.5 L21 15.5 Z
        M19 9.5 L10 13.5 L19 15.5 Z
        M21 20 L30.5 23 L21 25.5 Z
        M19 20 L9.5 23 L19 25.5 Z"/>
      <path d="M20 14 L20 36" stroke="#6f9f56" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- Ramura cu frunze rotunde -->
    <g id="p-sprig">
      <path d="M20 38 C20 28 20 14 20 5" stroke="#84b86a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <g fill="#a3cf8a">
        <circle cx="20"   cy="6"  r="3.4"/>
        <circle cx="14"   cy="12" r="4"/>
        <circle cx="26"   cy="15" r="4"/>
        <circle cx="14"   cy="21" r="4"/>
        <circle cx="26"   cy="25" r="3.6"/>
        <circle cx="15.5" cy="30" r="3.2"/>
      </g>
    </g>

    <!-- Planta in ghiveci -->
    <g id="p-pot">
      <path d="M20 25 C14 19 13 10.5 16 6 C20 10.5 22 18 20 25 Z" fill="#84b86a"/>
      <path d="M20 25 C26 19 27 10.5 24 6 C20 10.5 18 18 20 25 Z" fill="#a3cf8a"/>
      <path d="M20 26 L20 13" stroke="#6f9f56" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M12 27 L28 27 L26 36.5 C26 38 14 38 14 36.5 Z" fill="#bd8354"/>
      <rect x="10.5" y="24" width="19" height="4" rx="1.6" fill="#cd9264"/>
    </g>
  </defs>

  <g opacity="0.12">
    <use href="#p-leaf"     transform="translate(28 42) rotate(-16) scale(1.45)"/>
    <use href="#p-sprig"    transform="translate(108 44) rotate(9) scale(1.35)"/>
    <use href="#p-monstera" transform="translate(166 26) rotate(-6) scale(1.45)"/>
    <use href="#p-fern"     transform="translate(242 36) rotate(12) scale(1.3)"/>
    <use href="#p-pot"      transform="translate(292 52) rotate(-3) scale(1.4)"/>

    <use href="#p-fern"     transform="translate(24 150) rotate(-8) scale(1.35)"/>
    <use href="#p-monstera" transform="translate(86 164) rotate(14) scale(1.4)"/>
    <use href="#p-leaf"     transform="translate(226 146) rotate(34) scale(1.35)"/>
    <use href="#p-sprig"    transform="translate(302 124) rotate(-14) scale(1.25)"/>
    <use href="#p-pot"      transform="translate(334 190) rotate(4) scale(1.3)"/>
    <use href="#p-leaf"     transform="translate(158 232) rotate(-28) scale(1.35)"/>

    <use href="#p-sprig"    transform="translate(250 250) rotate(16) scale(1.3)"/>
    <use href="#p-monstera" transform="translate(28 282) rotate(7) scale(1.4)"/>
    <use href="#p-fern"     transform="translate(172 300) rotate(-11) scale(1.35)"/>
    <use href="#p-leaf"     transform="translate(308 316) rotate(22) scale(1.35)"/>
    <use href="#p-pot"      transform="translate(100 348) rotate(-5) scale(1.2)"/>

    <g>
      <circle cx="196" cy="98"  r="3.5" fill="#a3cf8a"/>
      <circle cx="12"  cy="118" r="3"   fill="#bd8354"/>
      <circle cx="370" cy="62"  r="3"   fill="#a3cf8a"/>
      <circle cx="60"  cy="242" r="3.5" fill="#84b86a"/>
      <circle cx="296" cy="214" r="3"   fill="#bd8354"/>
      <circle cx="130" cy="300" r="3.5" fill="#a3cf8a"/>
      <circle cx="374" cy="288" r="3"   fill="#84b86a"/>
      <circle cx="244" cy="374" r="3.5" fill="#a3cf8a"/>
      <circle cx="58"  cy="380" r="3"   fill="#84b86a"/>
    </g>
  </g>
</svg>
