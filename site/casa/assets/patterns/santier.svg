<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Fundalul temei "Șantier" de pe /casa: materiale de constructie, repetate de CSS.
       Formele sunt definite o data in <defs> si asezate cu <use> in 16 pozitii care nu se
       suprapun si nu ies din carou (ca sa nu fie taiate la repetare). -->
  <defs>
    <!-- Zid de caramida, randuri decalate -->
    <g id="s-brick">
      <rect x="2"  y="9"  width="17" height="8" rx="1.5" fill="#a8492c"/>
      <rect x="21" y="9"  width="17" height="8" rx="1.5" fill="#b95a3b"/>
      <rect x="2"  y="19" width="8"  height="8" rx="1.5" fill="#b95a3b"/>
      <rect x="12" y="19" width="17" height="8" rx="1.5" fill="#a8492c"/>
      <rect x="31" y="19" width="7"  height="8" rx="1.5" fill="#b95a3b"/>
      <rect x="2"  y="29" width="17" height="8" rx="1.5" fill="#b95a3b"/>
      <rect x="21" y="29" width="17" height="8" rx="1.5" fill="#a8492c"/>
    </g>

    <!-- Bloc de BCA / beton celular -->
    <g id="s-block">
      <rect x="3" y="11" width="34" height="21" rx="2" fill="#aeaaa2"/>
      <rect x="3" y="11" width="34" height="4"  rx="2" fill="#c0bcb4"/>
      <rect x="9"  y="18" width="8" height="10" rx="1.5" fill="#8e8a83"/>
      <rect x="23" y="18" width="8" height="10" rx="1.5" fill="#8e8a83"/>
    </g>

    <!-- Profil metalic (grinda I) -->
    <g id="s-beam">
      <rect x="5"  y="7"  width="30" height="5.5" rx="1" fill="#7f868d"/>
      <rect x="5"  y="28" width="30" height="5.5" rx="1" fill="#7f868d"/>
      <rect x="16.5" y="11.5" width="7" height="17.5" fill="#949ba2"/>
    </g>

    <!-- Fier-beton (bara striata) -->
    <g id="s-rebar">
      <rect x="2" y="17" width="36" height="6" rx="3" fill="#8a8078"/>
      <path d="M8 17 L5.5 23 M14 17 L11.5 23 M20 17 L17.5 23 M26 17 L23.5 23 M32 17 L29.5 23"
            stroke="#6c635b" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Rola de vata bazaltica -->
    <g id="s-wool">
      <rect x="10" y="12" width="27" height="17" rx="4" fill="#c2a86e"/>
      <path d="M16 15.5 H33 M16 20.5 H33 M16 25.5 H33" stroke="#ab9159" stroke-width="1.3" stroke-linecap="round"/>
      <ellipse cx="11" cy="20.5" rx="6" ry="8.5" fill="#d6c08a"/>
      <ellipse cx="11" cy="20.5" rx="2.6" ry="3.8" fill="#ab9159"/>
    </g>

    <!-- Sac de ciment -->
    <g id="s-bag">
      <path d="M10 11 L30 11 L32 31 C32 33.5 8 33.5 8 31 Z" fill="#cdc7bb"/>
      <rect x="13.5" y="7.5" width="13" height="4" rx="1.5" fill="#b3ac9f"/>
      <rect x="13" y="17" width="14" height="7" rx="1.2" fill="#a8492c" opacity=".5"/>
    </g>
  </defs>

  <g opacity="0.15">
    <use href="#s-brick" transform="translate(28 42) rotate(-3) scale(1.45)"/>
    <use href="#s-wool"  transform="translate(108 46) rotate(5) scale(1.35)"/>
    <use href="#s-block" transform="translate(166 26) rotate(-2) scale(1.45)"/>
    <use href="#s-rebar" transform="translate(240 36) rotate(-14) scale(1.3)"/>
    <use href="#s-beam"  transform="translate(292 52) rotate(6) scale(1.4)"/>

    <use href="#s-bag"   transform="translate(24 150) rotate(4) scale(1.35)"/>
    <use href="#s-brick" transform="translate(86 164) rotate(3) scale(1.45)"/>
    <use href="#s-wool"  transform="translate(226 146) rotate(-6) scale(1.35)"/>
    <use href="#s-rebar" transform="translate(300 124) rotate(12) scale(1.3)"/>
    <use href="#s-block" transform="translate(334 190) rotate(3) scale(1.35)"/>
    <use href="#s-beam"  transform="translate(158 232) rotate(-8) scale(1.35)"/>

    <use href="#s-bag"   transform="translate(250 250) rotate(-5) scale(1.3)"/>
    <use href="#s-brick" transform="translate(28 282) rotate(2) scale(1.4)"/>
    <use href="#s-wool"  transform="translate(172 300) rotate(7) scale(1.35)"/>
    <use href="#s-block" transform="translate(308 316) rotate(-4) scale(1.35)"/>
    <use href="#s-rebar" transform="translate(100 348) rotate(16) scale(1.2)"/>

    <g>
      <circle cx="196" cy="98" r="3.5" fill="#a8492c"/>
      <circle cx="12"  cy="118" r="3"  fill="#8a8078"/>
      <circle cx="370" cy="62"  r="3"  fill="#c2a86e"/>
      <circle cx="60"  cy="242" r="3.5" fill="#a8492c"/>
      <circle cx="296" cy="214" r="3"  fill="#8a8078"/>
      <circle cx="130" cy="300" r="3.5" fill="#c2a86e"/>
      <circle cx="374" cy="288" r="3"  fill="#a8492c"/>
      <circle cx="244" cy="374" r="3.5" fill="#8a8078"/>
      <circle cx="58"  cy="380" r="3"  fill="#c2a86e"/>
    </g>
  </g>
</svg>
