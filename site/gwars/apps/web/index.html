    <script>
      // Set the theme before the first paint so the page never flashes the other one.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('gw.theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <title>GeoWars</title>
