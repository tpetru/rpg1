# Port 80 site. `certbot --apache` copies this into gwars.no-santos.com-le-ssl.conf (HTTPS)
# and adds the HTTP -> HTTPS redirect here.
<VirtualHost *:80>
    ServerName gwars.no-santos.com
    DocumentRoot /opt/gwars/apps/web/dist

    <Directory /opt/gwars/apps/web/dist>
        Require all granted
        Options -Indexes
        FallbackResource /index.html
    </Directory>

    # Game API and WebSocket, served by the gwars systemd service.
    ProxyPreserveHost On
    ProxyPass        /api/ws ws://127.0.0.1:3000/api/ws
    ProxyPassReverse /api/ws ws://127.0.0.1:3000/api/ws
    ProxyPass        /api    http://127.0.0.1:3000/api
    ProxyPassReverse /api    http://127.0.0.1:3000/api

    ErrorLog ${APACHE_LOG_DIR}/gwars-error.log
    CustomLog ${APACHE_LOG_DIR}/gwars-access.log combined
</VirtualHost>
