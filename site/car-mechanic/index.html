function tone(f, d, type = 'sine', v = 0.2, f2) {

  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);

}
const SFX = {

function engine(on) {

    o.type = 'sawtooth'; o.frequency.value = 42; o2.type = 'square'; o2.frequency.value = 21;

    const p = pops[i]; p.t += dt / 0.5;
    const s = p.t < 1 ? 1 + Math.sin(p.t * Math.PI) * 0.35 : 1;
    p.meshes.forEach(m => { if (!m.userData.s0) m.userData.s0 = m.scale.clone(); m.scale.copy(m.userData.s0).multiplyScalar(s); });
    if (p.t >= 1) pops.splice(i, 1);
  }
  updateSmoke(dt);
}
// mașina rămâne pe loc când apeși „Următorul client” înainte să iasă: o lăsăm să termine
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  if (!S.paused) update(dt);
  placeCamera(dt);
  if (S.mode === 'menu') cam.th += dt * 0.12;
  updateSpots();
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }
  hud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// o mașină de decor pe elevator în meniu
C = makeCar(pick(MODELS), pick(COLORS), new Set()); C.z = 0;
$('bSound').textContent = S.sound ? '🔊' : '🔇';
showStart();
$('bSound').textContent = S.sound ? '🔊' : '🔇';
frame();

// pentru teste
window.__game = { S, get C() { return C; }, act, scan, handOver, toggleHood, toggleLift, selectZone, update, cam,
  step(n = 60, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); } };
</script>
