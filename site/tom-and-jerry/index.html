<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pisica și șoarecii 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bcd9ee; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; background: #3b5a2c; z-index: 50; }
  .chip { background: rgba(30, 24, 16, .58); border-radius: 12px; padding: 7px 12px; backdrop-filter: blur(4px); }
  #hud { position: fixed; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; align-items: flex-start; }
  #score { font-size: 22px; font-weight: 800; }
  #clock { font-size: 15px; font-weight: 700; }
  #clock.low { background: rgba(190, 40, 30, .85); }
  #sniff { font-size: 13px; font-weight: 600; display: none; }
  #sniff.show { display: block; }
  #btns { position: fixed; right: 12px; top: 12px; display: flex; gap: 6px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
  .ib { width: 40px; height: 40px; font-size: 19px; background: rgba(30, 24, 16, .58); color: #fff; }
  .ib:hover { background: rgba(30, 24, 16, .85); }
  #mm { position: fixed; left: 12px; bottom: 12px; width: 150px; height: 150px; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); box-shadow: 0 3px 12px rgba(0,0,0,.35); pointer-events: none; }
  #toast { position: fixed; left: 50%; top: 32%; transform: translateX(-50%); font-size: 20px; font-weight: 800; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; }
  #toast.good { background: rgba(40, 130, 50, .88); }
  #toast.bad { background: rgba(190, 40, 30, .88); }
  #bubble { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); background: #fff; color: #222; font-weight: 700; font-size: 15px; padding: 8px 12px; border-radius: 14px; max-width: 240px; text-align: center; pointer-events: none; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: #fff; }
  #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s; background: radial-gradient(ellipse at center, transparent 40%, rgba(200, 20, 10, .7) 100%); }
  #joy { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); display: none; pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.45); }
  .tb { position: fixed; bottom: 22px; width: 78px; height: 78px; border-radius: 50%; font-size: 34px; color: #fff; display: none; }
  body.touch .tb { display: block; }
  #bCatch { right: 16px; background: rgba(200, 110, 30, .8); box-shadow: 0 4px 0 rgba(110, 55, 10, .9); }
  #bJump { right: 108px; bottom: 34px; width: 64px; height: 64px; font-size: 26px; background: rgba(50, 110, 170, .8); box-shadow: 0 4px 0 rgba(20, 50, 90, .9); }
  .tb:active { transform: translateY(3px); }
  #hint { position: fixed; right: 12px; bottom: 14px; font-size: 13px; opacity: .9; pointer-events: none; text-align: right; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  body.touch #hint { display: none; }
  body.touch #mm { left: auto; right: 12px; bottom: auto; top: 60px; width: 110px; height: 110px; }
  #overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(30, 25, 10, .45); z-index: 20; padding: 16px; }
  #overlay.show { display: grid; }
  .panel { background: #fbf6ea; color: #33291c; border-radius: 22px; padding: 22px 24px; width: min(580px, 100%); max-height: calc(100vh - 32px - var(--gb, 0px)); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .panel h1 { margin: 0 0 6px; font-size: 32px; color: #b4561c; text-align: center; }
  .panel h2 { margin: 0 0 8px; font-size: 26px; color: #2f6b2c; text-align: center; }
  .panel p { margin: 8px 0; line-height: 1.45; }
  .panel ul { margin: 6px 0 10px; padding-left: 20px; line-height: 1.55; }
  .big { display: block; margin: 14px auto 4px; background: #d0702a; color: #fff; font-size: 20px; font-weight: 800; padding: 13px 34px; box-shadow: 0 4px 0 #8a4512; }
  .big:hover { background: #e07c30; }
  .best { text-align: center; font-size: 13px; opacity: .75; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; margin: 10px auto; max-width: 320px; font-size: 16px; }
  .stats b { text-align: right; }
  kbd { background: #e7dcc6; border-radius: 5px; padding: 1px 6px; font-size: 13px; }
  @media (max-width: 520px) { .panel { padding: 16px; } .panel h1 { font-size: 26px; } }
  /* bara cu jocuri de sus (/games/topbar.js) */
  #hud, #btns { top: calc(12px + var(--gb, 0px)); }
  body.touch #mm { top: calc(60px + var(--gb, 0px)); }
  #overlay { top: var(--gb, 0px); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
} }
</script>
</head>
<body>
<script src="/games/topbar.js"></script>
<div id="loading">Se încarcă satul… 🐾</div>
<div id="hud">
  <div class="chip" id="score">🐭 0/15</div>
  <div class="chip" id="clock">⏱ 4:00</div>
  <div class="chip" id="sniff">👃 Miroși un șoarece… uită-te pe hartă</div>
</div>
<div id="btns">
  <button class="ib" id="bSound" title="Sunet (M)">🔊</button>
  <button class="ib" id="bRespawn" title="Înapoi în piața satului (R)">🔄</button>
  <button class="ib" id="bPause" title="Pauză (Esc)">⏸</button>
</div>
<canvas id="mm" width="300" height="300"></canvas>
<div id="toast" class="chip"></div>
<div id="bubble"></div>
<div id="hurt"></div>
<div id="joy"><i></i></div>
<button class="tb" id="bJump" title="Sari">⤴</button>
<button class="tb" id="bCatch" title="Prinde">🐾</button>
<div id="hint"><kbd>⬆</kbd><kbd>⬇</kbd> mergi · <kbd>⬅</kbd><kbd>➡</kbd> te întorci · <kbd>Shift</kbd> fugi · <kbd>Space</kbd> sari · <kbd>Enter</kbd> prinzi<br>trage cu mouse-ul ca să te uiți în jur</div>
<div id="overlay" class="show"><div class="panel" id="panel"></div></div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = THREE.MathUtils.clamp;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261110);
const rr = (a, b) => a + R() * (b - a);
const pick = a => a[Math.floor(R() * a.length)];

// ---------------- reguli ----------------
const N_MICE = 15, TIME = 240;
const EYE = 0.3, CAT_R = 0.18, CAT_H = 0.36, STEP = 0.32, G = 14, JUMP_V = 6.4;
const WALK = 4.2, RUN = 6.8, TURN = 2.5;
const BX = 42, BZ = 94;
const SAVE = 'pisica3d';
const START = { x: 0, z: 6, yaw: 0 };

// ---------------- scenă ----------------
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const SKY = 0xbcd9ee;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 35, 190);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.02, 600);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xe6f2ff, 0x6c7a3e, 1.5));
const sun = new THREE.DirectionalLight(0xfff0d6, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 140 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(rep[0], rep[1]);
  t.anisotropy = 8;
  return t;
}
const MC = {};
const mat = (c, o) => { const { key, ...rest } = o || {}; const k = c + '|' + (key || '') + '|' + Object.keys(rest).join(); return MC[k] || (MC[k] = new THREE.MeshLambertMaterial({ color: c, ...rest })); };
const BOXG = new THREE.BoxGeometry(1, 1, 1);
const SPH = new THREE.SphereGeometry(1, 14, 10);
const GC = {};
const cylG = (rt, rb, h, seg = 12) => { const k = [rt, rb, h, seg].join(); return GC[k] || (GC[k] = new THREE.CylinderGeometry(rt, rb, h, seg)); };
function add(mesh, p, x, y, z, cast = true) { mesh.position.set(x, y, z); mesh.castShadow = cast; mesh.receiveShadow = true; (p || scene).add(mesh); return mesh; }
const box = (w, h, d, m, x, y, z, p, cast) => { const me = add(new THREE.Mesh(BOXG, m), p, x, y, z, cast); me.scale.set(w, h, d); return me; };
const cyl = (rt, rb, h, seg, m, x, y, z, p, cast) => add(new THREE.Mesh(cylG(rt, rb, h, seg), m), p, x, y, z, cast);
const ball = (sx, sy, sz, m, x, y, z, p, cast) => { const me = add(new THREE.Mesh(SPH, m), p, x, y, z, cast); me.scale.set(sx, sy, sz); return me; };
function prism(w, h, l, m, x, y, z, p) { // acoperiș în două ape, coama de-a lungul lui z
  const s = new THREE.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: l, bevelEnabled: false }); g.translate(0, 0, -l / 2);
  return add(new THREE.Mesh(g, m), p, x, y, z);
}

// ---------------- coliziuni ----------------
// cutii aliniate pe axe: b = jos, t = sus. fence: gardurile, pe sub care se strecoară șoarecii.
const COL = [];
function addCol(x0, x1, z0, z1, t, b = 0, fence = false) { const c = { x0: Math.min(x0, x1), x1: Math.max(x0, x1), z0: Math.min(z0, z1), z1: Math.max(z0, z1), t, b, fence }; COL.push(c); return c; }
const hits = (c, x, z, r) => x + r > c.x0 && x - r < c.x1 && z + r > c.z0 && z - r < c.z1;
function blockedAt(x, z, y, r, h, mouse) {
  for (const c of COL) if ((!mouse || !c.fence) && hits(c, x, z, r) && c.t > y + STEP && c.b < y + h) return true;
  return false;
}
function groundAt(x, z, y, r) { let g = 0; for (const c of COL) if (c.t <= y + STEP + 1e-3 && c.t > g && hits(c, x, z, r)) g = c.t; return g; }
function ceilAt(x, z, y0, y1, r) { let m = Infinity; for (const c of COL) if (c.b >= y0 - 0.02 && c.b <= y1 && c.b < m && hits(c, x, z, r)) m = c.b; return m; }

// ---------------- texturi ----------------
const grassTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#5f9a3c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `hsla(${85 + Math.random() * 30},${40 + Math.random() * 25}%,${25 + Math.random() * 25}%,.55)`; g.fillRect(Math.random() * w, Math.random() * h, 1.5, 3 + Math.random() * 4); }
  for (let i = 0; i < 40; i++) { g.fillStyle = Math.random() < .5 ? '#f4f0d8' : '#f2d23a'; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
}, [120, 120]);
const roadTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#a28a63'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(${90 + Math.random() * 60},${70 + Math.random() * 50},${40 + Math.random() * 30},.5)`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.fillStyle = 'rgba(80,60,35,.35)'; g.fillRect(28, 0, 10, h); g.fillRect(90, 0, 10, h);
  g.fillStyle = 'rgba(90,140,60,.35)'; g.fillRect(56, 0, 16, h);
}, [1, 20]);
const tileTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(0,0,0,.22)';
  for (let y = 0; y < h; y += 8) g.fillRect(0, y, w, 2);
  for (let y = 0; y < h; y += 8) for (let x = (y / 8 % 2) * 6; x < w; x += 12) g.fillRect(x, y, 1.5, 8);
}, [1, 1]);

// ---------------- teren ----------------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.MeshLambertMaterial({ map: grassTex }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const roadMat = new THREE.MeshLambertMaterial({ map: roadTex });
const road1 = new THREE.Mesh(new THREE.PlaneGeometry(7, 260), roadMat); road1.rotation.x = -Math.PI / 2; road1.position.y = 0.01; road1.receiveShadow = true; scene.add(road1);
const rt2 = roadTex.clone(); rt2.repeat.set(1, 8); rt2.needsUpdate = true;
const road2 = new THREE.Mesh(new THREE.PlaneGeometry(7, 80), new THREE.MeshLambertMaterial({ map: rt2 })); road2.rotation.x = -Math.PI / 2; road2.rotation.z = Math.PI / 2; road2.position.set(7, 0.012, 0); road2.receiveShadow = true; scene.add(road2);
// dealuri în depărtare
for (let i = 0; i < 26; i++) {
  const a = i / 26 * TAU, d = rr(170, 210);
  ball(rr(40, 70), rr(14, 30), rr(40, 70), mat(pick([0x6f9a48, 0x7fa653, 0x5f8a42, 0x8aa85a])), Math.sin(a) * d, -4, Math.cos(a) * d, scene, false);
}

// ---------------- obiecte din sat ----------------
const PICK = []; // ulucile gardurilor (instanțe)
const WOOD = [0x8b6a45, 0x7d5f3e, 0x97754d, 0x6f5236];
function fence(x0, z0, x1, z1, gaps = [], color = 0x8b6a45) {
  const alongZ = x0 === x1, a0 = alongZ ? z0 : x0, a1 = alongZ ? z1 : x1, f = alongZ ? x0 : z0;
  const P = (a, y) => alongZ ? [f, y, a] : [a, y, f];
  const inGap = a => gaps.some(([g0, g1]) => a > g0 && a < g1);
  for (let a = a0 + 0.1; a < a1; a += 0.17) if (!inGap(a)) PICK.push({ p: P(a, 0.5 + rr(-0.03, 0.03)), s: alongZ ? [0.03, 1 + rr(-0.06, 0.04), 0.11] : [0.11, 1 + rr(-0.06, 0.04), 0.03], c: color });
  // segmentele dintre porți: șipci, stâlpi, coliziune
  const cuts = [a0, ...gaps.flat(), a1];
  for (let i = 0; i < cuts.length; i += 2) {
    const s0 = cuts[i], s1 = cuts[i + 1], len = s1 - s0, mid = (s0 + s1) / 2;
    for (const y of [0.3, 0.8]) { const [x, , z] = P(mid, 0); box(alongZ ? 0.05 : len, 0.08, alongZ ? len : 0.05, mat(0x6a4e30), x + (alongZ ? 0.04 : 0), y, z + (alongZ ? 0 : 0.04)); }
    for (let a = s0; a <= s1 + 0.01; a += Math.max(2.2, len / Math.ceil(len / 2.4))) { const [x, , z] = P(Math.min(a, s1), 0); box(0.12, 1.15, 0.12, mat(0x5e442a), x, 0.575, z); }
    const [cx0, , cz0] = P(s0, 0), [cx1, , cz1] = P(s1, 0);
    addCol(cx0 - 0.07, cx1 + 0.07, cz0 - 0.07, cz1 + 0.07, 1.05, 0, true);
  }
}

function tree(x, z, big = 1, colorSet) {
  const h = rr(1.6, 2.4) * big;
  cyl(0.12 * big, 0.18 * big, h, 7, mat(0x5b4129), x, h / 2, z);
  const leaf = colorSet || [0x4f8a32, 0x5c9a3a, 0x467d2d];
  for (let i = 0; i < 4; i++) ball(rr(1, 1.5) * big, rr(0.9, 1.2) * big, rr(1, 1.5) * big, mat(pick(leaf)), x + rr(-0.6, 0.6) * big, h + rr(0.3, 1.2) * big, z + rr(-0.6, 0.6) * big);
  if (R() < 0.5 && !colorSet) for (let i = 0; i < 8; i++) ball(0.07, 0.07, 0.07, mat(pick([0xd8352a, 0xe8b32a])), x + rr(-1.3, 1.3) * big, h + rr(0, 1.4) * big, z + rr(-1.3, 1.3) * big, scene, false);
  addCol(x - 0.18 * big, x + 0.18 * big, z - 0.18 * big, z + 0.18 * big, 20);
}
function poplar(x, z) {
  const h = rr(1.5, 2.5);
  cyl(0.15, 0.22, h, 7, mat(0x6a5a46), x, h / 2, z);
  ball(1.3, 6.5, 1.3, mat(pick([0x3f7a2e, 0x4a8636])), x, h + 5, z);
  addCol(x - 0.22, x + 0.22, z - 0.22, z + 0.22, 20);
}
function haystack(x, z) {
  const m = mat(0xcfaa52);
  cyl(1.35, 1.45, 1.3, 14, m, x, 0.65, z);
  cyl(0.05, 1.4, 2.1, 14, m, x, 2.35, z);
  cyl(0.05, 0.05, 1.2, 5, mat(0x6a4e30), x, 3.6, z);
  addCol(x - 1.25, x + 1.25, z - 1.25, z + 1.25, 3.4);
}
function well(x, z) {
  cyl(0.65, 0.7, 0.8, 14, mat(0x9a948a), x, 0.4, z);
  cyl(0.5, 0.5, 0.02, 14, mat(0x22303a), x, 0.79, z, scene, false);
  for (const s of [-1, 1]) box(0.12, 1.9, 0.12, mat(0x6a4e30), x + s * 0.62, 0.95, z);
  prism(1.7, 0.6, 1.3, mat(0x7a5532), x, 1.9, z).rotation.y = Math.PI / 2;
  cyl(0.06, 0.06, 1.2, 8, mat(0x5b4129), x, 1.6, z).rotation.z = Math.PI / 2;
  cyl(0.16, 0.13, 0.25, 10, mat(0x8a8f96), x + 0.2, 0.98, z);
  addCol(x - 0.68, x + 0.68, z - 0.68, z + 0.68, 0.8);
}
function cumpana(x, z) { // fântână cu cumpănă
  cyl(0.75, 0.8, 0.85, 16, mat(0xb8b2a6), x, 0.425, z);
  cyl(0.6, 0.6, 0.02, 16, mat(0x22303a), x, 0.84, z, scene, false);
  box(0.25, 3.6, 0.25, mat(0x5b4129), x + 2.2, 1.8, z);
  const beam = box(0.13, 0.13, 7.5, mat(0x6a4e30), x + 2.2, 3.5, z - 0.3); beam.rotation.x = -0.32;
  box(0.03, 2.2, 0.03, mat(0x3a2a1a), x + 2.2, 2.4, z - 3.8);
  cyl(0.18, 0.14, 0.3, 10, mat(0x7a5532), x + 2.2, 1.2, z - 3.8);
  box(0.4, 0.4, 0.5, mat(0x8a8a84), x + 2.2, 4.3, z + 3.0).rotation.x = -0.32;
  addCol(x - 0.78, x + 0.78, z - 0.78, z + 0.78, 0.85);
  addCol(x + 2.05, x + 2.35, z - 0.15, z + 0.15, 20);
}
function woodpile(x, z, len) { // stivă de lemne, aliniată pe z
  box(1.0, 1.0, len, mat(0x8a6a44), x, 0.5, z);
  for (let i = 0; i < len * 3; i++) cyl(0.09, 0.09, 1.02, 6, mat(pick([0xc9a172, 0xb88f60, 0xd8b182])), x, rr(0.1, 0.92), z + rr(-len / 2 + 0.1, len / 2 - 0.1), scene, false).rotation.z = Math.PI / 2;
  prism(1.6, 0.4, len + 0.4, mat(0x7a5532), x, 1.25, z);
  for (const s of [-1, 1]) for (const e of [-1, 1]) box(0.1, 1.3, 0.1, mat(0x5b4129), x + s * 0.65, 0.65, z + e * (len / 2 + 0.1));
  addCol(x - 0.5, x + 0.5, z - len / 2, z + len / 2, 1.0);
}
function bench(x, z, alongX = true) {
  const w = alongX ? 2.2 : 0.45, d = alongX ? 0.45 : 2.2;

$('bSound').textContent = muted ? '🔇' : '🔊';

// ---------------- actualizare ----------------
function moveBody(o, dx, dz, r, h, mouse) {

function updateCat(dt) {

function updateMice(dt, t) {

    if (!m.alive) continue;

    }

      if (!ok || Math.abs(m.x) > BX + 2 || Math.abs(m.z) > BZ + 2) {

function panOf(o) { const a = Math.atan2(-(o.x - cat.x), -(o.z - cat.z)); return clamp(-Math.sin(angDiff(cat.yaw, a)), -1, 1); }
let earTw = 0, earSide = 0;

function updatePeople(dt, t) {
  for (const p of PEOPLE) {

    else {

let bubbleP = null, bubbleT = 0, bubbleCd = 2;

// ---------------- minimapa ----------------
const MPX = 4, MX0 = -50, MZ0 = -100;
const mapC = document.createElement('canvas'); mapC.width = 100 * MPX; mapC.height = 200 * MPX;
(function drawMap() {
  const g = mapC.getContext('2d'), X = x => (x - MX0) * MPX, Z = z => (z - MZ0) * MPX;
  g.fillStyle = '#5f9a3c'; g.fillRect(0, 0, mapC.width, mapC.height);
  g.fillStyle = '#b39a70'; g.fillRect(X(-3.5), 0, 7 * MPX, mapC.height); g.fillRect(X(-31), Z(-3.5), 75 * MPX, 7 * MPX);
  for (const L of LOTS) { const a = L.W(0, -11), b = L.W(22, 11); g.fillStyle = 'rgba(120,160,70,.9)'; g.fillRect(X(Math.min(a[0], b[0])), Z(a[1]), 22 * MPX, 22 * MPX); }

})();
const mm = $('mm'), mg = mm.getContext('2d');

// ---------------- bucla ----------------
const clock = new THREE.Clock();
