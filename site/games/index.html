<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jocuri · no-santos</title>
<meta name="description" content="Toate jocurile de pe no-santos.com">
<style>
  :root { --bg:#0f1218; --card:#181c25; --line:#2a303c; --ink:#eef1f6; --ink2:#9aa3b2; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:980px; margin:0 auto; padding:calc(28px + var(--gb, 0px)) 16px 48px; }
  h1 { margin:8px 0 4px; font-size:clamp(28px, 6vw, 44px); letter-spacing:-.02em; }
  p.sub { margin:0 0 26px; color:var(--ink2); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap:16px; }
  a.game { position:relative; display:flex; flex-direction:column; gap:8px; padding:20px 20px 18px; min-height:200px; border-radius:18px;
    background:var(--card); border:1px solid var(--line); color:inherit; text-decoration:none; overflow:hidden;
    transition:transform .15s, border-color .15s, box-shadow .15s; }
  a.game::before { content:""; position:absolute; inset:0; background:radial-gradient(120% 90% at 100% 0%, var(--c) 0%, transparent 60%); opacity:.35; transition:opacity .15s; }
  a.game:hover, a.game:focus-visible { transform:translateY(-3px); border-color:var(--c); box-shadow:0 12px 30px rgba(0,0,0,.35); outline:none; }
  a.game:hover::before { opacity:.55; }
  a.game > * { position:relative; }
  .ic { font-size:52px; line-height:1; }
  .nm { font-size:22px; font-weight:800; }
  .ds { color:var(--ink2); font-size:14px; line-height:1.4; flex:1; }
  .pl { align-self:flex-start; margin-top:4px; padding:7px 14px; border-radius:999px; background:var(--c); color:#111; font-weight:800; font-size:14px; }
  footer { margin-top:34px; color:var(--ink2); font-size:13px; }
  footer a { color:inherit; }
</style>
</head>
<body>
<script src="/games/topbar.js"></script>
<main>
  <h1>🎮 Jocuri</h1>
  <p class="sub">Toate jocurile de pe no-santos.com. Merg în browser, pe calculator și pe telefon.</p>
  <div class="grid" id="grid"></div>
  <footer><a href="https://no-santos.com/">← no-santos.com</a></footer>
</main>
<script>
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  document.getElementById('grid').innerHTML = (window.NS_GAMES || []).map(function (g) {
    return '<a class="game" href="' + esc(g.href) + '" style="--c:' + esc(g.color) + '">' +
      '<span class="ic">' + g.icon + '</span><span class="nm">' + esc(g.name) + '</span>' +
      '<span class="ds">' + esc(g.desc) + '</span><span class="pl">Joacă ▶</span></a>';
  }).join('');
</script>
</body>
</html>
