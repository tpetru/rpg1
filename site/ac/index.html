<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pisici în Zbor 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd0ff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; background: #8fd0ff; z-index: 50; }
  .chip { background: rgba(20, 28, 45, .62); border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(4px); }
  #hud { position: fixed; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #lvl { font-weight: 700; font-size: 15px; }
  #score { font-size: 22px; font-weight: 800; letter-spacing: .5px; }
  #best { font-size: 12px; opacity: .8; }
  #queue { position: fixed; right: 12px; top: 12px; display: flex; gap: 6px; align-items: center; pointer-events: none; }
  .qcat { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .qcat.cur { width: 38px; height: 38px; border-color: #ffd34d; }
  #btns { position: fixed; right: 12px; top: 60px; display: flex; gap: 6px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
  .ib { width: 40px; height: 40px; font-size: 19px; background: rgba(20, 28, 45, .62); color: #fff; }
  .ib:hover { background: rgba(20, 28, 45, .82); }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); text-align: center; font-size: 14px; pointer-events: none; max-width: calc(100vw - 150px); }
  #hint b { color: #ffd34d; }
  #aimpad { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 8px; }
  #aimpad button { width: 54px; height: 54px; font-size: 22px; background: rgba(20, 28, 45, .55); color: #fff; }
  #overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(10, 20, 40, .45); z-index: 20; padding: 16px; }
  #overlay.show { display: grid; }
  .panel { background: #fffaf0; color: #3a2a1a; border-radius: 22px; padding: 22px 24px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); text-align: center; }
  .panel h1 { margin: 0 0 4px; font-size: 32px; color: #e8701a; text-shadow: 0 2px 0 #ffd9a8; }
  .panel h2 { margin: 0 0 8px; font-size: 26px; color: #e8701a; }
  .panel p { margin: 6px 0 14px; }
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin: 14px 0; }
  .levels button { background: #ffb347; color: #3a2a1a; padding: 12px 6px; font-weight: 700; box-shadow: 0 4px 0 #c9781e; }
  .levels button:hover { background: #ffc46e; }
  .levels .n { font-size: 26px; display: block; }
  .levels .nm { font-size: 11px; display: block; font-weight: 600; }
  .stars { color: #f4b400; letter-spacing: 2px; font-size: 16px; }
  .stars .off { color: #d8cbb8; }
  .big { font-size: 46px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .row button { background: #4caf50; color: #fff; padding: 12px 20px; font-weight: 700; font-size: 16px; box-shadow: 0 4px 0 #2e7d32; }
  .row button.sec { background: #8d7b68; box-shadow: 0 4px 0 #5d4f40; }
  .help { text-align: left; font-size: 14px; line-height: 1.5; background: #f3e8d6; border-radius: 12px; padding: 10px 14px; }
  .help kbd { background: #fff; border: 1px solid #c9b79c; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  .ft { position: fixed; left: 0; top: 0; font-weight: 900; font-size: 20px; pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,.45); white-space: nowrap; z-index: 5; }
  .ft.kill { color: #ffe14d; font-size: 24px; }
  .ft.blk { color: #fff; font-size: 16px; }
  .ft.bonus { color: #7dff8a; font-size: 26px; }
  #rotate { position: fixed; inset: 0; display: none; place-items: center; background: rgba(10, 20, 40, .7); z-index: 40; padding: 20px; }
  #rotate.show { display: grid; }
  #rotate .phone { font-size: 64px; display: inline-block; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
  @media (max-width: 600px) { #hint { font-size: 12px; bottom: 76px; max-width: calc(100vw - 24px); } .panel h1 { font-size: 26px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="loading">Se încarcă pisicile…</div>
<div id="hud">
  <div class="chip"><div id="lvl"></div><div id="score">0</div><div id="best"></div></div>
</div>
<div id="queue"></div>
<div id="btns">
  <button class="ib" id="bMenu" title="Meniu (Esc)">☰</button>
  <button class="ib" id="bRestart" title="Din nou (R)">↻</button>
  <button class="ib" id="bCam" title="Camera inițială (C)">🎥</button>
  <button class="ib" id="bSound" title="Sunet (M)">🔊</button>
</div>
<div id="hint" class="chip"></div>
<div id="aimpad">
  <button id="bLeft" title="Țintește la stânga (←)">◀</button>
  <button id="bRight" title="Țintește la dreapta (→)">▶</button>
</div>
<div id="rotate"><div class="panel">
  <div class="phone">📱</div>
  <h2>Întoarce telefonul</h2>
  <p>Jocul se vede mult mai bine pe orizontală (landscape): ai loc să tragi de praștie și vezi toată cetatea.</p>
  <div class="row"><button id="rFull">⛶ Ecran complet</button><button class="sec" id="rClose">Joacă așa</button></div>
</div></div>
<div id="overlay"><div class="panel" id="panel"></div></div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// =====================================================================
//  Constante
// =====================================================================
const G = 15;            // gravitație
const VMAX = 27;         // viteza maximă de lansare
const H = 1 / 120;       // pasul fizicii
const P0 = new THREE.Vector3(0, 2.45, 0);           // locul pisicii în praștie
const TIPS = [new THREE.Vector3(0, 2.6, -0.52), new THREE.Vector3(0, 2.6, 0.52)];
const SAVE_KEY = 'pisici3d';

const CATS = {
  tigru:  { name: 'Tigrișor', color: 0xf39a2b, dark: 0xb8580f, r: 0.45, mass: 3,   ability: null,    hint: 'Pisica de bază: lovește tare.' },
  umbra:  { name: 'Umbra',    color: 0x2d2d36, dark: 0x15151a, r: 0.42, mass: 2.4, ability: 'split', hint: '<b>Click / Space în zbor</b>: se împarte în 3.' },
  fulger: { name: 'Fulger',   color: 0xf6d743, dark: 0xd19a16, r: 0.42, mass: 2.6, ability: 'dash',  hint: '<b>Click / Space în zbor</b>: țâșnește înainte.' },
  bomba:  { name: 'Grăsuna',  color: 0x9aa3ad, dark: 0x5f6873, r: 0.6,  mass: 5,   ability: 'boom',  hint: '<b>Click / Space</b>: face BUM (și după ce lovește).' },
};
const ENEMY = {
  rat:  { name: 'Șoarece',       r: 0.38, hp: 4,  mass: 0.6, score: 3000 },
  dog:  { name: 'Câine',         r: 0.62, hp: 9,  mass: 1.6, score: 5000 },
  boss: { name: 'Motanul Rău',   r: 0.9,  hp: 24, mass: 3,   score: 15000 },
};
const MATS = {
  wood:  { density: 0.7, hp: 14, score: 500 },
  glass: { density: 0.5, hp: 5,  score: 300 },
  stone: { density: 2.2, hp: 40, score: 800 },
  tnt:   { density: 0.6, hp: 3,  score: 1000 },
  base:  { density: 0,   hp: Infinity, score: 0 },
};

// =====================================================================
//  Sunet (sintetizat, fără fișiere)
// =====================================================================
let AC = null, master = null;
let muted = false;
try { muted = localStorage.getItem(SAVE_KEY + '-mute') === '1'; } catch (e) {}
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(AC.destination);
    } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
let NB = null;
function noiseBuf() {
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return NB;
}
function env(g, t, a, peak, dur) {
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function noise({ dur = 0.2, type = 'lowpass', f = 1000, f2 = null, q = 1, vol = 0.4, delay = 0 }) {
  if (!AC) return; const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf();
  const fl = AC.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = AC.createGain(); env(g, t, 0.005, vol, dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
function tone({ type = 'sine', f = 440, f2 = null, dur = 0.2, vol = 0.3, delay = 0, a = 0.01 }) {
  if (!AC) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = AC.createGain(); env(g, t, a, vol, dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function meow(pitch = 1, len = 0.6, vol = 0.45) {
  if (!AC) return; const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(430 * pitch, t); o.frequency.linearRampToValueAtTime(800 * pitch, t + len * 0.3); o.frequency.linearRampToValueAtTime(500 * pitch, t + len);
  const f1 = AC.createBiquadFilter(); f1.type = 'bandpass'; f1.Q.value = 3.5;
  f1.frequency.setValueAtTime(650, t); f1.frequency.linearRampToValueAtTime(1700, t + len * 0.35); f1.frequency.linearRampToValueAtTime(800, t + len);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.06); g.gain.setValueAtTime(vol, t + len * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(f1); f1.connect(g); g.connect(master); o.start(t); o.stop(t + len + 0.05);
}
const SFX = {
  stretch() { tone({ type: 'triangle', f: 160, f2: 260, dur: 0.12, vol: 0.08 }); },
  launch() { noise({ dur: 0.35, type: 'bandpass', f: 400, f2: 2500, q: 2, vol: 0.35 }); tone({ type: 'triangle', f: 220, f2: 90, dur: 0.15, vol: 0.25 }); },
  wood() { noise({ dur: 0.18, f: 700, vol: 0.5 }); tone({ type: 'square', f: 140, f2: 70, dur: 0.12, vol: 0.12 }); },
  stone() { noise({ dur: 0.25, f: 350, vol: 0.6 }); tone({ f: 70, f2: 40, dur: 0.2, vol: 0.3 }); },
  glass() { noise({ dur: 0.3, type: 'highpass', f: 3500, vol: 0.35 }); for (let i = 0; i < 4; i++) tone({ f: 2400 + Math.random() * 2400, dur: 0.25, vol: 0.06, delay: i * 0.03 }); },
  tnt() { SFX.boom(); },
  boom() { noise({ dur: 1.1, f: 900, f2: 60, vol: 0.9 }); tone({ f: 90, f2: 30, dur: 0.8, vol: 0.5 }); },
  thud() { tone({ f: 120, f2: 60, dur: 0.1, vol: 0.2 }); },
  woof() { for (let i = 0; i < 2; i++) { tone({ type: 'square', f: 230, f2: 120, dur: 0.12, vol: 0.18, delay: i * 0.17 }); noise({ dur: 0.1, type: 'bandpass', f: 600, q: 3, vol: 0.25, delay: i * 0.17 }); } },
  whimper() { tone({ type: 'triangle', f: 900, f2: 500, dur: 0.35, vol: 0.18 }); },
  squeak() { tone({ f: 1900, f2: 2900, dur: 0.08, vol: 0.18 }); tone({ f: 2600, f2: 1600, dur: 0.12, vol: 0.15, delay: 0.09 }); },
  hiss() { noise({ dur: 0.5, type: 'highpass', f: 2500, vol: 0.3 }); meow(0.7, 0.5, 0.3); },
  poof() { noise({ dur: 0.25, type: 'bandpass', f: 1200, f2: 300, q: 1, vol: 0.3 }); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.25, vol: 0.2, delay: i * 0.13 })); setTimeout(() => meow(1.2), 600); },
  lose() { [392, 330, 262].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.35, vol: 0.2, delay: i * 0.2 })); },
  dash() { noise({ dur: 0.3, type: 'bandpass', f: 800, f2: 4000, q: 3, vol: 0.4 }); },
};

// =====================================================================
//  Three.js
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#3f8fe0'); g.addColorStop(0.55, '#8fd0ff'); g.addColorStop(1, '#dff3ff');
  x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
scene.fog = new THREE.Fog(0xcdeeff, 70, 190);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);

scene.add(new THREE.HemisphereLight(0xdff0ff, 0x6b8f3a, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.4);
sun.position.set(0, 45, 30); sun.target.position.set(20, 0, 0);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 1, far: 120 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- decor ----------
{
  const grass = canvasTex(256, 256, (x, w, h) => {
    x.fillStyle = '#6cb544'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 2500; i++) { x.fillStyle = Math.random() < 0.5 ? '#5ea83b' : '#7cc452'; x.fillRect(Math.random() * w, Math.random() * h, 2, 5); }
  });
  grass.wrapS = grass.wrapT = THREE.RepeatWrapping; grass.repeat.set(60, 60);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ map: grass, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  // dealuri
  const hillMat = new THREE.MeshStandardMaterial({ color: 0x5f9e3c, roughness: 1 });
  for (let i = 0; i < 14; i++) {
    const r = rnd(18, 40); const a = rnd(-1.2, 1.2) + (i % 2 ? Math.PI : 0) * 0;
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 12), hillMat);
    m.position.set(rnd(-60, 130), -r * 0.72, i < 7 ? rnd(-140, -70) : rnd(80, 150));
    m.scale.y = 0.6; scene.add(m);
  }
  // copaci
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a4d28, roughness: 1 });
  const leafMats = [0x3d8b37, 0x4c9f3f, 0x2f7a35].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }));
  const trunkGeo = new THREE.CylinderGeometry(0.25, 0.35, 2, 8), crownGeo = new THREE.IcosahedronGeometry(1.6, 1);
  let placed = 0;
  while (placed < 55) {
    const x = rnd(-45, 85), z = rnd(-55, 40);
    if (x > -14 && x < 48 && z > -16 && z < 20) continue;
    const s = rnd(0.8, 1.6);
    const t = new THREE.Group();
    const tr = new THREE.Mesh(trunkGeo, trunkMat); tr.position.y = 1; tr.castShadow = true;
    const cr = new THREE.Mesh(crownGeo, leafMats[placed % 3]); cr.position.y = 2.9; cr.castShadow = true;
    t.add(tr, cr); t.scale.setScalar(s); t.position.set(x, 0, z); t.rotation.y = rnd(0, 6); scene.add(t); placed++;
  }
  // gard în spate
  const fenceMat = new THREE.MeshStandardMaterial({ color: 0xe9d7b5, roughness: 0.9 });
  for (let x = -12; x <= 46; x += 1.5) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.3, 0.15), fenceMat); p.position.set(x, 0.65, -17); p.castShadow = true; scene.add(p);
  }
  for (const y of [0.5, 1.0]) { const b = new THREE.Mesh(new THREE.BoxGeometry(58, 0.12, 0.06), fenceMat); b.position.set(17, y, -16.93); scene.add(b); }
  // căsuța pisicilor
  const house = new THREE.Group();
  const wall = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 4), new THREE.MeshStandardMaterial({ color: 0xf6c28b }));
  wall.position.y = 1.5; wall.castShadow = true;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(3.4, 2.2, 4), new THREE.MeshStandardMaterial({ color: 0xc0392b })); roof.position.y = 4.1; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
  const door = new THREE.Mesh(new THREE.CircleGeometry(0.7, 20, 0, Math.PI), new THREE.MeshStandardMaterial({ color: 0x4a2b17 })); door.position.set(2.01, 0.01, 0); door.rotation.y = Math.PI / 2;
  house.add(wall, roof, door); house.position.set(-9, 0, -6); scene.add(house);
}
// nori
const clouds = [];
{
  const cm = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xffffff, emissiveIntensity: 0.25 });
  const sg = new THREE.SphereGeometry(1, 12, 10);
  for (let i = 0; i < 12; i++) {
    const g = new THREE.Group();
    for (let j = 0; j < 5; j++) { const s = new THREE.Mesh(sg, cm); s.position.set(j * 1.6 - 3.2, rnd(-0.3, 0.6), rnd(-0.8, 0.8)); s.scale.setScalar(rnd(1.2, 2.2)); g.add(s); }
    g.position.set(rnd(-60, 120), rnd(22, 38), rnd(-110, -40)); g.userData.v = rnd(0.5, 1.5); scene.add(g); clouds.push(g);
  }
}

// ---------- praștia ----------
function cylBetween(mesh, a, b) {
  const d = new THREE.Vector3().subVectors(b, a); const L = d.length();
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.scale.set(1, Math.max(L, 0.001), 1);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
}
const sling = new THREE.Group();
{
  const wm = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
  const cg = new THREE.CylinderGeometry(0.13, 0.15, 1, 10);
  const base = new THREE.Vector3(0, 0, 0), fork = new THREE.Vector3(0, 1.7, 0);
  const t = new THREE.Mesh(cg, wm); cylBetween(t, base, fork); t.castShadow = true; sling.add(t);
  for (const tip of TIPS) { const m = new THREE.Mesh(cg, wm); cylBetween(m, fork, tip); m.castShadow = true; sling.add(m); }
  scene.add(sling);
}
const bandMat = new THREE.MeshStandardMaterial({ color: 0x5b2a12, roughness: 0.6 });
const bandGeo = new THREE.CylinderGeometry(0.05, 0.05, 1, 6);
const bands = [new THREE.Mesh(bandGeo, bandMat), new THREE.Mesh(bandGeo, bandMat)];
const pouch = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.35, 0.6), bandMat);
scene.add(...bands, pouch);
function setBands(p) {
  cylBetween(bands[0], TIPS[0], p); cylBetween(bands[1], TIPS[1], p); pouch.position.copy(p);
}

// ---------- trajectoria ----------
// puncte albe cu contur închis, vizibile și prin obiecte
const DOTS = 60;
const dotOut = new THREE.InstancedMesh(new THREE.SphereGeometry(0.34, 12, 8), new THREE.MeshBasicMaterial({ color: 0x2a1a08, transparent: true, opacity: 0.6, depthTest: false }), DOTS);
const dots = new THREE.InstancedMesh(new THREE.SphereGeometry(0.24, 12, 8), new THREE.MeshBasicMaterial({ color: 0xfff3a0, transparent: true, opacity: 1, depthTest: false }), DOTS);
dotOut.renderOrder = 10; dots.renderOrder = 11;
for (const d of [dotOut, dots]) { d.frustumCulled = false; d.count = 0; scene.add(d); }
// urma lăsată de pisica lansată (rămâne până la următoarea lansare)
const TRAIL = 400;
const trail = new THREE.InstancedMesh(new THREE.SphereGeometry(0.17, 10, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }), TRAIL);
trail.frustumCulled = false; trail.count = 0; trail.renderOrder = 9; scene.add(trail);
let trailN = 0, trailT = 0;
function trailReset() { trailN = 0; trail.count = 0; }
function trailAdd(p, big) {
  if (trailN >= TRAIL) return;

function blockTex(type, lvl) {

      x.strokeStyle = 'rgba(110,60,20,.35)'; x.lineWidth = 2;

      x.strokeStyle = '#7a4a1e'; x.lineWidth = 8; x.strokeRect(0, 0, w, h);
      cracks(x, w, h, lvl * 3, 'rgba(40,20,5,.85)');
    } else if (type === 'stone' || type === 'base') {
      x.fillStyle = type === 'base' ? '#7d7f86' : '#a4a6ad'; x.fillRect(0, 0, w, h);
      for (let i = 0; i < 300; i++) { x.fillStyle = `rgba(${Math.random() < .5 ? '60,60,70' : '230,230,235'},.18)`; x.beginPath(); x.arc(Math.random() * w, Math.random() * h, rnd(1, 5), 0, 7); x.fill(); }
      x.strokeStyle = '#5c5e66'; x.lineWidth = 8; x.strokeRect(0, 0, w, h);
      cracks(x, w, h, lvl * 3, 'rgba(25,25,30,.9)');
    } else if (type === 'glass') {
      x.fillStyle = '#bfe8ff'; x.fillRect(0, 0, w, h);
      x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.moveTo(20, 0); x.lineTo(45, 0); x.lineTo(0, 45); x.lineTo(0, 20); x.fill();

    } else if (type === 'tnt') {
      x.fillStyle = '#d23b2b'; x.fillRect(0, 0, w, h);
      x.fillStyle = '#ffd34d'; x.fillRect(0, 44, w, 40);
      x.fillStyle = '#3a1a10'; x.font = 'bold 34px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('BUM!', w / 2, 65);

function onCollide(e) {
  const me = e.target.obj; if (!me || me.dead) return;
  const other = e.body, oo = other.obj;
  let v = 0; try { v = Math.abs(e.contact.getImpactVelocityAlongNormal()); } catch (err) { return; }
  if (me.kind === 'cat') {
    if (!me.hit) { me.hit = true; me.body.linearDamping = 0.3; me.body.angularDamping = 0.6; if (v > 4) meow(1.3 + Math.random() * 0.3, 0.3, 0.3); }
    return;
  }
  if (S.damageT > 0 || v < 1.8) return;
  const om = other.mass === 0 ? 2.5 : Math.min(other.mass, 4);
  const dmg = (v - 1.5) * om * 0.9;
  if (dmg > 0.4) damage(me, dmg, oo);
}

function addBody(body, obj) {
  body.obj = obj; body.addEventListener('collide', onCollide);
  body.sleepSpeedLimit = 0.2; body.sleepTimeLimit = 0.6;

}

  const md = MATS[type];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), BMAT[type][0]);
  mesh.castShadow = type !== 'glass'; mesh.receiveShadow = true;
  const vol = w * h * d;
  const body = new CANNON.Body({ mass: md.density * vol, shape: new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)), material: dMat, position: new CANNON.Vec3(x, y + h / 2, z), linearDamping: 0.05, angularDamping: 0.1 });
  const hp = md.hp * Math.pow(Math.min(Math.max(vol, 0.4), 3), 0.6);
  const o = { kind: 'block', type, mesh, body, hp, maxHp: hp, dead: false };
  addBody(body, o); levelGroup.add(mesh); S.objs.push(o);
  mesh.position.copy(body.position);
  return o;
}

    if (p.puff) { p.m.position.addScaledVector(p.v, dt); p.v.multiplyScalar(1 - dt * 2); p.m.scale.setScalar(p.s * (0.5 + k)); p.m.material.opacity = 0.9 * (1 - k); continue; }

function damage(o, amt, src) {

  if (o.kind === 'block') {
    addScore(Math.min(amt, Math.max(before, 0)) * 10);
    if (o.hp <= 0) {
      o.dead = true; S.breakQ.push(o);
      if (src && src.kind === 'cat') src.restore = Math.max(src.restore || 0, { glass: 0.85, wood: 0.6, stone: 0.35, tnt: 0.5 }[o.type]);
    } else {

}
function processQueues() {
  let any = false;
  while (S.breakQ.length) {
    const o = S.breakQ.shift(); any = true;
    const p = new THREE.Vector3().copy(o.body.position);
    removeObj(o);
    if (o.kind === 'block') {
      SFX[o.type]();
      debris(p, BLOCK_COL[o.type], o.type === 'glass' ? 14 : 10, 0.25, 5);
      if (MATS[o.type].score) { addScore(MATS[o.type].score); floatText(p, MATS[o.type].score, 'blk'); }
      if (o.type === 'tnt') S.explQ.push({ p, R: 4.2, power: 16, dmg: 40 });
    } else if (o.kind === 'enemy') {
      const e = ENEMY[o.type];
      puff(p, 0xffffff, 10, o.body.shapes[0].radius * 0.7);
      debris(p, o.type === 'dog' ? 0x9b6a3c : o.type === 'rat' ? 0x8d8f99 : 0x6c3d91, 6, 0.15, 4);
      o.type === 'rat' ? SFX.squeak() : o.type === 'dog' ? SFX.whimper() : SFX.hiss();

  let want = S.view.tgt, wantDist = S.view.dist, wantAz = -0.55, wantEl = 0.3;
  if (S.mode === 'fly') {
    const lead = S.flying.find(c => !c.dead);

const keys = {};
let acc = 0;
function physicsStep(h) {
  for (const c of S.flying) c.prev.copy(c.body.velocity);
  world.step(h);
  for (const c of S.flying) if (c.restore && !c.dead) { c.body.velocity.copy(c.prev); c.body.velocity.scale(c.restore, c.body.velocity); c.restore = 0; }
  processQueues();
  for (const o of S.objs) {
    if (o.dead || o.body.mass === 0) continue;
    const p = o.body.position;
    if (p.y < -3 || Math.abs(p.x) > 250 || Math.abs(p.z) > 250) { o.dead = true; if (o.kind === 'enemy') S.breakQ.push(o); else removeObj(o); }
  }
  for (const c of S.flying) if (!c.dead && (c.body.position.y < -3 || c.body.position.x > 250)) { c.dead = true; removeObj(c); }

}
const tmpQ = new THREE.Vector3();
function update(dt) {
  S.t += dt; sfxThrottle -= dt;

  if (S.mode === 'aim' || S.mode === 'hop') {
    const yawSp = 0.45, pitchSp = 0.7;
    if (keys.left) S.yaw = Math.max(-0.6, S.yaw - yawSp * dt);
    if (keys.right) S.yaw = Math.min(0.6, S.yaw + yawSp * dt);
    if (keys.up) S.pitch = Math.min(1.4, S.pitch + pitchSp * dt);
    if (keys.down) S.pitch = Math.max(-0.2, S.pitch - pitchSp * dt);
    if (keys.more) S.power = Math.min(1, S.power + 0.5 * dt);
    if (keys.less) S.power = Math.max(0.1, S.power - 0.5 * dt);
  }
  if (S.mode !== 'menu') {

    while (acc >= H && n < 10) { physicsStep(H); acc -= H; n++; }
    if (n >= 10) acc = 0;
  }
  // sincronizează plasele
  for (const o of S.objs) if (!o.dead) { o.mesh.position.copy(o.body.position); o.mesh.quaternion.copy(o.body.quaternion); }
  for (const c of S.flying) if (!c.dead) { c.mesh.position.copy(c.body.position); c.mesh.quaternion.copy(c.body.quaternion); }
  for (const e of S.enemies) if (!e.dead) { const s = Math.sin(S.t * 3 + e.phase) * 0.035; e.mesh.scale.set(1 + s, 1 - s, 1 + s); }
  // coada de pisici
  for (const q of S.queueMeshes) {
    if (!q.want) continue; q.mesh.position.lerp(q.want, 1 - Math.exp(-dt * 6));
    q.mesh.position.y = q.want.y + Math.abs(Math.sin(S.t * 4 + q.want.x)) * 0.12;
  }
  // praștia
  const dir = aimDir(new THREE.Vector3());
  if (S.mode === 'hop' && S.cur) {
    S.hopT += dt / 0.45; const k = Math.min(S.hopT, 1);
    S.cur.mesh.position.lerpVectors(S.hopFrom, P0, k); S.cur.mesh.position.y += Math.sin(k * Math.PI) * 1.8;
    setBands(P0);
    if (k >= 1) { S.mode = 'aim'; updateHud(); }
  } else if (S.mode === 'aim' && S.cur) {
    const pull = S.power * 1.5 + 0.05;
    const pos = tmpQ.copy(P0).addScaledVector(dir, -pull);
    S.cur.mesh.position.copy(pos); S.cur.mesh.rotation.set(0, -S.yaw, S.pitch * 0.6);
    setBands(pos.clone().addScaledVector(dir, -CATS[S.cur.key].r));
  } else setBands(P0);
  // traiectoria
  const show = S.mode === 'aim';
  const m4 = new THREE.Matrix4(); let shown = 0;
  if (show) {
    const v = dir.multiplyScalar(S.power * VMAX);
    for (let i = 1; i <= DOTS; i++) {
      const t = i * 0.05;
      const x = P0.x + v.x * t, y = P0.y + v.y * t - 0.5 * G * t * t, z = P0.z + v.z * t;
      if (y < 0) break;
      const s = 1 - i / DOTS * 0.45;
      m4.makeScale(s, s, s).setPosition(x, y, z); dots.setMatrixAt(shown, m4); dotOut.setMatrixAt(shown++, m4);
    }
  }
  dots.count = dotOut.count = shown; dots.instanceMatrix.needsUpdate = dotOut.instanceMatrix.needsUpdate = true;
  // sfârșitul rândului
  if (S.mode === 'fly') {
    S.turnT += dt; trailT += dt;
    if (trailT > 0.035) { trailT = 0; for (const c of S.flying) if (!c.dead && !c.hit) trailAdd(c.body.position, false); }
    let moving = false;
    for (const o of S.objs.concat(S.flying)) {
      if (o.dead || o.body.mass === 0 || !o.body.world) continue;
      if (o.body.sleepState !== CANNON.Body.SLEEPING && o.body.velocity.length() > (o.kind === 'cat' ? 0.6 : 0.35)) { moving = true; break; }
    }
    if ((S.turnT > 2.2 && !moving) || S.turnT > 15) endTurn();
  }
  for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 140) c.position.x = -70; }
  updateParts(dt);
  updateCamera(dt);
  updateFloats(dt);
}

// =====================================================================
//  Interfața
// =====================================================================
const $ = id => document.getElementById(id);
function hex(c) { return '#' + new THREE.Color(c).getHexString(); }
function updateHud() {
  const lv = LEVELS[S.level];
  $('lvl').textContent = `Nivelul ${S.level + 1}: ${lv.name}`;
  $('score').textContent = S.score.toLocaleString('ro-RO');
  const b = save[S.level]; $('best').textContent = b ? `Record: ${b.best.toLocaleString('ro-RO')}` : '';
  const q = $('queue'); q.innerHTML = '';
  const list = (S.cur ? [S.cur.key] : []).concat(S.queueMeshes.map(m => m.key));
  list.forEach((k, i) => { const d = document.createElement('div'); d.className = 'qcat' + (i === 0 && S.cur ? ' cur' : ''); d.style.background = hex(CATS[k].color); d.title = CATS[k].name; q.appendChild(d); });
  let h = '';
  if (S.mode === 'aim' || S.mode === 'hop') {
    const k = S.cur ? CATS[S.cur.key] : null;
    h = `<b>Trage înapoi</b> cu mouse-ul / degetul și dă drumul · <b>◀ ▶</b> țintește lateral` + (k ? `<br>${k.name}: ${k.hint}` : '');
  } else if (S.mode === 'fly') {
    const c = S.flying[0]; h = c && c.def.ability && !S.abilityUsed ? `${c.def.name}: ${c.def.hint}` : 'Miauuu!';
  }
  $('hint').innerHTML = h; $('hint').style.display = h ? '' : 'none';
}
function starsHtml(n) { return [0, 1, 2].map(i => i < n ? '★' : '<span class="off">★</span>').join(''); }
function showOverlay(html) { $('panel').innerHTML = html; $('overlay').classList.add('show'); }
function hideOverlay() { $('overlay').classList.remove('show'); }
function showMenu() {
  S.mode = 'menu'; updateHud();
  const lv = LEVELS.map((l, i) => `<button data-l="${i}"><span class="n">${i + 1}</span><span class="nm">${l.name}</span><span class="stars">${starsHtml((save[i] || {}).stars || 0)}</span></button>`).join('');
  showOverlay(`<h1>🐱 Pisici în Zbor 3D</h1>
    <p>Câinii, șoarecii și Motanul Rău s-au ascuns în cetăți de lemn, sticlă și piatră. Lansează pisicile cu praștia și dărâmă-le!</p>
    <div class="levels">${lv}</div>
    <div class="help">
      🖱️ <b>Trage înapoi</b> pisica (ca la o praștie) și dă drumul. Cu cât tragi mai mult, cu atât zboară mai tare.<br>
      ◀ ▶ sau <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd>: țintești la stânga sau la dreapta.<br>
      <kbd>↑</kbd><kbd>↓</kbd> unghiul, <kbd>W</kbd><kbd>S</kbd> puterea, <kbd>Space</kbd> lansează.<br>
      <b>Click</b> sau <kbd>Space</kbd> în zbor: puterea pisicii (Umbra se împarte în 3, Fulger țâșnește, Grăsuna face BUM).<br>
      Click dreapta + trage: rotești camera · rotița: zoom · <kbd>R</kbd> din nou · <kbd>Esc</kbd> meniu
    </div>`);
  $('panel').querySelectorAll('[data-l]').forEach(b => b.onclick = () => { audio(); loadLevel(+b.dataset.l); });
}
function showResult() {
  const r = S.result; const last = S.level >= LEVELS.length - 1;
  if (r.won) {
    showOverlay(`<h2>${last ? 'Ai învins Motanul Rău! 👑' : 'Nivel terminat! 🎉'}</h2><div class="stars big">${starsHtml(r.stars)}</div>
      <p>Scor: <b>${S.score.toLocaleString('ro-RO')}</b></p>
      <div class="row">${last ? '' : '<button id="oNext">Nivelul următor ▶</button>'}<button class="sec" id="oAgain">↻ Din nou</button><button class="sec" id="oMenu">☰ Meniu</button></div>`);
  } else {
    showOverlay(`<h2>Câinii au rezistat! 🐶</h2><p>Mai încearcă: țintește stâlpii de jos ca să cadă tot turnul.</p>
      <div class="row"><button id="oAgain">↻ Din nou</button><button class="sec" id="oMenu">☰ Meniu</button></div>`);
  }
  const n = $('oNext'); if (n) n.onclick = () => loadLevel(S.level + 1);
  $('oAgain').onclick = () => loadLevel(S.level);
  $('oMenu').onclick = showMenu;
}

// ---------- intrări ----------
let orbit = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  audio();
  if (e.button === 2 || e.button === 1) { orbit = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); return; }
  if (S.mode === 'aim' || S.mode === 'hop') {
    S.dragging = true; S.dragMoved = false; S.dragStart = { x: e.clientX, y: e.clientY, pitch: S.pitch, power: S.power };
    canvas.setPointerCapture(e.pointerId);
  } else if (S.mode === 'fly') useAbility();
});
let lastStretch = 0;
canvas.addEventListener('pointermove', e => {
  if (orbit) {
    cam.userAz -= (e.clientX - orbit.x) * 0.005; cam.userEl = THREE.MathUtils.clamp(cam.userEl + (e.clientY - orbit.y) * 0.004, -0.25, 1.0);
    orbit.x = e.clientX; orbit.y = e.clientY; return;
  }
  if (!S.dragging) return;
  const dx = e.clientX - S.dragStart.x, dy = e.clientY - S.dragStart.y;
  const len = Math.hypot(dx, dy);
  if (len < 12 && !S.dragMoved) return;
  S.dragMoved = true;
  const fx = -dx, fy = dy;
  let a = Math.atan2(fy, fx);
  if (a > 1.4 || a < -Math.PI / 2) a = fx < 0 && fy > 0 ? 1.4 : a > 1.4 ? 1.4 : -0.2;
  S.pitch = THREE.MathUtils.clamp(a, -0.2, 1.4);
  const prev = S.power;
  S.power = THREE.MathUtils.clamp(len / (Math.min(innerWidth, innerHeight) * 0.3), 0, 1);
  if (Math.abs(S.power - prev) > 0.05 && performance.now() - lastStretch > 90) { SFX.stretch(); lastStretch = performance.now(); }
});
function endDrag(e) {
  if (orbit) { orbit = null; return; }
  if (!S.dragging) return;
  S.dragging = false;
  if (!S.dragMoved) return;
  if (S.power < 0.12) { S.power = S.dragStart.power; S.pitch = S.dragStart.pitch; return; }
  if (S.mode === 'aim') launch();
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', e => { orbit = null; S.dragging = false; });
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = THREE.MathUtils.clamp(cam.zoom * (1 + Math.sign(e.deltaY) * 0.1), 0.45, 2.2); }, { passive: false });

const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', ArrowDown: 'down', KeyW: 'more', KeyS: 'less' };
addEventListener('keydown', e => {
  audio();
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); return; }
  if (e.code === 'Space') { e.preventDefault(); if (e.repeat) return; if (S.mode === 'aim') launch(); else if (S.mode === 'fly') useAbility(); }
  else if (e.code === 'KeyR') { if (S.mode !== 'menu') loadLevel(S.level); }
  else if (e.code === 'Escape') { if (S.mode === 'menu') { if (S.objs.length) { hideOverlay(); S.mode = S.cur ? 'aim' : 'fly'; updateHud(); } } else showMenu(); }
  else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'KeyC') resetCam();
  else if (e.code === 'Enter' && $('overlay').classList.contains('show')) { const b = $('oNext') || $('oAgain'); if (b) b.click(); }
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
for (const [id, k] of [['bLeft', 'left'], ['bRight', 'right']]) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); keys[k] = true; b.setPointerCapture(e.pointerId); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => { keys[k] = false; });
}
function toggleMute() {
  muted = !muted; if (master) master.gain.value = muted ? 0 : 0.55;
  try { localStorage.setItem(SAVE_KEY + '-mute', muted ? '1' : '0'); } catch (e) {}
  $('bSound').textContent = muted ? '🔇' : '🔊';
}
function resetCam() { cam.userAz = 0; cam.userEl = 0; cam.zoom = 1; }
$('bSound').textContent = muted ? '🔇' : '🔊';
$('bSound').onclick = () => { audio(); toggleMute(); };
$('bMenu').onclick = () => { audio(); showMenu(); };
$('bRestart').onclick = () => { audio(); loadLevel(S.level); };
$('bCam').onclick = resetCam;

addEventListener('resize', () => { checkRotate(); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- sfat pentru landscape ----------
let rotDismissed = false;
try { rotDismissed = sessionStorage.getItem(SAVE_KEY + '-rot') === '1'; } catch (e) {}
function dismissRotate() { rotDismissed = true; try { sessionStorage.setItem(SAVE_KEY + '-rot', '1'); } catch (e) {} $('rotate').classList.remove('show'); }
function checkRotate() {
  const portrait = innerHeight > innerWidth;
  const mobile = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
  if (!portrait && $('rotate').classList.contains('show')) dismissRotate();
  else if (portrait && mobile && !rotDismissed) $('rotate').classList.add('show');
}
$('rClose').onclick = () => { audio(); dismissRotate(); };
$('rFull').onclick = async () => {
  audio();
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  try { await screen.orientation.lock('landscape'); } catch (e) {}
  dismissRotate();
};
addEventListener('orientationchange', () => setTimeout(checkRotate, 300));
checkRotate();

// =====================================================================
//  Pornire
// =====================================================================
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
loadLevel(0);
showMenu();
$('loading').remove();
frame();

// pentru teste
window.__ac = { S, world, physicsStep, loadLevel, launch, useAbility, update, CATS, LEVELS,
  aim(pitch, yaw, power) { S.pitch = pitch; S.yaw = yaw; S.power = power; } };
</script>
</body>
</html>
