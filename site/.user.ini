; Raised so photo uploads from phones work - default PHP allows only 2M, while a modern phone
; photo is easily 3-8 MB. post_max_size must stay larger than upload_max_filesize, since it caps
; the whole request body (file + form fields).
;
; This file is read by PHP running as CGI/FastCGI/FPM (the usual setup on shared hosting).
; For mod_php setups the same values are set in .htaccess instead - having both is harmless.
upload_max_filesize = 20M
post_max_size = 25M

; GD needs room to hold a decoded image while downscaling: a 12 MP photo is ~48 MB uncompressed.
memory_limit = 256M

; Slow mobile connections need more than the default 30s to finish a large upload.
max_execution_time = 120
max_input_time = 120
