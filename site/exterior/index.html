  button:hover { border-color: var(--accent); }

  #tools { border-right: 1px solid var(--border); overflow-y: auto; padding: 8px 6px; display: flex; flex-direction: column; gap: 4px; }
  #tools .glbl { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin: 8px 2px 2px; }

  .card h2 b { color: var(--text); font-size: 14px; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fld label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  .fld.wide { grid-column: 1 / -1; }
  .fld .in { display: flex; align-items: center; gap: 5px; }
  .fld.chk label { display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 13px; margin-top: 6px; cursor: pointer; }
  .unit { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .muted { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .btns button { flex: 1 1 auto; }
  button.danger:hover { border-color: #ff5a5a; color: #ff8080; }

  .kv span:nth-child(odd) { color: var(--muted); }
  .kv b { font-weight: 600; }
  .bar { height: 8px; border-radius: 4px; background: #2a3038; overflow: hidden; display: flex; margin-top: 8px; }
  .bar i { display: block; height: 100%; }
  ul.help { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; line-height: 1.55; }
  ul.help b { color: var(--text); font-weight: 600; }

  .ov { position: absolute; z-index: 5; }

  #hint button { pointer-events: auto; background: rgba(11,13,16,.85); }

  #compass svg { width: 100%; height: 100%; display: block; }
  #viewbtns { left: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  #viewbtns button, #sun { background: rgba(11,13,16,.82); }
  #sun { right: 10px; bottom: 10px; border: 1px solid var(--border); border-radius: 10px; padding: 5px 10px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #sun input { width: 120px; accent-color: var(--accent); }
  .lbl { background: rgba(11,13,16,.78); color: #fff; font-size: 11.5px; padding: 1px 6px; border-radius: 6px; white-space: nowrap; pointer-events: none; font-weight: 600; }
  .lbl.ter { background: rgba(255,106,0,.85); color: #140a02; }
  .lbl.cur { background: rgba(74,168,255,.92); color: #04121f; }

  @media (max-width: 900px) {
    html, body { height: auto; }
    #app { grid-template-columns: minmax(0,1fr); display: flex; flex-direction: column; }
    #tools { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; padding: 6px; }
    #tools .glbl { display: none; }
    #tools button { flex: 0 0 66px; }
    #view { height: 62vh; flex: none; }
    #panel { border-left: 0; }
    #sun input { width: 90px; }
    #sun { bottom: 54px; }
    #viewbtns button { padding: 5px 9px; }
    #hint { right: 70px; }
  }

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const D2R = Math.PI / 180;

let S = null;

const DIRS = { N: [0, -1], NE: [.7071, -.7071], E: [1, 0], SE: [.7071, .7071], S: [0, 1], SV: [-.7071, .7071], V: [-1, 0], NV: [-.7071, -.7071] };

  gravel(g, s) { g.fillStyle = '#9c958a'; g.fillRect(0, 0, s, s); const r = rng(3); for (let i = 0; i < 9000; i++) { const v = 140 + r() * 90 | 0, t = r() * 20 - 10; g.fillStyle = `rgb(${v + t | 0},${v},${v - t - 8 | 0})`; g.beginPath(); g.ellipse(r() * s, r() * s, 1.5 + r() * 3, 1.2 + r() * 2.5, r() * 3, 0, 7); g.fill(); } },
  soil(g, s) { g.fillStyle = '#5a4030'; g.fillRect(0, 0, s, s); const r = rng(4); for (let i = 0; i < 9000; i++) { g.fillStyle = `hsl(${20 + r() * 15},${30 + r() * 20}%,${15 + r() * 22}%)`; g.fillRect(r() * s, r() * s, 1 + r() * 3, 1 + r() * 3); } },
  hedge(g, s) { g.fillStyle = '#2d5626'; g.fillRect(0, 0, s, s); const r = rng(6); for (let i = 0; i < 5000; i++) { g.fillStyle = `hsl(${95 + r() * 25},${35 + r() * 25}%,${16 + r() * 22}%)`; g.beginPath(); g.ellipse(r() * s, r() * s, 2 + r() * 4, 1.5 + r() * 3, r() * 3, 0, 7); g.fill(); } },
  plaster(g, s) { g.fillStyle = '#f2f2f2'; g.fillRect(0, 0, s, s); speckle(g, s, 16000, .07, 11); },
  tiles(g, s) { g.fillStyle = '#e8e8e8'; g.fillRect(0, 0, s, s); const rows = 3, rh = s / rows, r = rng(12);
    for (let i = 0; i < rows; i++) { const gr = g.createLinearGradient(0, i * rh, 0, (i + 1) * rh); gr.addColorStop(0, '#9c9c9c'); gr.addColorStop(.18, '#f4f4f4'); gr.addColorStop(1, '#c9c9c9'); g.fillStyle = gr; g.fillRect(0, i * rh, s, rh);
      const n = 5, off = (i % 2) * s / n / 2; g.fillStyle = 'rgba(0,0,0,.25)'; for (let k = 0; k <= n; k++) g.fillRect(k * s / n + off, i * rh, 2, rh); }
    speckle(g, s, 4000, .1, 13); },
  brick(g, s) { g.fillStyle = '#cfc7bb'; g.fillRect(0, 0, s, s); const bw = s / 4, bh = s / 15, r = rng(14);
    for (let row = 0; row < 15; row++) { const off = (row % 2) * bw / 2; for (let c = -1; c < 5; c++) { g.fillStyle = shade('#9b4a35', (r() - .5) * .12); g.fillRect(c * bw + off + 2, row * bh + 2, bw - 4, bh - 3); } }
    speckle(g, s, 5000, .12, 15); },
  cobble(g, s) { g.fillStyle = '#4b4844'; g.fillRect(0, 0, s, s); const n = 10, c = s / n, r = rng(16);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = shade('#7f7c78', (r() - .5) * .16); const jx = (r() - .5) * 4, jy = (r() - .5) * 4; g.beginPath(); g.roundRect(i * c + 3 + jx, j * c + 3 + jy, c - 6, c - 6, 9); g.fill(); }
    speckle(g, s, 6000, .15, 17); },
  planks(g, s) { const n = 10, ph = s / n, r = rng(18);
    for (let i = 0; i < n; i++) { g.fillStyle = shade('#9a6b43', (r() - .5) * .1); g.fillRect(0, i * ph, s, ph);
      for (let k = 0; k < 14; k++) { g.fillStyle = `rgba(60,35,15,${.1 + r() * .15})`; g.fillRect(0, i * ph + r() * ph, s, 1); }
      g.fillStyle = '#3b2716'; g.fillRect(0, i * ph, s, 3); g.fillRect(r() * s, i * ph, 3, ph); } },
  granite(g, s) { g.fillStyle = '#8f8d8a'; g.fillRect(0, 0, s, s); const r = rng(19); for (let i = 0; i < 20000; i++) { const t = r(); g.fillStyle = t < .4 ? 'rgba(30,30,30,.5)' : t < .75 ? 'rgba(235,235,235,.45)' : 'rgba(170,120,110,.4)'; g.fillRect(r() * s, r() * s, 2, 2); } },
};
const pavers = cols => (g, s) => { g.fillStyle = '#57544f'; g.fillRect(0, 0, s, s); const r = rng(5), bw = s / 5, bh = s / 10;
  for (let row = 0; row < 10; row++) { const off = (row % 2) * bw / 2; for (let c = -1; c < 6; c++) { g.fillStyle = cols[r() * cols.length | 0]; g.fillRect(c * bw + off + 2, row * bh + 2, bw - 4, bh - 4); } }
  speckle(g, s, 7000, .14, 21); };
const slabs = (n, base, j) => (g, s) => { g.fillStyle = j; g.fillRect(0, 0, s, s); const c = s / n, r = rng(22);
  for (let i = 0; i < n; i++) for (let k = 0; k < n; k++) { g.fillStyle = shade(base, (r() - .5) * .08); g.fillRect(i * c + 2, k * c + 2, c - 4, c - 4); }
  speckle(g, s, 9000, .1, 23); };
const concrete = base => (g, s) => { g.fillStyle = base; g.fillRect(0, 0, s, s); speckle(g, s, 22000, .09, 24); g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(0, 0, s, 3); g.fillRect(0, 0, 3, s); };
const fenceTex = kind => (g, s) => { g.clearRect(0, 0, s, s); const r = rng(25);
  if (kind === 'lemn') { const n = 8, sw = s / n; for (let i = 0; i < n; i++) { g.fillStyle = shade('#8a5f3a', (r() - .5) * .1); g.fillRect(i * sw + 2, 0, sw * .72, s); for (let k = 0; k < 6; k++) { g.fillStyle = 'rgba(50,30,10,.2)'; g.fillRect(i * sw + 2 + r() * sw * .7, 0, 1, s); } } }
  else if (kind === 'metal') { g.fillStyle = '#2e3236'; for (let i = 0; i < 9; i++) g.fillRect(i * s / 9 + 4, 0, 6, s); g.fillRect(0, 10, s, 8); g.fillRect(0, s - 18, s, 8); }
  else { g.strokeStyle = '#41704a'; g.lineWidth = 2.2; const st = s / 12; g.beginPath(); for (let i = -12; i <= 24; i++) { g.moveTo(i * st, 0); g.lineTo(i * st + s, s); g.moveTo(i * st, 0); g.lineTo(i * st - s, s); } g.stroke(); g.fillStyle = '#41704a'; g.fillRect(0, 0, s, 4); g.fillRect(0, s - 4, s, 4); } };

const MATS = {
  pietris: { l: 'Pietriș', size: 1, draw: DRAW.gravel },
  pavele: { l: 'Pavele gri', size: 1, draw: pavers(['#9b9890', '#8f8c86', '#a6a29a', '#96938c']) },
  pavele_rosu: { l: 'Pavele roșii', size: 1, draw: pavers(['#9a5a48', '#8b4f3f', '#a86552', '#86503f']) },
  pavele_bej: { l: 'Pavele bej', size: 1, draw: pavers(['#c9b99a', '#bba989', '#d4c4a6', '#c2b08f']) },
  dale: { l: 'Dale 40×40', size: 1.2, draw: slabs(3, '#b3aea4', '#7a766e') },
  gresie: { l: 'Gresie 60×60', size: 1.2, draw: slabs(2, '#d6cfc3', '#9a958c') },
  beton: { l: 'Beton', size: 2, draw: concrete('#a4a19b') },
  piatra: { l: 'Piatră cubică', size: 1, draw: DRAW.cobble },
  lemn: { l: 'Deck lemn', size: 1.4, draw: DRAW.planks },
  pamant: { l: 'Pământ', size: 1.5, draw: DRAW.soil },
  granit: { l: 'Granit', size: 1, draw: DRAW.granite },
  beton_alb: { l: 'Beton deschis', size: 1, draw: concrete('#c6c3bc') },
  iarba: { l: 'Iarbă', size: 2, draw: DRAW.grass },
  hedge: { size: 1, draw: DRAW.hedge }, caramida: { size: 1, draw: DRAW.brick }, tencuiala: { size: 2, draw: DRAW.plaster }, tigla: { size: 1, draw: DRAW.tiles },
  f_lemn: { size: 1, draw: fenceTex('lemn'), px: 256 }, f_metal: { size: 1, draw: fenceTex('metal'), px: 256 }, f_plasa: { size: 1, draw: fenceTex('plasa'), px: 256 },

const texCache = {};
function tex(name) {

/* ───────────────────────── Geometrie ───────────────────────── */
class GB {

  quad(a, b, c, d) { this.tri(a, b, c); this.tri(a, c, d); }

function offsets(pts, hw, closed) {

    const p = pts[i], prev = i > 0 ? pts[i - 1] : (closed ? pts[n - 1] : null), next = i < n - 1 ? pts[i + 1] : (closed ? pts[0] : null);

    if (prev) { const dx = p.x - prev.x, dz = p.z - prev.z, l = Math.hypot(dx, dz) || 1; n1 = [-dz / l, dx / l]; }
    if (next) { const dx = next.x - p.x, dz = next.z - p.z, l = Math.hypot(dx, dz) || 1; n2 = [-dz / l, dx / l]; }
    let m = n1 || n2 || [0, 1], sc = 1;
    if (n1 && n2) { const mx = n1[0] + n2[0], mz = n1[1] + n2[1], ml = Math.hypot(mx, mz); if (ml > 1e-6) { m = [mx / ml, mz / ml]; sc = 1 / Math.max(.3, m[0] * n1[0] + m[1] * n1[1]); } }
    L.push({ x: p.x + m[0] * hw * sc, z: p.z + m[1] * hw * sc }); R.push({ x: p.x - m[0] * hw * sc, z: p.z - m[1] * hw * sc });
  }

}
// bandă care urmărește terenul (alee, bordură, gard...), coordonate în lume
function ribbon(pts, width, b, t, size, opt = {}) {

  let v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? parseFloat(el.value) : el.value;

  if (s === 'ui') { if (k === 'snap') v = +v; UI[k] = v; saveUI(); if (gridObj) gridObj.visible = UI.grid; updateSun(); return; }
  if (s === 'def') { DEF[tool][k] = v; return; }
  if (s === 'ter') { S.terrain[k] = v; rebuildAll(); if (final) commit(); return; }
  const it = getItem(sel); if (!it) return; it[k] = v;
  if (it.type === 'house' && k === 'floors') it.floors = Math.round(v);
  rebuildItem(it); refreshSel(); if (final) commit(); else updStats();
}

/* ───────────────────────── Vedere ───────────────────────── */
function fit(top) {
  const t = S.terrain, R = Math.max(t.w, t.d) * .5 + 4, dist = R / Math.tan(camera.fov * D2R / 2) * (camera.aspect < 1 ? 1.25 / camera.aspect : 1.05);
  controls.target.set(0, 0, 0);
  if (top) camera.position.set(0, dist * 1.05, .01); else camera.position.set(dist * .45, dist * .62, dist * .78);
  controls.update();
}
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); labels.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view);
const cmpG = $('#cmpG'); $('#cmpN').textContent = 'N';
function loop() {
  requestAnimationFrame(loop); controls.update();
  for (const c of selG.children) if (c.userData.h) { const s = camera.position.distanceTo(c.position) * .011 * c.userData.hs; c.scale.setScalar(Math.max(.05, s)); }
  if (cursorRing.visible) cursorRing.scale.setScalar(Math.max(.6, camera.position.distanceTo(cursorRing.position) * .025));
  const az = controls.getAzimuthalAngle() / D2R; cmpG.setAttribute('transform', `rotate(${az} 26 26)`);
  $('#cmpN').setAttribute('transform', `rotate(${az} 26 26)`);
  renderer.render(scene, camera); labels.render(scene, camera);
}

/* ───────────────────────── Butoane ───────────────────────── */
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#v3d').onclick = () => fit(false); $('#vTop').onclick = () => fit(true); $('#vFit').onclick = () => fit(camera.position.y > camera.position.distanceTo(controls.target) * .97);
$('#compass').onclick = () => fit(true);
$('#hour').oninput = e => { UI.hour = +e.target.value; updateSun(); saveUI(); };
$('#bNew').onclick = () => { if (!confirm('Începi un proiect nou? Desenul curent se șterge (îl poți recupera cu ↶).')) return; S = { terrain: clone(S.terrain), items: [], nextId: 1 }; sel = null; rebuildAll(); commit(); renderPanel(); };
$('#bDemo').onclick = () => { if (S.items.length && !confirm('Încarci exemplul? Desenul curent se înlocuiește (îl poți recupera cu ↶).')) return; demo(); sel = null; rebuildAll(); commit(); renderPanel(); fit(false); };
$('#bExport').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'exterior', v: 1, ...S }, null, 1)], { type: 'application/json' })); a.download = 'curte.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
$('#bImport').onclick = () => $('#fImport').click();
$('#fImport').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.terrain || !Array.isArray(d.items)) throw 0; S = { terrain: d.terrain, items: d.items.filter(i => TYPES[i.type]), nextId: d.nextId || Math.max(0, ...d.items.map(i => i.id)) + 1 }; sel = null; rebuildAll(); commit(); renderPanel(); fit(false); }
  catch { alert('Fișierul nu pare un proiect „Exterior”.'); } };
$('#bPng').onclick = () => { const v = [selG.visible, prevG.visible, cursorRing.visible]; selG.visible = prevG.visible = cursorRing.visible = false; renderer.render(scene, camera);
  const a = document.createElement('a'); a.href = renderer.domElement.toDataURL('image/png'); a.download = 'curte.png'; a.click(); [selG.visible, prevG.visible, cursorRing.visible] = v; };

/* ───────────────────────── Start ───────────────────────── */
try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.terrain && Array.isArray(s.items)) S = s; } catch {}
if (!S) demo();
renderTools(); setTool('select'); resize(); rebuildAll(); commit(); renderPanel(); fit(false); loop();
window.__ext = { get S() { return S; }, camera, controls, scene };
</script>
</body>
