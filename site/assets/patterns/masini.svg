<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Fundal pentru tema "Masinute si avioane". Formele sunt definite o data in <defs> si asezate
       cu <use> in 16 pozitii fixe, alese sa nu se suprapuna si sa nu fie taiate la repetare. -->
  <defs>
    <g id="m-car">
      <rect x="3" y="21" width="34" height="11" rx="5" fill="#e0483f"/>
      <path d="M11 21 L15 13 L26 13 L31 21 Z" fill="#8fc4ea"/>
      <circle cx="12" cy="32" r="4.6" fill="#33404f"/>
      <circle cx="28" cy="32" r="4.6" fill="#33404f"/>
      <circle cx="12" cy="32" r="1.8" fill="#9fb0c2"/>
      <circle cx="28" cy="32" r="1.8" fill="#9fb0c2"/>
    </g>
    <g id="m-plane">
      <path d="M20 3 C22 3 23.5 7.5 23.5 14 L37 22 L37 26 L23.5 22.5 L23.5 30 L28 34 L28 36.5 L20 34 L12 36.5 L12 34 L16.5 30 L16.5 22.5 L3 26 L3 22 L16.5 14 C16.5 7.5 18 3 20 3 Z" fill="#4a90d9"/>
      <circle cx="20" cy="14" r="2.6" fill="#cfe6f7"/>
    </g>
    <g id="m-cloud">
      <ellipse cx="14" cy="24" rx="8" ry="7" fill="#eaf4fc"/>
      <ellipse cx="25" cy="23" rx="9" ry="8" fill="#eaf4fc"/>
      <ellipse cx="19" cy="18" rx="7.5" ry="6.5" fill="#eaf4fc"/>
      <rect x="6" y="24" width="28" height="7" rx="3.5" fill="#eaf4fc"/>
    </g>
    <g id="m-rocket">
      <path d="M20 3 C26 10 27.5 20 26.5 28 L13.5 28 C12.5 20 14 10 20 3 Z" fill="#eef4f9"/>
      <circle cx="20" cy="15" r="4.2" fill="#4a90d9"/>
      <path d="M13.5 23 L7 34 L13.5 31.5 Z" fill="#e0483f"/>
      <path d="M26.5 23 L33 34 L26.5 31.5 Z" fill="#e0483f"/>
      <path d="M17 28 L20 38 L23 28 Z" fill="#ffb703"/>
    </g>
    <g id="m-bus">
      <rect x="4" y="11" width="32" height="21" rx="5" fill="#ffb703"/>
      <rect x="8" y="15" width="10" height="7.5" rx="2" fill="#cfe6f7"/>
      <rect x="22" y="15" width="10" height="7.5" rx="2" fill="#cfe6f7"/>
      <rect x="8" y="26" width="24" height="2.4" rx="1.2" fill="#e09a02"/>
      <circle cx="12" cy="33" r="3.8" fill="#33404f"/>
      <circle cx="28" cy="33" r="3.8" fill="#33404f"/>
    </g>
    <g id="m-cone">
      <path d="M20 7 L28.5 31 L11.5 31 Z" fill="#ff7a29"/>
      <path d="M15.5 21 L24.5 21" stroke="#fdf1e2" stroke-width="3" stroke-linecap="round"/>
      <rect x="8" y="30" width="24" height="5" rx="2.5" fill="#33404f"/>
    </g>
  </defs>

  <g opacity="0.3">
    <use href="#m-car"    transform="translate(30 44) rotate(-6) scale(1.5)"/>
    <use href="#m-cloud"  transform="translate(106 40) scale(1.35)"/>
    <use href="#m-plane"  transform="translate(168 24) rotate(18) scale(1.45)"/>
    <use href="#m-cone"   transform="translate(240 38) rotate(-5) scale(1.3)"/>
    <use href="#m-bus"    transform="translate(294 52) rotate(4) scale(1.45)"/>

    <use href="#m-rocket" transform="translate(22 148) rotate(-12) scale(1.4)"/>
    <use href="#m-car"    transform="translate(86 166) rotate(7) scale(1.5)"/>
    <use href="#m-plane"  transform="translate(226 144) rotate(-24) scale(1.4)"/>
    <use href="#m-cloud"  transform="translate(300 122) scale(1.3)"/>
    <use href="#m-bus"    transform="translate(334 190) rotate(-6) scale(1.35)"/>
    <use href="#m-cone"   transform="translate(160 232) rotate(6) scale(1.3)"/>

    <use href="#m-plane"  transform="translate(248 248) rotate(38) scale(1.4)"/>
    <use href="#m-car"    transform="translate(28 280) rotate(9) scale(1.45)"/>
    <use href="#m-rocket" transform="translate(170 298) rotate(14) scale(1.4)"/>
    <use href="#m-cloud"  transform="translate(306 314) scale(1.35)"/>
    <use href="#m-car"    transform="translate(98 346) rotate(-7) scale(1.3)"/>

    <g>
      <circle cx="196" cy="98" r="4" fill="#7fc0ec"/>
      <circle cx="12" cy="118" r="3.5" fill="#ffb703"/>
      <circle cx="370" cy="64" r="3.5" fill="#e0483f"/>
      <circle cx="62" cy="242" r="4" fill="#7fc0ec"/>
      <circle cx="298" cy="216" r="3.5" fill="#ffb703"/>
      <circle cx="132" cy="302" r="4" fill="#7fc0ec"/>
      <circle cx="376" cy="288" r="3.5" fill="#e0483f"/>
      <circle cx="246" cy="374" r="4" fill="#ffb703"/>
      <circle cx="58" cy="382" r="3.5" fill="#7fc0ec"/>
    </g>
  </g>
</svg>
