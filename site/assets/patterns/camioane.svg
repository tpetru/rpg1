<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Fundal pentru tema "Camioane si tractoare". -->
  <defs>
    <g id="c-truck">
      <rect x="2" y="14" width="19" height="15" rx="2" fill="#4f8f3a"/>
      <path d="M21 18 L29 18 L34 25 L34 29 L21 29 Z" fill="#cf7420"/>
      <rect x="24" y="20" width="6.5" height="5" rx="1.2" fill="#d8e8f2"/>
      <circle cx="10" cy="31" r="4.4" fill="#332e1f"/>
      <circle cx="29" cy="31" r="4.4" fill="#332e1f"/>
      <circle cx="10" cy="31" r="1.7" fill="#9a9174"/>
      <circle cx="29" cy="31" r="1.7" fill="#9a9174"/>
    </g>
    <g id="c-tractor">
      <rect x="9" y="11" width="13" height="12" rx="2.5" fill="#4f8f3a"/>
      <rect x="11.5" y="13.5" width="8" height="6" rx="1.2" fill="#d8e8f2"/>
      <rect x="22" y="17" width="11" height="9" rx="2" fill="#cf7420"/>
      <circle cx="13" cy="28" r="7.5" fill="#332e1f"/>
      <circle cx="13" cy="28" r="3.2" fill="#9a9174"/>
      <circle cx="30" cy="30" r="4.6" fill="#332e1f"/>
      <circle cx="30" cy="30" r="1.9" fill="#9a9174"/>
    </g>
    <g id="c-hay">
      <ellipse cx="20" cy="24" rx="14" ry="11.5" fill="#dfb559"/>
      <ellipse cx="20" cy="24" rx="9" ry="7.5" fill="#eccb7f"/>
      <ellipse cx="20" cy="24" rx="4" ry="3.2" fill="#dfb559"/>
    </g>
    <g id="c-tire">
      <circle cx="20" cy="23" r="12.5" fill="#332e1f"/>
      <circle cx="20" cy="23" r="5.5" fill="#9a9174"/>
      <circle cx="20" cy="23" r="2.2" fill="#6b6247"/>
    </g>
    <g id="c-dump">
      <path d="M3 26 L6 13 L20 16 L18 29 Z" fill="#cf7420"/>
      <path d="M19 20 L28 20 L33 26.5 L33 30 L19 30 Z" fill="#a85b17"/>
      <rect x="22" y="22" width="6" height="5" rx="1.2" fill="#d8e8f2"/>
      <circle cx="11" cy="32" r="4.2" fill="#332e1f"/>
      <circle cx="28" cy="32" r="4.2" fill="#332e1f"/>
    </g>
    <g id="c-wheat">
