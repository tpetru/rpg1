      <circle cx="12" cy="118" r="3.5" fill="#dfb559"/>
      <circle cx="370" cy="62" r="3.5" fill="#cf7420"/>
      <circle cx="60" cy="242" r="4" fill="#8a9a3f"/>
      <circle cx="296" cy="214" r="3.5" fill="#dfb559"/>
      <circle cx="130" cy="300" r="4" fill="#cf7420"/>
      <circle cx="374" cy="288" r="3.5" fill="#8a9a3f"/>
      <circle cx="244" cy="374" r="4" fill="#dfb559"/>
      <circle cx="58" cy="380" r="3.5" fill="#8a9a3f"/>
    </g>
