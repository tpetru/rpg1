    <use href="#c-hay"     transform="translate(108 46) scale(1.35)"/>
    <use href="#c-tractor" transform="translate(166 24) rotate(6) scale(1.5)"/>
    <use href="#c-wheat"   transform="translate(242 34) rotate(-8) scale(1.3)"/>
    <use href="#c-dump"    transform="translate(292 52) rotate(4) scale(1.45)"/>

    <use href="#c-tire"    transform="translate(24 150) rotate(12) scale(1.3)"/>
    <use href="#c-tractor" transform="translate(84 164) rotate(-6) scale(1.55)"/>
    <use href="#c-truck"   transform="translate(226 144) rotate(8) scale(1.45)"/>
    <use href="#c-wheat"   transform="translate(302 124) rotate(9) scale(1.3)"/>
    <use href="#c-hay"     transform="translate(334 190) scale(1.35)"/>
    <use href="#c-dump"    transform="translate(158 232) rotate(-4) scale(1.4)"/>

    <use href="#c-tire"    transform="translate(252 250) rotate(-14) scale(1.3)"/>
    <use href="#c-tractor" transform="translate(28 282) rotate(5) scale(1.45)"/>
    <use href="#c-truck"   transform="translate(170 300) rotate(-7) scale(1.45)"/>
    <use href="#c-wheat"   transform="translate(310 316) rotate(11) scale(1.35)"/>
    <use href="#c-hay"     transform="translate(100 348) scale(1.2)"/>

    <g>
