      <g fill="#dfb559">
        <ellipse cx="20" cy="9" rx="3" ry="5" />
        <ellipse cx="14" cy="15" rx="2.8" ry="4.6" transform="rotate(-28 14 15)"/>
        <ellipse cx="26" cy="15" rx="2.8" ry="4.6" transform="rotate(28 26 15)"/>
        <ellipse cx="14.5" cy="23" rx="2.6" ry="4.2" transform="rotate(-28 14.5 23)"/>
        <ellipse cx="25.5" cy="23" rx="2.6" ry="4.2" transform="rotate(28 25.5 23)"/>
      </g>
    </g>
