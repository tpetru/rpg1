    <!-- Pepene -->
    <g transform="translate(172 300) rotate(-9) scale(1.5)">
      <path d="M3 32 A17 17 0 0 1 37 32 Z" fill="#57cc6b"/>
      <path d="M6.5 32 A13.5 13.5 0 0 1 33.5 32 Z" fill="#fa5a4e"/>
      <g fill="#5b3220">
        <circle cx="20" cy="24" r="1.5"/>
        <circle cx="13" cy="28" r="1.5"/>
        <circle cx="27" cy="28" r="1.5"/>
      </g>
    </g>

    <!-- Para -->
    <g transform="translate(308 316) rotate(12) scale(1.45)">
      <path d="M20 10 C23 10 25 12.5 24 15.5 C29 19 31 27 27 32 C23 38 17 38 13 32 C9 27 11 19 16 15.5 C15 12.5 17 10 20 10 Z" fill="#c9e265"/>
      <path d="M20 10 L20 4.5" stroke="#8b5e3c" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M21 6.5 C25 3.5 29 4.5 30 5.5 C28 8.5 24 9.5 21 6.5 Z" fill="#6cc24a"/>
    </g>

    <!-- Afine -->
    <g transform="translate(100 348) rotate(-5) scale(1.25)">
      <circle cx="13" cy="24" r="6.5" fill="#5b7fd6"/>
      <circle cx="26" cy="22" r="6" fill="#6b8fe0"/>
      <circle cx="20" cy="32" r="5.5" fill="#4a6cc4"/>
      <path d="M11 21 L15 21 M13 19 L13 23" stroke="#3d5aa8" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Bulinute intre alimente, ca sa nu ramana goluri mari -->
    <g>
      <circle cx="196" cy="98" r="4" fill="#57c4e8"/>
      <circle cx="12" cy="120" r="3.5" fill="#ffd23f"/>
      <circle cx="368" cy="62" r="3.5" fill="#6fd08c"/>
      <circle cx="60" cy="242" r="4" fill="#57c4e8"/>
      <circle cx="296" cy="214" r="3.5" fill="#ffb066"/>
      <circle cx="130" cy="300" r="4" fill="#6fd08c"/>
      <circle cx="374" cy="288" r="3.5" fill="#57c4e8"/>
      <circle cx="244" cy="374" r="4" fill="#ffd23f"/>
      <circle cx="58" cy="380" r="3.5" fill="#6fd08c"/>
    </g>

  </g>
</svg>
