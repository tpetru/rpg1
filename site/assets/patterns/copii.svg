<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Fundalul temei "copii" de pe /aris: un carou de 400x400 cu forme de alimente, repetat de CSS.
       Fiecare aliment e desenat intr-o caseta locala de 40x40, apoi mutat/rotit/marit la locul lui.
       Formele stau complet in interiorul carourilui, ca sa nu fie taiate la repetare.
       Opacitatea mica le tine ca fundal - se vad printre carduri, fara sa fure atentia. -->
  <g opacity="0.3">

    <!-- Morcov -->
    <g transform="translate(34 46) rotate(-14) scale(1.55)">
      <path d="M20 12 C18 4 12 2 8 2 C10 8 14 12 20 12 Z" fill="#6cc24a"/>
      <path d="M20 12 C22 4 28 2 32 2 C30 8 26 12 20 12 Z" fill="#8ed970"/>
      <path d="M20 12 C19 5 20 1 21 0 C23 4 23 9 20 12 Z" fill="#57b23a"/>
      <path d="M12 13 L28 13 L21 38 C20.5 39.5 19.5 39.5 19 38 Z" fill="#ff8c1a"/>
      <path d="M15.5 19 L24.5 19 M17 25 L23 25" stroke="#ffb870" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Dovleac -->
    <g transform="translate(106 44) rotate(6) scale(1.4)">
      <ellipse cx="20" cy="26" rx="15" ry="12" fill="#ff8c1a"/>
      <ellipse cx="20" cy="26" rx="8.5" ry="12" fill="#ffa94d"/>
      <path d="M20 14 L20 7" stroke="#6b8f3a" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 8 C24 4.5 28.5 5.5 30 8" stroke="#6cc24a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Mar -->
    <g transform="translate(168 26) rotate(11) scale(1.45)">
      <circle cx="14" cy="26" r="11" fill="#ff5f6d"/>
      <circle cx="26" cy="26" r="11" fill="#ff5f6d"/>
      <path d="M20 16 L20 7" stroke="#8b5e3c" stroke-width="3" stroke-linecap="round"/>
      <path d="M21 10 C25 5 31 5 33 6 C31 11 25 13 21 10 Z" fill="#6cc24a"/>
    </g>

    <!-- Struguri -->
    <g transform="translate(238 36) rotate(-8) scale(1.4)">
      <path d="M20 12 L21 5" stroke="#6b8f3a" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M21 6 C25 3 29 4 30.5 6 C27.5 9.5 23 9.5 21 6 Z" fill="#6cc24a"/>
      <g fill="#9b6bd6">
        <circle cx="20" cy="17" r="5.5"/>
        <circle cx="13" cy="25" r="5.5"/>
        <circle cx="27" cy="25" r="5.5"/>
        <circle cx="20" cy="32" r="5.5"/>
      </g>
    </g>

    <!-- Broccoli -->
    <g transform="translate(296 54) rotate(-7) scale(1.5)">
      <rect x="16.5" y="24" width="7" height="15" rx="3.5" fill="#8ed970"/>
      <circle cx="13" cy="19" r="8.5" fill="#57cc6b"/>
      <circle cx="27" cy="19" r="8.5" fill="#57cc6b"/>
      <circle cx="20" cy="12" r="9.5" fill="#6cd97a"/>
    </g>

    <!-- Felie de portocala -->
    <g transform="translate(22 150) rotate(12) scale(1.4)">
      <circle cx="20" cy="22" r="14" fill="#ff9f1c"/>
      <circle cx="20" cy="22" r="11" fill="#ffc266"/>
      <path d="M20 22 L20 11 M20 22 L29.5 16.5 M20 22 L29.5 27.5 M20 22 L20 33 M20 22 L10.5 27.5 M20 22 L10.5 16.5"
            stroke="#ff9f1c" stroke-width="1.7" stroke-linecap="round"/>
    </g>

    <!-- Banana -->
    <g transform="translate(84 164) rotate(18) scale(1.6)">
      <path d="M9 5 C9 22 17 33 33 36 C34.5 33 33 30.5 31 30 C19 26 14 17 14 5 C13 3 10 3 9 5 Z" fill="#ffd23f"/>
      <circle cx="32.5" cy="35" r="2.4" fill="#d9a92a"/>
      <circle cx="11.5" cy="4.5" r="2.2" fill="#d9a92a"/>
    </g>

    <!-- Capsuna -->
    <g transform="translate(228 146) rotate(-12) scale(1.45)">
      <path d="M20 39 C11 34 6 25 8 18 C10 12 16 10 20 13 C24 10 30 12 32 18 C34 25 29 34 20 39 Z" fill="#ff3d5a"/>
      <path d="M12 13 L20 6 L28 13 C25 11 22 11.5 20 12.5 C18 11.5 15 11 12 13 Z" fill="#57cc6b"/>
      <g fill="#ffe9a8">
        <circle cx="15" cy="22" r="1.4"/>
        <circle cx="24" cy="21" r="1.4"/>
        <circle cx="20" cy="27" r="1.4"/>
        <circle cx="16" cy="30" r="1.3"/>
        <circle cx="25" cy="29" r="1.3"/>
      </g>
    </g>

    <!-- Ou fiert -->
    <g transform="translate(300 124) rotate(9) scale(1.4)">
      <ellipse cx="20" cy="23" rx="11" ry="14" fill="#fdf0d8"/>
      <circle cx="20" cy="23" r="5.5" fill="#ffc93f"/>
    </g>

    <!-- Avocado -->
    <g transform="translate(336 190) rotate(14) scale(1.4)">
      <ellipse cx="20" cy="23" rx="12" ry="16" fill="#4e9f3d"/>
      <ellipse cx="20" cy="23" rx="8.5" ry="12.5" fill="#d8f3a3"/>
      <circle cx="20" cy="25" r="5.5" fill="#b07a3a"/>
    </g>

    <!-- Rosie -->
    <g transform="translate(158 232) rotate(-6) scale(1.4)">
      <circle cx="20" cy="25" r="12.5" fill="#ff4d4d"/>
      <path d="M20 13 L20 7.5" stroke="#6b8f3a" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M11.5 13 L20 9.5 L28.5 13 L23 16.5 L20 14 L17 16.5 Z" fill="#57cc6b"/>
    </g>

    <!-- Porumb -->
    <g transform="translate(250 250) rotate(10) scale(1.4)">
      <path d="M12.5 19 C6 15 4.5 28 12 34 Z" fill="#6cc24a"/>
      <path d="M27.5 19 C34 15 35.5 28 28 34 Z" fill="#8ed970"/>
      <ellipse cx="20" cy="23" rx="8" ry="15" fill="#ffd23f"/>
      <g fill="#e8b520">
        <circle cx="17" cy="16" r="1.3"/><circle cx="23" cy="16" r="1.3"/>
        <circle cx="17" cy="23" r="1.3"/><circle cx="23" cy="23" r="1.3"/>
        <circle cx="17" cy="30" r="1.3"/><circle cx="23" cy="30" r="1.3"/>
      </g>
    </g>

    <!-- Cirese -->
    <g transform="translate(30 282) rotate(5) scale(1.5)">
      <path d="M14 27 C15 17 21 9 28 5" stroke="#6cc24a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M29 28 C29 19 28.5 11 28 5" stroke="#6cc24a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M28 5 C33 2 38 4 39 6 C36 9.5 31 9 28 5 Z" fill="#8ed970"/>
      <circle cx="13" cy="32" r="7.4" fill="#e63950"/>
      <circle cx="29" cy="33" r="7.4" fill="#ff5069"/>
