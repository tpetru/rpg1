const TYPE_NAME = { brad: 'Brad', stejar: 'Stejar', mesteacan: 'Mesteacăn' };
const BASE_VALUE = { brad: 220, stejar: 300, mesteacan: 170 };
let trees = [];
let seed = 1;
const srand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

function branch(par, mat, y, len, th, az, tilt) {
  const h = new THREE.Object3D(); h.position.y = y; h.rotation.y = az;
  h.add(part(geo.branch, mat, th, len, th, 0, 0, 0, 0, 0, tilt)); par.add(h); return h;
}
function makeTreeMesh(t) {
  const g = new THREE.Group(), s = t.size, r = srand, pick = a => a[Math.floor(r() * a.length)];
  const sick = !t.healthy;
  if (t.type === 'brad') {
    const H = 9 * s, tr = 0.3 * s;
    g.add(part(geo.cyl, t.dead ? MAT.barkDead : sick ? MAT.barkSick : MAT.bark, tr, t.dead ? H * 0.72 : H * 0.88, tr));
    if (!t.dead) {
      const m = pick(sick ? MAT.spruceSick : MAT.spruce), k = sick ? 0.72 : 1;
      for (const i of sick ? [0, 2, 3] : [0, 1, 2, 3, 4]) g.add(part(geo.cone, m, (2.3 - i * 0.4) * s * k, 2.6 * s, (2.3 - i * 0.4) * s * k, 0, (1.6 + i * 1.25) * s, 0, 0, r() * 6));
      if (sick) for (let i = 0; i < 3; i++) branch(g, MAT.barkDead, (5.2 + i * 0.7) * s, 1.1 * s, 0.05 * s, r() * TAU, 1.3);
    } else for (let i = 0; i < 6; i++) branch(g, MAT.barkDead, (1.8 + i * 0.75) * s, (1.6 - i * 0.15) * s, 0.06 * s, r() * TAU, 1.35);
    t.trunkR = tr; t.H = H;
  } else if (t.type === 'stejar') {
    const tr = 0.38 * s, th = 3.8 * s;
    g.add(part(geo.cyl, t.dead ? MAT.barkDead : sick ? MAT.barkSick : MAT.bark, tr, th + 1.2 * s, tr));
    const bm = t.dead ? MAT.barkDead : sick ? MAT.barkSick : MAT.bark;
    for (let i = 0; i < (t.dead || sick ? 5 : 3); i++) branch(g, bm, (2.8 + r() * 1.4) * s, (1.6 + r()) * s, 0.12 * s, r() * TAU, 0.6 + r() * 0.5);
    if (!t.dead) {
      const blobs = sick ? [[0.6, 4.6, 0.2, 1.2], [-0.9, 4.2, -0.5, 1.0], [0.2, 5.4, -0.6, 0.8]]
        : [[0, 5.3, 0, 2.2], [1.5, 4.6, 0.3, 1.6], [-1.4, 4.8, -0.4, 1.7], [0.2, 4.5, 1.4, 1.5], [-0.3, 4.7, -1.5, 1.5], [0, 6.5, 0, 1.4]];
      for (const [x, y, z, rr] of blobs) { const m = pick(sick ? MAT.sick : MAT.leaf); g.add(part(geo.blob, m, rr * s, rr * s * 0.85, rr * s, x * s, y * s, z * s, r(), r(), r())); }
    }
    if (sick || t.dead) for (let i = 0; i < 3; i++) {
      const h = new THREE.Object3D(); h.rotation.y = r() * TAU; h.position.y = (0.7 + i * 0.55) * s;
      h.add(part(geo.shelf, MAT.fungus, 0.24 * s, 1, 0.24 * s, tr * 0.85)); g.add(h);
    }
    t.trunkR = tr; t.H = 7 * s;
  } else {
    const tr = 0.22 * s, H = 7.5 * s;
    g.add(part(geo.cyl, sick ? MAT.birchSick : MAT.birch, tr, t.dead ? H * 0.75 : H * 0.92, tr));
    if (!t.dead) {
      const blobs = sick ? [[0.5, 4.8, 0, 0.7], [-0.5, 5.6, 0.3, 0.6]] : [[0, 5.6, 0, 1.4], [0.7, 4.6, 0.2, 1.0], [-0.6, 4.9, -0.3, 1.1], [0.1, 6.6, 0.1, 0.9]];
      for (const [x, y, z, rr] of blobs) g.add(part(geo.blob, pick(sick ? MAT.sick : MAT.birchLeaf), rr * s, rr * s * 1.6, rr * s, x * s, y * s, z * s, 0, r() * 3));
    }
    if (sick) for (let i = 0; i < 5; i++) branch(g, MAT.barkDead, (3 + i * 0.6) * s, (1 + r() * 0.6) * s, 0.04 * s, r() * TAU, 0.7 + r() * 0.5);
    t.trunkR = tr; t.H = H;
  }
  g.rotation.y = r() * TAU;
  if (sick) g.rotation.z = (r() - 0.5) * 0.08;
  return g;
}
function clearForest() {
  for (const t of trees) { scene.remove(t.pivot); if (t.stump) scene.remove(t.stump); }
  trees = [];
}
function buildForest(sd) {
  clearForest(); seed = sd;
  const pts = [];
  for (let tries = 0; tries < 4000 && pts.length < 160; tries++) {
    const a = srand() * TAU, r = Math.sqrt(16 * 16 + srand() * (FOREST_R * FOREST_R - 256));
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x - TRUCK.x, z - TRUCK.z) < 14 || roadDist(x, z) < 5.5 || creekDist(x, z) < 4.5) continue;
    if (pts.every(p => (p.x - x) ** 2 + (p.z - z) ** 2 > 4.6 * 4.6)) pts.push({ x, z });
  }
  for (const p of pts) {
    const tv = srand(), type = tv < 0.4 ? 'brad' : tv < 0.75 ? 'stejar' : 'mesteacan';
    const healthy = srand() < 0.55, dead = !healthy && srand() < 0.3;
    const size = 0.85 + srand() * 0.45;
    const t = { x: p.x, z: p.z, type, healthy, dead, size, state: 'stand', th: 0, om: 0, wob: 0 };
    t.value = healthy ? Math.round(BASE_VALUE[type] * size / 10) * 10 : Math.round((30 + srand() * 30) * size / 5) * 5;
    t.maxHp = t.hp = Math.round(3 + size * 3 + (type === 'stejar' ? 1 : 0));
    t.name = TYPE_NAME[type] + (healthy ? ' sănătos' : dead ? ' uscat' : ' bolnav');
    t.mesh = makeTreeMesh(t);
    t.y = Math.min(...[[1, 0], [-1, 0], [0, 1], [0, -1]].map(([a, b]) => heightAt(p.x + a * (t.trunkR + 0.2), p.z + b * (t.trunkR + 0.2)))) - 0.12;
    t.pivot = new THREE.Group(); t.pivot.position.set(p.x, t.y, p.z); t.pivot.add(t.mesh); scene.add(t.pivot);
    trees.push(t);
  }
}

  const pl = $('polaroid'); pl.classList.add('show'); setTimeout(() => pl.classList.remove('show'), 4200);
}

// ---------------- meniuri ----------------
function showOverlay(html) { $('panel').innerHTML = html; $('overlay').classList.add('show'); }
function hideOverlay() { $('overlay').classList.remove('show'); }
function startPanel(resume) {
  showOverlay(`<h1>🪓 Pădurarul</h1>
  <p>Ești tăietor de lemne. Ai o zi de muncă (08:00–18:00) să faci cât mai mulți bani. Copacii <b>sănătoși</b> se vând scump, dar legal ai voie să tai <b>doar copacii bolnavi sau uscați</b>.</p>
  <div class="legend">
    <div class="lg-ok">🍁 <b>Sănătos</b>: coroană plină, în culori vii de toamnă (brazii: ace verzi), scoarță maro. Bani mulți (150–390 lei), dar <b>ilegal</b>. Inel <span style="color:#d0301f">roșu</span>.</div>
    <div class="lg-bad">🍂 <b>Bolnav / uscat</b>: coroană rară, frunze maro-cenușii sau deloc, crengi goale, scoarță gri, ciuperci, brazi ruginii. Puțini bani (25–90 lei), <b>legal</b>. Inel <span style="color:#2f8d2c">verde</span>.</div>
  </div>
  <p>📷 Prin pădure umblă <b>doi Alex Nedea de la RecorderZ</b> și nu apar pe hartă, așa că fii atent în jur. Conul roșu de pe jos e ce vede fiecare. Dacă te prinde tăind un copac sănătos îți face poză și îți confiscă toate lemnele. Dacă ajungi lângă el cu lemne în spate, te oprește și ți le verifică: dacă ai și lemn din copaci sănătoși, îți face poză și reportaj. Când taie cineva lângă el, se mai întoarce să vadă ce se aude… La <b>3 reportaje</b> ai pierdut.</p>
  <p>🐻 În pădure sunt și <b>doi urși</b>. Dacă te văd (sau te miros de aproape), mârâie, apare un <b style="color:#d0201a">!</b> deasupra lor și apoi aleargă după tine. Fugi (<b>Shift</b> sau joystick-ul tras la maxim) la camion și urcă în el (butonul 🚚 sau <kbd>T</kbd>): acolo ursul renunță și pleacă. Dacă te prinde, te mănâncă.</p>
  <p>🚚 Încap ${CAP} copaci pe tine. Du-i la camion ca să-i vinzi.</p>
  <ul>${isTouch ? '<li>Joystick: trage cu degetul în stânga ecranului</li><li>Camera: trage în dreapta ecranului</li><li>🪓 ține apăsat ca să tai</li>'
    : '<li><kbd>W A S D</kbd> / săgeți: mers · <kbd>Shift</kbd>: fugi</li><li><kbd>Space</kbd> sau <kbd>F</kbd> (ține apăsat): taie</li><li>Trage cu mouse-ul (sau <kbd>Q</kbd>/<kbd>E</kbd>): rotești camera · rotița: zoom</li><li><kbd>Esc</kbd>: pauză · <kbd>M</kbd>: sunet</li>'}</ul>
  <button class="big" id="go">${resume ? 'Continuă' : 'Începe ziua'}</button>
  <div class="best">Record: ${fmt(S.best)} lei</div>`);
  $('go').onclick = () => { audio(); if (resume) { S.paused = false; hideOverlay(); } else newGame(); };
}
function newGame() {
  buildForest(1 + Math.floor(Math.random() * 1e6));
  Object.assign(S, { running: true, paused: false, time: 0, money: 0, load: [], loadIll: 0, strikes: 0, cutOk: 0, cutBad: 0, sold: 0, lost: 0, photos: [], freeze: 0, endAt: 0, shake: 0 });
  Object.assign(P, { x: 0, z: 5, yaw: Math.PI, swing: -1 }); camYaw = Math.PI;
  S.endWhy = ''; S.inTruck = false; P.g.visible = true; BEARS.forEach((B, i) => { B.body.rotation.x = 0; B.head.rotation.x = 0; bearSpawn(B, i); });
  ALEXES.forEach((A, i) => { Object.assign(A, { active: false, state: 'off', spawnIn: i ? rand(35, 50) : rand(12, 20) }); A.g.visible = false; });
  setTruckLogs(0); hideOverlay(); hud();
  toast('Bună dimineața! Taie copacii bolnavi 🍂', '', 2.5);
}
function endGame(why) {
  S.running = false; ring.visible = false; $('bubble').style.display = 'none'; bubbleT = 0;
  const rec = S.money > S.best; if (rec) { S.best = S.money; try { localStorage.setItem(SAVE + '-best', S.money); } catch (e) {} }
  const photos = S.photos.length ? `<p style="text-align:center"><b>Pozele lui Alex Nedea:</b></p><div class="photos">${S.photos.map(s => `<img src="${s}" alt="poză">`).join('')}</div>` : '';
  showOverlay(`<h2>${why === 'time' ? '🌇 S-a terminat ziua de muncă' : why === 'bear' ? '🐻 Te-a mâncat ursul!' : '📺 Reportajul a apărut pe RecorderZ!'}</h2>
  <p style="text-align:center">${why === 'bear' ? 'Urșii din pădurile românești nu glumesc. Data viitoare fugi la camion mai repede!' : why === 'time' ? (S.strikes ? 'Ai scăpat, dar nu chiar curat.' : S.cutBad ? 'Nimeni nu te-a prins… de data asta.' : 'Pădurar model, totul legal! 👏') : '„Tăieri ilegale în pădure” — 3 reportaje, gata cu meseria.'}</p>
  <div class="stats"><span>💰 Bani câștigați</span><b>${fmt(S.money)} lei</b><span>🍂 Copaci bolnavi tăiați</span><b>${S.cutOk}</b><span>🌲 Copaci sănătoși tăiați</span><b>${S.cutBad}</b><span>🚫 Lemne confiscate</span><b>${fmt(S.lost)} lei</b><span>📷 Reportaje</span><b>${S.strikes}/${MAX_STRIKES}</b></div>
  ${photos}
  <div class="best">${rec ? '🏆 Record nou!' : 'Record: ' + fmt(S.best) + ' lei'}</div>
  <button class="big" id="again">Joacă din nou</button>`);
  $('again').onclick = () => { audio(); newGame(); };
}
function togglePause() {
  if (!S.running) return;
  if (S.paused) { S.paused = false; hideOverlay(); } else { S.paused = true; startPanel(true); }
}
function toggleMute() {
  muted = !muted; if (master) master.gain.value = muted ? 0 : 0.6;
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
  try { localStorage.setItem(SAVE + '-mute', muted ? '1' : '0'); } catch (e) {}
  $('bSound').textContent = muted ? '🔇' : '🔊';
}
$('bSound').textContent = muted ? '🔇' : '🔊';
$('bSound').onclick = () => { audio(); toggleMute(); };
$('bPause').onclick = () => { audio(); togglePause(); };

function toggleTruck() {
  if (S.inTruck) { S.inTruck = false; P.x = TRUCK.x + 4.2; P.z = TRUCK.z + 2.9; P.yaw = 0; toast('⬇ Ai coborât din camion', '', 1.4); }
  else if (Math.hypot(P.x - TRUCK.x, P.z - TRUCK.z) < 9 && S.freeze <= 0) { S.inTruck = true; P.swing = -1; toast('🚚 Ești în camion. Aici urșii nu te pot prinde.', 'good', 2); }
}
$('bTruck').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); audio(); if (S.running && !S.paused) toggleTruck(); });

// ---------------- input ----------------
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  audio(); keys[e.code] = true;
  if (e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'KeyT' && S.running && !S.paused) toggleTruck();
  else if (e.code === 'Enter' && $('overlay').classList.contains('show')) { const b = $('go') || $('again'); if (b) b.click(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; axeBtn = false; });
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  audio();
  if (e.pointerType === 'touch' && e.clientX < innerWidth * 0.45 && !joy) {
    joy = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: 0, y: 0 };
    const j = $('joy'); j.style.display = 'block'; j.style.left = e.clientX + 'px'; j.style.top = e.clientY + 'px'; j.firstElementChild.style.transform = '';
  } else if (!drag) drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (joy && e.pointerId === joy.id) {
    let dx = e.clientX - joy.x0, dy = e.clientY - joy.y0; const d = Math.hypot(dx, dy); if (d > 50) { dx *= 50 / d; dy *= 50 / d; }
    joy.x = dx / 50; joy.y = dy / 50; $('joy').firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
  } else if (drag && e.pointerId === drag.id) {
    camYaw -= (e.clientX - drag.x) * 0.006; camPitch = clamp(camPitch + (e.clientY - drag.y) * 0.004, 0.1, 1.15);
    drag.x = e.clientX; drag.y = e.clientY;
  }
});
const endPtr = e => {
  if (joy && e.pointerId === joy.id) { joy = null; $('joy').style.display = 'none'; }
  if (drag && e.pointerId === drag.id) drag = null;
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => { e.preventDefault(); camDist = clamp(camDist * (1 + Math.sign(e.deltaY) * 0.1), 4, 14); }, { passive: false });
{
  const b = $('bAxe');
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); axeBtn = true; b.classList.add('on'); b.setPointerCapture(e.pointerId); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => { axeBtn = false; b.classList.remove('on'); });
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && !S.paused) togglePause(); });

// ---------------- pornire ----------------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (S.running && !S.paused) update(dt);
  else if (!S.running) { camYaw += dt * 0.08; }
  placeCamera(dt);
  hud3d();
  if ((mmTick++ & 1) === 0) drawMinimap();
  if (S.wantPhoto) capturePhoto();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
buildForest(4242);
hud(); placeCamera(0);
startPanel(false);
$('loading').remove();
frame();

// pentru teste
window.__pd = { toggleTruck, S, P, A: ALEXES[0], ALEXES, BEARS, bearSees, get trees() { return trees; }, update, newGame, alexSpawn, alexSees, hitTree, fell, sell,
  setCam(y) { camYaw = y; }, place(o, x, z, yaw) { o.x = x; o.z = z; if (yaw !== undefined) o.yaw = o.tYaw = yaw; } };
</script>
