<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pădurarul 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a7c4b5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; background: #2f4a33; z-index: 50; }
  .chip { background: rgba(18, 30, 22, .62); border-radius: 12px; padding: 7px 12px; backdrop-filter: blur(4px); }
  #hud { position: fixed; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; align-items: flex-start; }
  #money { font-size: 22px; font-weight: 800; }
  #load, #clock, #strikes { font-size: 14px; font-weight: 600; }
  #load.full { background: rgba(170, 90, 10, .8); }
  #strikes b { color: #ff5a4a; }
  #btns { position: fixed; right: 12px; top: 12px; display: flex; gap: 6px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
  .ib { width: 40px; height: 40px; font-size: 19px; background: rgba(18, 30, 22, .62); color: #fff; }
  .ib:hover { background: rgba(18, 30, 22, .85); }
  #mm { position: fixed; left: 12px; bottom: 12px; width: 150px; height: 150px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); box-shadow: 0 3px 12px rgba(0,0,0,.35); pointer-events: none; }
  #alert { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); font-weight: 700; font-size: 15px; display: none; align-items: center; gap: 8px; pointer-events: none; white-space: nowrap; }
  #alert.show { display: flex; }
  #alert.seen { background: rgba(200, 30, 20, .85); animation: pulse .6s infinite alternate; }
  #alert .arr { display: inline-block; font-size: 18px; transition: transform .1s; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(255,60,40,.6); } to { box-shadow: 0 0 0 8px rgba(255,60,40,0); } }
  #treeinfo { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); text-align: center; display: none; pointer-events: none; min-width: 220px; }
  #treeinfo.show { display: block; }
  #tiName { font-weight: 700; font-size: 15px; }
  #tiTag { font-size: 13px; margin-top: 2px; }
  #tiTag.bad { color: #ff7a6a; } #tiTag.ok { color: #8fe58a; } #tiTag.seal { color: #ffd34d; }
  #tiBar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); margin-top: 6px; overflow: hidden; }
  #tiBar i { display: block; height: 100%; width: 100%; background: #ffd34d; }
  #toast { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); font-size: 18px; font-weight: 700; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; }
  #toast.bad { background: rgba(190, 30, 20, .88); }
  #toast.good { background: rgba(30, 120, 40, .85); }
  #bubble { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); background: #fff; color: #222; font-weight: 700; font-size: 15px; padding: 9px 13px; border-radius: 14px; max-width: 260px; text-align: center; pointer-events: none; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: #fff; }
  #bubble.shout { background: #fff3c4; font-size: 16px; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .5s; z-index: 15; }
  #polaroid { position: fixed; right: 18px; bottom: 90px; background: #fdfdf8; color: #333; padding: 8px 8px 6px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.45); transform: rotate(4deg) scale(.6); opacity: 0; transition: all .45s; pointer-events: none; z-index: 14; text-align: center; font-size: 13px; font-weight: 700; }
  #polaroid.show { opacity: 1; transform: rotate(4deg) scale(1); }
  #polaroid canvas { width: 240px; height: 180px; display: block; margin-bottom: 4px; }
  #joy { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); display: none; pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.45); }
  #bAxe { position: fixed; right: 16px; bottom: 18px; width: 84px; height: 84px; border-radius: 50%; font-size: 40px; background: rgba(150, 60, 20, .75); color: #fff; box-shadow: 0 4px 0 rgba(80,30,10,.8); }
  #bAxe:active, #bAxe.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(80,30,10,.8); }
  #hint { position: fixed; right: 12px; bottom: 112px; font-size: 13px; opacity: .85; pointer-events: none; text-align: right; }
  body.touch #hint { display: none; }
  body.touch #mm { left: auto; right: 12px; bottom: auto; top: 60px; width: 110px; height: 110px; }
  body.touch #treeinfo { bottom: 120px; }
  #overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(10, 25, 15, .5); z-index: 20; padding: 16px; }
  #overlay.show { display: grid; }
  .panel { background: #fbf6ea; color: #33291c; border-radius: 22px; padding: 22px 24px; width: min(600px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .panel h1 { margin: 0 0 6px; font-size: 32px; color: #2f6b2c; text-align: center; }
  .panel h2 { margin: 0 0 8px; font-size: 26px; color: #9b3a1a; text-align: center; }
  .panel p { margin: 8px 0; line-height: 1.45; }
  .panel ul { margin: 6px 0 10px; padding-left: 20px; line-height: 1.5; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .legend div { border-radius: 12px; padding: 10px; font-size: 14px; line-height: 1.4; }
  .lg-ok { background: #e3f1dc; border: 2px solid #7cb26a; }
  .lg-bad { background: #f6e6d2; border: 2px solid #c08a4a; }
  .big { display: block; margin: 14px auto 4px; background: #2f7d32; color: #fff; font-size: 20px; font-weight: 800; padding: 13px 34px; box-shadow: 0 4px 0 #1d5420; }
  .big:hover { background: #379139; }
  .best { text-align: center; font-size: 13px; opacity: .75; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; margin: 10px auto; max-width: 340px; font-size: 16px; }
  .stats b { text-align: right; }
  .photos { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
  .photos img { width: 150px; border: 6px solid #fff; border-bottom-width: 18px; box-shadow: 0 4px 12px rgba(0,0,0,.3); transform: rotate(-2deg); }
  .photos img:nth-child(2) { transform: rotate(3deg); }
  kbd { background: #e7dcc6; border-radius: 5px; padding: 1px 6px; font-size: 13px; }
  @media (max-width: 520px) { .legend { grid-template-columns: 1fr; } .panel { padding: 16px; } .panel h1 { font-size: 26px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
} }
</script>
</head>
<body>
<div id="loading">Se încarcă pădurea… 🌲</div>
<div id="hud">
  <div class="chip" id="money">💰 0 lei</div>
  <div class="chip" id="load">🪵 Lemne: 0/4</div>
  <div class="chip" id="clock">⏱ 08:00</div>
  <div class="chip" id="strikes">📷 Reportaje: 0/3</div>
</div>
<div id="btns">
  <button class="ib" id="bSound" title="Sunet (M)">🔊</button>
  <button class="ib" id="bPause" title="Pauză (Esc)">⏸</button>
</div>
<div id="alert" class="chip"><span id="alTxt"></span></div>
<canvas id="mm" width="300" height="300"></canvas>
<div id="treeinfo" class="chip"><div id="tiName"></div><div id="tiTag"></div><div id="tiBar"><i></i></div></div>
<div id="toast" class="chip"></div>
<div id="bubble"></div>
<div id="flash"></div>
<div id="polaroid"><canvas id="pc" width="320" height="240"></canvas><div>RecorderZ · „Ce faceți aici?”</div></div>
<div id="joy"><i></i></div>
<button id="bAxe" title="Taie (Space)">🪓</button>
<div id="hint"><kbd>WASD</kbd> mers · <kbd>Shift</kbd> fugi · <kbd>Space</kbd> taie · trage cu mouse-ul ca să rotești camera</div>
<div id="overlay" class="show"><div class="panel" id="panel"></div></div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = THREE.MathUtils.clamp;
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');

// ---------------- reguli ----------------
const FOREST_R = 104, WALL_R = 106, CLEAR_R = 14;
const TRUCK = { x: 0, z: -9 };
const SEE = 22, SEE_ANG = 0.9, HEAR = 28;
const DAY = 300, CAP = 4, MAX_STRIKES = 3;
const SHOUT = 'Alex Nedea este numele meu, de la RecorderZ. Ce faceți aici?';
const SAVE = 'padurar3d';

// ---------------- scenă ----------------
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8d6e6);
scene.fog = new THREE.Fog(0xa9c6b8, 35, 120);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
const alexCam = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xe4f2ff, 0x3f5a35, 1.6));
const sun = new THREE.DirectionalLight(0xfff0d0, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 1, far: 160 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const M = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...o });
const plaidTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#b8281f'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(25,10,10,.55)'; g.fillRect(0, 18, w, 14); g.fillRect(18, 0, 14, h);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 50, w, 4); g.fillRect(50, 0, 4, h);
}, true);
const birchTex = (bg, n) => canvasTex(64, 128, (g, w, h) => {
  g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = '#2a2622';
  for (let i = 0; i < n; i++) g.fillRect(Math.random() * w, Math.random() * h, 5 + Math.random() * 16, 2 + Math.random() * 3);
}, true);
const ringTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#d8b583'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(120,80,40,.5)'; g.lineWidth = 2;
  for (let r = 4; r < 32; r += 5) { g.beginPath(); g.arc(32, 32, r, 0, TAU); g.stroke(); }
});
const tapeTex = canvasTex(64, 16, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#d0201a';
  for (let x = -16; x < w; x += 16) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + 8, h); g.lineTo(x + 16, 0); g.lineTo(x + 8, 0); g.fill(); }
}, true);
tapeTex.repeat.set(4, 1);

const MAT = {
  bark: M(0x5e4128), barkSick: M(0x7b7368), barkDead: M(0x928b80),
  birch: M(0xffffff, { map: birchTex('#efebe2', 22) }), birchSick: M(0xffffff, { map: birchTex('#b9b1a3', 40) }),
  leaf: [M(0x2f6e2c), M(0x3b7d31), M(0x2a6230)], spruce: [M(0x1d4a2a), M(0x235230), M(0x1a4426)],
  birchLeaf: [M(0x6aa83e), M(0x7db34a)],
  sick: [M(0xb08f35), M(0xa06a2a), M(0x8f7c38)], spruceSick: [M(0x8d5a2a), M(0xa06c33), M(0x7e5a36)],
  fungus: M(0xdcc490), stumpTop: M(0xffffff, { map: ringTex }), tape: M(0xffffff, { map: tapeTex }),
  black: M(0x151515), steel: M(0xb9c0c6), handle: M(0x8a5a2b), rock: M(0x8a8a84), bush: M(0x3d6e2e),
  grass: M(0x4f8a35), truck: M(0x2f6aa8), truckDark: M(0x22303c), tire: M(0x1b1b1b), log: M(0x7a5532),
};

// ---------------- geometrii comune ----------------
const BOX = new THREE.BoxGeometry(1, 1, 1);
const geo = {
  cyl: new THREE.CylinderGeometry(0.7, 1, 1, 7).translate(0, 0.5, 0),
  cone: new THREE.ConeGeometry(1, 1, 7).translate(0, 0.5, 0),
  blob: new THREE.IcosahedronGeometry(1, 0),
  branch: new THREE.CylinderGeometry(0.55, 1, 1, 5).translate(0, 0.5, 0),
  shelf: new THREE.CylinderGeometry(1, 1, 0.14, 8, 1, false, 0, Math.PI),
  stump: new THREE.CylinderGeometry(1, 1.1, 1, 9).translate(0, 0.5, 0),
  tape: new THREE.CylinderGeometry(1, 1, 1, 12, 1, true),
  log: new THREE.CylinderGeometry(1, 1, 1, 7),
};
function part(g, m, sx, sy, sz, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, shadow = true) {
  const o = new THREE.Mesh(g, m); o.scale.set(sx, sy, sz); o.position.set(x, y, z); o.rotation.set(rx, ry, rz);
  o.castShadow = shadow; o.receiveShadow = true; return o;
}

// ---------------- teren ----------------
{
  const G = new THREE.PlaneGeometry(330, 330, 90, 90); G.rotateX(-Math.PI / 2);
  const p = G.attributes.position, col = [], c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), r = Math.hypot(x, z);
    const n = (Math.sin(x * 0.11) + Math.sin(z * 0.13 + 1) + Math.sin((x + z) * 0.05)) / 3;
    c.setHSL(0.26 + n * 0.03, 0.42, 0.25 + n * 0.05 + Math.random() * 0.02);
    if (r < CLEAR_R + 3) c.lerp(new THREE.Color(0x8a7a52), clamp((CLEAR_R + 3 - r) / 6, 0, 0.55));
    col.push(c.r, c.g, c.b);
    if (r > 115) p.setY(i, (r - 115) * 0.12);
  }
  G.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  G.computeVertexNormals();
  const ground = new THREE.Mesh(G, new THREE.MeshLambertMaterial({ vertexColors: true }));
  ground.receiveShadow = true; scene.add(ground);

  const dummy = new THREE.Object3D();
  const scatter = (geom, mat, n, rMin, rMax, fn, shadow = false) => {
    const im = new THREE.InstancedMesh(geom, mat, n);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, r = Math.sqrt(rand(rMin * rMin, rMax * rMax));
      dummy.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); dummy.rotation.set(0, Math.random() * TAU, 0); dummy.scale.set(1, 1, 1);
      fn(dummy); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix);
    }
    im.castShadow = shadow; im.receiveShadow = true; scene.add(im); return im;
  };
  scatter(new THREE.ConeGeometry(0.09, 0.5, 3).translate(0, 0.25, 0), MAT.grass, isTouch ? 1500 : 3500, 3, 112, d => d.scale.setScalar(rand(0.6, 1.4)));
  scatter(geo.blob, MAT.rock, 70, 16, 108, d => { d.scale.set(rand(0.4, 1.1), rand(0.3, 0.7), rand(0.4, 1.1)); d.position.y = 0.1; }, true);
  scatter(new THREE.IcosahedronGeometry(1, 0), MAT.bush, 140, 16, 110, d => { const s = rand(0.5, 1.1); d.scale.set(s, s * 0.7, s); d.position.y = s * 0.35; }, true);
  // brazi de margine (decor, nu se taie)
  const nB = 320, trunkIM = new THREE.InstancedMesh(geo.cyl, MAT.bark, nB), coneIM = new THREE.InstancedMesh(geo.cone, MAT.spruce[0], nB * 2);
  for (let i = 0; i < nB; i++) {
    const a = Math.random() * TAU, r = rand(110, 150), s = rand(1.1, 1.8), x = Math.cos(a) * r, z = Math.sin(a) * r, y = Math.max(0, (r - 115) * 0.12);
    dummy.rotation.set(0, 0, 0);
    dummy.position.set(x, y, z); dummy.scale.set(0.35 * s, 8 * s, 0.35 * s); dummy.updateMatrix(); trunkIM.setMatrixAt(i, dummy.matrix);
    dummy.position.set(x, y + 1.6 * s, z); dummy.scale.set(2.4 * s, 4.5 * s, 2.4 * s); dummy.updateMatrix(); coneIM.setMatrixAt(i * 2, dummy.matrix);
    dummy.position.set(x, y + 4.4 * s, z); dummy.scale.set(1.7 * s, 3.8 * s, 1.7 * s); dummy.updateMatrix(); coneIM.setMatrixAt(i * 2 + 1, dummy.matrix);
  }
  scene.add(trunkIM, coneIM);
}

// ---------------- camionul ----------------
const truck = new THREE.Group();
truck.position.set(TRUCK.x, 0, TRUCK.z);
truck.add(part(BOX, MAT.truck, 2.3, 2.0, 2.4, 4.2, 1.7, 0));
truck.add(part(BOX, MAT.truckDark, 0.1, 0.8, 2.0, 5.36, 2.1, 0));
truck.add(part(BOX, MAT.truckDark, 2.0, 0.8, 0.1, 4.4, 2.15, 1.21));
truck.add(part(BOX, MAT.truckDark, 2.0, 0.8, 0.1, 4.4, 2.15, -1.21));
truck.add(part(BOX, MAT.truckDark, 8.4, 0.35, 2.3, 0.6, 0.85, 0));
truck.add(part(BOX, MAT.log, 5.6, 0.2, 2.4, -0.7, 1.12, 0));
for (const x of [-3.4, 2.0]) for (const z of [-1.21, 1.21]) truck.add(part(BOX, MAT.truckDark, 0.12, 1.5, 0.12, x, 1.9, z));
for (const x of [-2.6, -1.0, 4.0]) for (const z of [-1.1, 1.1]) truck.add(part(geo.log, MAT.tire, 0.5, 0.36, 0.5, x, 0.5, z, Math.PI / 2));
const truckLogs = new THREE.InstancedMesh(geo.log, MAT.log, 30);
truckLogs.count = 0; truckLogs.castShadow = true; truck.add(truckLogs);
scene.add(truck);
const TRUCK_COLL = [[-3, 1.6], [-0.4, 1.6], [2.2, 1.6], [4.3, 1.6]];
function setTruckLogs(n) {
  n = Math.min(30, n); const d = new THREE.Object3D();
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / 6), k = i % 6;
    d.position.set(-0.7, 1.45 + row * 0.42, -1.0 + k * 0.4 + (row % 2) * 0.2); d.rotation.set(0, 0, Math.PI / 2); d.scale.set(0.2, 5.2, 0.2);
    d.updateMatrix(); truckLogs.setMatrixAt(i, d.matrix);
  }
  truckLogs.count = n; truckLogs.instanceMatrix.needsUpdate = true;
}

// ---------------- copacii ----------------
const TYPE_NAME = { brad: 'Brad', stejar: 'Stejar', mesteacan: 'Mesteacăn' };
const BASE_VALUE = { brad: 220, stejar: 300, mesteacan: 170 };
let trees = [];
let seed = 1;
const srand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

function branch(par, mat, y, len, th, az, tilt) {
  const h = new THREE.Object3D(); h.position.y = y; h.rotation.y = az;
  h.add(part(geo.branch, mat, th, len, th, 0, 0, 0, 0, 0, tilt)); par.add(h); return h;
}
function makeTreeMesh(t) {
  const g = new THREE.Group(), s = t.size, r = srand, pick = a => a[Math.floor(r() * a.length)];
  const sick = !t.healthy;
  if (t.type === 'brad') {
    const H = 9 * s, tr = 0.3 * s;
    g.add(part(geo.cyl, t.dead ? MAT.barkDead : sick ? MAT.barkSick : MAT.bark, tr, t.dead ? H * 0.72 : H * 0.88, tr));
    if (!t.dead) {
      const m = pick(sick ? MAT.spruceSick : MAT.spruce), k = sick ? 0.72 : 1;
      for (const i of sick ? [0, 2, 3] : [0, 1, 2, 3, 4]) g.add(part(geo.cone, m, (2.3 - i * 0.4) * s * k, 2.6 * s, (2.3 - i * 0.4) * s * k, 0, (1.6 + i * 1.25) * s, 0, 0, r() * 6));
      if (sick) for (let i = 0; i < 3; i++) branch(g, MAT.barkDead, (5.2 + i * 0.7) * s, 1.1 * s, 0.05 * s, r() * TAU, 1.3);
    } else for (let i = 0; i < 6; i++) branch(g, MAT.barkDead, (1.8 + i * 0.75) * s, (1.6 - i * 0.15) * s, 0.06 * s, r() * TAU, 1.35);
    t.trunkR = tr; t.H = H;
  } else if (t.type === 'stejar') {
    const tr = 0.38 * s, th = 3.8 * s;

function solid(t) { return t.state === 'stand' || t.state === 'sealed'; }

  for (const t of trees) {
    if (!solid(t)) continue;
    const dx = o.x - t.x, dz = o.z - t.z, d = Math.hypot(dx, dz), m = t.trunkR + rad;
    if (d < m && d > 1e-4) { o.x = t.x + dx / d * m; o.z = t.z + dz / d * m; }
  }
  for (const [cx, cr] of TRUCK_COLL) {
    const tx = TRUCK.x + cx, dx = o.x - tx, dz = o.z - TRUCK.z, d = Math.hypot(dx, dz), m = cr + rad;
    if (d < m && d > 1e-4) { o.x = tx + dx / d * m; o.z = TRUCK.z + dz / d * m; }
  }
  const r = Math.hypot(o.x, o.z); if (r > WALL_R) { o.x *= WALL_R / r; o.z *= WALL_R / r; }
}
function findTarget() {
  let best = null, bd = 1e9;
  const fx = Math.sin(P.yaw), fz = Math.cos(P.yaw);
  for (const t of trees) {
    if (!solid(t)) continue;
    const dx = t.x - P.x, dz = t.z - P.z, d = Math.hypot(dx, dz) - t.trunkR;
    if (d > 2.3) continue;
    const facing = (dx * fx + dz * fz) / Math.max(0.01, Math.hypot(dx, dz));

}

  $('again').onclick = () => { audio(); newGame(); };
}
function togglePause() {
  if (!S.running) return;
  if (S.paused) { S.paused = false; hideOverlay(); } else { S.paused = true; startPanel(true); }
}
function toggleMute() {
  muted = !muted; if (master) master.gain.value = muted ? 0 : 0.6;
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
  try { localStorage.setItem(SAVE + '-mute', muted ? '1' : '0'); } catch (e) {}
  $('bSound').textContent = muted ? '🔇' : '🔊';
}
$('bSound').textContent = muted ? '🔇' : '🔊';
$('bSound').onclick = () => { audio(); toggleMute(); };
$('bPause').onclick = () => { audio(); togglePause(); };

// ---------------- input ----------------
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  audio(); keys[e.code] = true;
  if (e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'Enter' && $('overlay').classList.contains('show')) { const b = $('go') || $('again'); if (b) b.click(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; axeBtn = false; });
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  audio();
  if (e.pointerType === 'touch' && e.clientX < innerWidth * 0.45 && !joy) {
    joy = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: 0, y: 0 };
    const j = $('joy'); j.style.display = 'block'; j.style.left = e.clientX + 'px'; j.style.top = e.clientY + 'px'; j.firstElementChild.style.transform = '';
  } else if (!drag) drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (joy && e.pointerId === joy.id) {
    let dx = e.clientX - joy.x0, dy = e.clientY - joy.y0; const d = Math.hypot(dx, dy); if (d > 50) { dx *= 50 / d; dy *= 50 / d; }
    joy.x = dx / 50; joy.y = dy / 50; $('joy').firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
  } else if (drag && e.pointerId === drag.id) {
    camYaw -= (e.clientX - drag.x) * 0.006; camPitch = clamp(camPitch + (e.clientY - drag.y) * 0.004, 0.1, 1.15);
    drag.x = e.clientX; drag.y = e.clientY;
  }
});
const endPtr = e => {
  if (joy && e.pointerId === joy.id) { joy = null; $('joy').style.display = 'none'; }
  if (drag && e.pointerId === drag.id) drag = null;
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => { e.preventDefault(); camDist = clamp(camDist * (1 + Math.sign(e.deltaY) * 0.1), 4, 14); }, { passive: false });
{
  const b = $('bAxe');
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); axeBtn = true; b.classList.add('on'); b.setPointerCapture(e.pointerId); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => { axeBtn = false; b.classList.remove('on'); });
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.running && !S.paused) togglePause(); });

// ---------------- pornire ----------------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (S.running && !S.paused) update(dt);
  else if (!S.running) { camYaw += dt * 0.08; }
  placeCamera(dt);
  hud3d();
  if ((mmTick++ & 1) === 0) drawMinimap();
  if (S.wantPhoto) capturePhoto();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
buildForest(4242);
hud(); placeCamera(0);
startPanel(false);
$('loading').remove();
frame();

window.__pd = { S, P, A: ALEXES[0], ALEXES, get trees() { return trees; }, update, newGame, alexSpawn, alexSees, hitTree, fell, sell,
  setCam(y) { camYaw = y; }, place(o, x, z, yaw) { o.x = x; o.z = z; if (yaw !== undefined) o.yaw = o.tYaw = yaw; } };
