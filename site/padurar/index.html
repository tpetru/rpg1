<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pădurarul 3D</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a7c4b5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; background: #2f4a33; z-index: 50; }
  .chip { background: rgba(18, 30, 22, .62); border-radius: 12px; padding: 7px 12px; backdrop-filter: blur(4px); }
  #hud { position: fixed; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; align-items: flex-start; }
  #money { font-size: 22px; font-weight: 800; }
  #load, #clock, #strikes { font-size: 14px; font-weight: 600; }
  #load.full { background: rgba(170, 90, 10, .8); }
  #strikes b { color: #ff5a4a; }
  #btns { position: fixed; right: 12px; top: 12px; display: flex; gap: 6px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
  .ib { width: 40px; height: 40px; font-size: 19px; background: rgba(18, 30, 22, .62); color: #fff; }
  .ib:hover { background: rgba(18, 30, 22, .85); }
  #mm { position: fixed; left: 12px; bottom: 12px; width: 150px; height: 150px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); box-shadow: 0 3px 12px rgba(0,0,0,.35); pointer-events: none; }
  #alert { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); font-weight: 700; font-size: 15px; display: none; align-items: center; gap: 8px; pointer-events: none; white-space: nowrap; }
  #alert.show { display: flex; }
  #alert.seen { background: rgba(200, 30, 20, .85); animation: pulse .6s infinite alternate; }
  #alert .arr { display: inline-block; font-size: 18px; transition: transform .1s; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(255,60,40,.6); } to { box-shadow: 0 0 0 8px rgba(255,60,40,0); } }
  #treeinfo { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); text-align: center; display: none; pointer-events: none; min-width: 220px; }
  #treeinfo.show { display: block; }
  #tiName { font-weight: 700; font-size: 15px; }
  #tiTag { font-size: 13px; margin-top: 2px; }
  #tiTag.bad { color: #ff7a6a; } #tiTag.ok { color: #8fe58a; } #tiTag.seal { color: #ffd34d; }
  #tiBar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); margin-top: 6px; overflow: hidden; }
  #tiBar i { display: block; height: 100%; width: 100%; background: #ffd34d; }
  #toast { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); font-size: 18px; font-weight: 700; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; max-width: calc(100vw - 32px); }
  #toast.show { opacity: 1; }
  #toast.bad { background: rgba(190, 30, 20, .88); }
  #toast.good { background: rgba(30, 120, 40, .85); }
  #bubble { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); background: #fff; color: #222; font-weight: 700; font-size: 15px; padding: 9px 13px; border-radius: 14px; max-width: 260px; text-align: center; pointer-events: none; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: #fff; }
  #bubble.shout { background: #fff3c4; font-size: 16px; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .5s; z-index: 15; }
  #polaroid { position: fixed; right: 18px; bottom: 90px; background: #fdfdf8; color: #333; padding: 8px 8px 6px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.45); transform: rotate(4deg) scale(.6); opacity: 0; transition: all .45s; pointer-events: none; z-index: 14; text-align: center; font-size: 13px; font-weight: 700; }
  #polaroid.show { opacity: 1; transform: rotate(4deg) scale(1); }
  #polaroid canvas { width: 240px; height: 180px; display: block; margin-bottom: 4px; }
  #joy { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); display: none; pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.45); }
  #bTruck { position: fixed; right: 112px; bottom: 30px; padding: 12px 16px; font-size: 16px; font-weight: 800; background: rgba(40, 90, 160, .9); color: #fff; box-shadow: 0 4px 0 rgba(20,45,90,.9); display: none; }
  #bTruck.show { display: block; }
  body.touch #bTruck { bottom: 34px; }
  #bearIcon { position: fixed; left: 50%; top: 58px; margin-left: -34px; font-size: 60px; line-height: 1; display: none; pointer-events: none; filter: drop-shadow(0 0 10px rgba(255,40,20,.9)); animation: shake .12s infinite; }
  #bearIcon.show { display: block; }
  @keyframes shake { 0% { transform: translate(-3px, 1px) rotate(-8deg); } 50% { transform: translate(3px, -2px) rotate(8deg); } 100% { transform: translate(-2px, 2px) rotate(-5deg); } }
  #bAxe { position: fixed; right: 16px; bottom: 18px; width: 84px; height: 84px; border-radius: 50%; font-size: 40px; background: rgba(150, 60, 20, .75); color: #fff; box-shadow: 0 4px 0 rgba(80,30,10,.8); }
  #bAxe:active, #bAxe.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(80,30,10,.8); }
  #hint { position: fixed; right: 12px; bottom: 112px; font-size: 13px; opacity: .85; pointer-events: none; text-align: right; }
  body.touch #hint { display: none; }
  body.touch #mm { left: auto; right: 12px; bottom: auto; top: 60px; width: 110px; height: 110px; }
  body.touch #treeinfo { bottom: 120px; }
  #overlay { position: fixed; inset: 0; display: none; place-items: center; background: rgba(10, 25, 15, .5); z-index: 20; padding: 16px; }
  #overlay.show { display: grid; }
  .panel { background: #fbf6ea; color: #33291c; border-radius: 22px; padding: 22px 24px; width: min(600px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .panel h1 { margin: 0 0 6px; font-size: 32px; color: #2f6b2c; text-align: center; }
  .panel h2 { margin: 0 0 8px; font-size: 26px; color: #9b3a1a; text-align: center; }

  .legend div { border-radius: 12px; padding: 10px; font-size: 14px; line-height: 1.4; }
  .lg-ok { background: #e3f1dc; border: 2px solid #7cb26a; }
  .lg-bad { background: #f6e6d2; border: 2px solid #c08a4a; }
  .big { display: block; margin: 14px auto 4px; background: #2f7d32; color: #fff; font-size: 20px; font-weight: 800; padding: 13px 34px; box-shadow: 0 4px 0 #1d5420; }
  .big:hover { background: #379139; }
  .best { text-align: center; font-size: 13px; opacity: .75; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; margin: 10px auto; max-width: 340px; font-size: 16px; }
  .stats b { text-align: right; }
  .photos { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
  .photos img { width: 150px; border: 6px solid #fff; border-bottom-width: 18px; box-shadow: 0 4px 12px rgba(0,0,0,.3); transform: rotate(-2deg); }
  .photos img:nth-child(2) { transform: rotate(3deg); }
  kbd { background: #e7dcc6; border-radius: 5px; padding: 1px 6px; font-size: 13px; }
  @media (max-width: 520px) { .legend { grid-template-columns: 1fr; } .panel { padding: 16px; } .panel h1 { font-size: 26px; } }

<div id="overlay" class="show"><div class="panel" id="panel"></div></div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = THREE.MathUtils.clamp;
const TAU = Math.PI * 2;
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');

// ---------------- reguli ----------------
const FOREST_R = 104, WALL_R = 106, CLEAR_R = 14;
const TRUCK = { x: 0, z: -9, yaw: 0, v: 0 };
const TRL = { x: -1.6, z: -9, yaw: 0 }, TRL_L = 3.8, RA = 2.85, HITCH = 2.2; // RA: puntea din spate a tractorului, HITCH: cârligul
const trlPt = (lx, lz) => { const c = Math.cos(TRL.yaw), n = Math.sin(TRL.yaw); return [TRL.x + lx * c + lz * n, TRL.z - lx * n + lz * c]; };
const truckPt = (lx, lz) => { const c = Math.cos(TRUCK.yaw), n = Math.sin(TRUCK.yaw); return [TRUCK.x + lx * c + lz * n, TRUCK.z - lx * n + lz * c]; };
const SEE = 22, SEE_ANG = 0.9, HEAR = 28;
const DAY = 300, CAP = 4, TRL_CAP = 12, MAX_STRIKES = 3;
const SHOUT = 'Alex Nedea este numele meu, de la RecorderZ. Ce faceți aici?';
const SAVE = 'padurar3d';

// ---------------- scenă ----------------
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdcc8a6);
scene.fog = new THREE.Fog(0xcdb896, 30, 150);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);
const alexCam = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffe6c0, 0x5a4630, 1.55));
const sun = new THREE.DirectionalLight(0xffc98a, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 1, far: 160 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const M = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...o });
const plaidTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#b8281f'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(25,10,10,.55)'; g.fillRect(0, 18, w, 14); g.fillRect(18, 0, 14, h);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 50, w, 4); g.fillRect(50, 0, 4, h);
}, true);
const birchTex = (bg, n) => canvasTex(64, 128, (g, w, h) => {
  g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = '#2a2622';
  for (let i = 0; i < n; i++) g.fillRect(Math.random() * w, Math.random() * h, 5 + Math.random() * 16, 2 + Math.random() * 3);
}, true);
const ringTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#d8b583'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(120,80,40,.5)'; g.lineWidth = 2;
  for (let r = 4; r < 32; r += 5) { g.beginPath(); g.arc(32, 32, r, 0, TAU); g.stroke(); }
});
const tapeTex = canvasTex(64, 16, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#d0201a';
  for (let x = -16; x < w; x += 16) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + 8, h); g.lineTo(x + 16, 0); g.lineTo(x + 8, 0); g.fill(); }
}, true);
tapeTex.repeat.set(4, 1);

const MAT = {
  bark: M(0x5e4128), barkSick: M(0x7b7368), barkDead: M(0x928b80),
  birch: M(0xffffff, { map: birchTex('#efebe2', 22) }), birchSick: M(0xffffff, { map: birchTex('#b9b1a3', 40) }),
  leaf: [M(0xc8641e), M(0xd9a02a), M(0x8a9a2a), M(0xb4421c), M(0xe0b23a)], spruce: [M(0x1d4a2a), M(0x235230), M(0x1a4426)],
  birchLeaf: [M(0xe8c23a), M(0xf0d050), M(0xd8a82a)],
  sick: [M(0x6e5a40), M(0x75644c), M(0x5f5040)], spruceSick: [M(0x8d5a2a), M(0xa06c33), M(0x7e5a36)],
  fungus: M(0xdcc490), stumpTop: M(0xffffff, { map: ringTex }), tape: M(0xffffff, { map: tapeTex }),
  black: M(0x151515), steel: M(0xb9c0c6), handle: M(0x8a5a2b), rock: M(0x8a8a84), bush: M(0x3d6e2e),
  grass: M(0x4f8a35), truck: M(0x2f6aa8), truckDark: M(0x22303c), tire: M(0x1b1b1b), log: M(0x7a5532),
};

// ---------------- geometrii comune ----------------
const BOX = new THREE.BoxGeometry(1, 1, 1);
const geo = {
  cyl: new THREE.CylinderGeometry(0.7, 1, 1, 7).translate(0, 0.5, 0),
  cone: new THREE.ConeGeometry(1, 1, 7).translate(0, 0.5, 0),
  blob: new THREE.IcosahedronGeometry(1, 0),
  branch: new THREE.CylinderGeometry(0.55, 1, 1, 5).translate(0, 0.5, 0),
  shelf: new THREE.CylinderGeometry(1, 1, 0.14, 8, 1, false, 0, Math.PI),
  stump: new THREE.CylinderGeometry(1, 1.1, 1, 9).translate(0, 0.5, 0),
  tape: new THREE.CylinderGeometry(1, 1, 1, 12, 1, true),
  log: new THREE.CylinderGeometry(1, 1, 1, 7),
};
function part(g, m, sx, sy, sz, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, shadow = true) {
  const o = new THREE.Mesh(g, m); o.scale.set(sx, sy, sz); o.position.set(x, y, z); o.rotation.set(rx, ry, rz);
  o.castShadow = shadow; o.receiveShadow = true; return o;
}

// ---------------- teren: dealuri, vale cu pârâu, drum forestier ----------------
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const curve = (arr, n) => new THREE.CatmullRomCurve3(arr.map(([x, z]) => new THREE.Vector3(x, 0, z))).getPoints(n).map(v => [v.x, v.z]);
function makePath(pts) {
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (const [x, z] of pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
  return { pts, x0, x1, z0, z1 };
}
function segInfo(px, pz, P, pad = 12) {
  if (px < P.x0 - pad || px > P.x1 + pad || pz < P.z0 - pad || pz > P.z1 + pad) return { d: 99, i: 0 };
  const pts = P.pts; let best = 1e9, bi = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const ax = pts[i][0], az = pts[i][1], dx = pts[i + 1][0] - ax, dz = pts[i + 1][1] - az;
    const t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz), 0, 1);
    const ex = px - ax - dx * t, ez = pz - az - dz * t, d = ex * ex + ez * ez;
    if (d < best) { best = d; bi = i + t; }
  }
  return { d: Math.sqrt(best), i: bi };
}
const lerpArr = (a, i) => { const k = Math.min(a.length - 1, Math.floor(i)), f = i - k; return a[k] + (a[Math.min(k + 1, a.length - 1)] - a[k]) * f; };
const ROADS = [
  makePath(curve([[0, -9], [-14, -20], [-32, -30], [-52, -26], [-70, -38], [-88, -58], [-104, -72], [-130, -84]], 70)),
  makePath(curve([[0, -9], [14, 2], [26, 20], [31, 42], [42, 62], [64, 78], [88, 86], [130, 96]], 70)),
];
const CREEK = makePath(curve([[-160, 28], [-112, 52], [-72, 38], [-32, 62], [8, 50], [48, 68], [90, 56], [160, 74]], 90));
function baseH(x, z, dc) {
  const r = Math.hypot(x, z);
  let h = 5.5 * Math.sin(x * 0.033 + 1.3) * Math.cos(z * 0.029 - 0.4) + 3.2 * Math.sin(x * 0.071 + z * 0.052)
    + 1.4 * Math.sin(x * 0.16 - z * 0.13) + 0.5 * Math.sin(x * 0.33 + z * 0.29);
  h *= smooth(10, 34, r);
  const v = Math.exp(-((dc / 14) ** 2));
  h = h + (-3.6 + h * 0.15 - h) * v - 0.9 * Math.exp(-((dc / 2.2) ** 2));
  return h + Math.max(0, r - 108) * 0.35;
}
const ROAD_H = ROADS.map(P => {
  let h = P.pts.map(([x, z]) => baseH(x, z, segInfo(x, z, CREEK).d));
  for (let it = 0; it < 5; it++) h = h.map((_, i) => { let s = 0; for (let k = -5; k <= 5; k++) s += h[clamp(i + k, 0, h.length - 1)]; return s / 11; });
  for (let i = 0; i < 4; i++) h[i] *= i / 4;
  return h;
});
// podul peste pârâu (unde drumul 2 taie pârâul): drept, de la un mal la altul, cu tablier ușor arcuit
const BRIDGE = (() => {
  const pts = ROADS[1].pts, H = ROAD_H[1], cd = (x, z) => segInfo(x, z, CREEK).d;
  let best = 1e9, bi = 0;
  pts.forEach(([x, z], i) => { const d = cd(x, z); if (d < best) { best = d; bi = i; } });
  let ia = bi, ib = bi;
  const far = i => Math.hypot(pts[i][0] - pts[bi][0], pts[i][1] - pts[bi][1]);
  while (ia > 0 && far(ia) < 11) ia--;
  while (ib < pts.length - 1 && far(ib) < 11) ib++;
  const [ax, az] = pts[ia], [bx, bz] = pts[ib], len = Math.hypot(bx - ax, bz - az);
  const ci = segInfo(pts[bi][0], pts[bi][1], CREEK).i, cp = CREEK.pts[Math.round(ci)];
  const water = baseH(cp[0], cp[1], 0) + 0.5;
  const B = { x: (ax + bx) / 2, z: (az + bz) / 2, dx: (bx - ax) / len, dz: (bz - az) / len, len, w: 6.2, hA: H[ia], hB: H[ib], water, ia, ib };
  B.bump = Math.max(0, water + 1.7 - (B.hA + B.hB) / 2);
  B.y = (B.hA + B.hB) / 2 + B.bump;
  return B;
})();
function brLocal(x, z) { const rx = x - BRIDGE.x, rz = z - BRIDGE.z; return { al: rx * BRIDGE.dx + rz * BRIDGE.dz, ac: -rx * BRIDGE.dz + rz * BRIDGE.dx }; }
function deckH(al) { const t = clamp(al / BRIDGE.len + 0.5, 0, 1); return BRIDGE.hA + (BRIDGE.hB - BRIDGE.hA) * t + BRIDGE.bump * Math.sin(Math.PI * t); }
const onDeck = (x, z, m = 0) => { const b = brLocal(x, z); return Math.abs(b.al) < BRIDGE.len / 2 + 0.6 && Math.abs(b.ac) < BRIDGE.w / 2 - m; };
// drumul urcă pe pod: între capete, înălțimea drumului e chiar tablierul (malurile devin rampe)
for (let i = BRIDGE.ia; i <= BRIDGE.ib; i++) ROAD_H[1][i] = deckH(brLocal(...ROADS[1].pts[i]).al);
function heightAt(x, z) {
  const dc = segInfo(x, z, CREEK, 30).d;
  let h = baseH(x, z, dc);

let LOGS = [];
const logMoss = M(0x5f6e2c), logRoot = M(0x4a3522), logDead = M(0x8a7a66), UP = new THREE.Vector3(0, 1, 0);
function segDist(px, pz, L) {
  const t = clamp((px - L.ax) * L.dx + (pz - L.az) * L.dz, 0, L.len), qx = L.ax + L.dx * t, qz = L.az + L.dz * t;

function buildLogs(n) {
  for (let tries = 0; tries < 900 && LOGS.length < n; tries++) {
    const a = srand() * TAU, r = 20 + srand() * (FOREST_R - 28), ax = Math.cos(a) * r, az = Math.sin(a) * r;
    const yaw = srand() * TAU, dx = Math.cos(yaw), dz = Math.sin(yaw), len = 5 + srand() * 6, rad = 0.22 + srand() * 0.16;
    const L = { ax, az, dx, dz, len, r: rad, bx: ax + dx * len, bz: az + dz * len };
    let ok = Math.hypot(L.bx, L.bz) < FOREST_R - 6;
    for (let k = 0; k <= 4 && ok; k++) {
      const x = ax + dx * len * k / 4, z = az + dz * len * k / 4;
      if (roadDist(x, z) < 4.5 || creekDist(x, z) < 4 || Math.hypot(x - TRUCK.x, z - TRUCK.z) < 16 || Math.hypot(x - GATER.x, z - GATER.z) < 14) ok = false;
    }
    if (!ok || trees.some(t => segDist(t.x, t.z, L).d < t.trunkR + rad + 0.9) || LOGS.some(o => Math.hypot(o.ax + o.dx * o.len / 2 - (ax + dx * len / 2), o.az + o.dz * o.len / 2 - (az + dz * len / 2)) < 9)) continue;

    const hA = heightAt(ax, az) + rad * 0.8, hB = heightAt(L.bx, L.bz) + rad * 0.7;
    const A = new THREE.Vector3(ax, hA, az), B = new THREE.Vector3(L.bx, hB, L.bz), dir = B.clone().sub(A), ln = dir.length(); dir.normalize();
    const trunk = new THREE.Mesh(geo.log, bark); trunk.scale.set(rad, ln, rad); trunk.position.copy(A).addScaledVector(dir, ln / 2);
    trunk.quaternion.setFromUnitVectors(UP, dir); trunk.castShadow = trunk.receiveShadow = true; g.add(trunk);

    const root = new THREE.Mesh(geo.log, logRoot); root.scale.set(rad * 3.6, 0.35, rad * 3.6); root.position.copy(A).addScaledVector(dir, -0.15).add(new THREE.Vector3(0, rad * 1.4, 0));

function buildForest(sd) {
  clearForest(); seed = sd;
  const pts = [];
  for (let tries = 0; tries < 4000 && pts.length < 160; tries++) {
    const a = srand() * TAU, r = Math.sqrt(16 * 16 + srand() * (FOREST_R * FOREST_R - 256));
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x - TRUCK.x, z - TRUCK.z) < 14 || Math.hypot(x - GATER.x, z - GATER.z) < 13 || roadDist(x, z) < 5.5 || creekDist(x, z) < 4.5) continue;
    if (pts.every(p => (p.x - x) ** 2 + (p.z - z) ** 2 > 4.6 * 4.6)) pts.push({ x, z });
  }
  for (const p of pts) {
    const tv = srand(), type = tv < 0.4 ? 'brad' : tv < 0.75 ? 'stejar' : 'mesteacan';
    const healthy = srand() < 0.55, dead = !healthy && srand() < 0.3;

    const t = { x: p.x, z: p.z, type, healthy, dead, size, state: 'stand', th: 0, om: 0, wob: 0 };
    t.value = healthy ? Math.round(BASE_VALUE[type] * size / 10) * 10 : Math.round((30 + srand() * 30) * size / 5) * 5;
    t.maxHp = t.hp = Math.round(3 + size * 3 + (type === 'stejar' ? 1 : 0));
    t.name = TYPE_NAME[type] + (healthy ? ' sănătos' : dead ? ' uscat' : ' bolnav');
    t.mesh = makeTreeMesh(t);
    t.y = Math.min(...[[1, 0], [-1, 0], [0, 1], [0, -1]].map(([a, b]) => heightAt(p.x + a * (t.trunkR + 0.2), p.z + b * (t.trunkR + 0.2)))) - 0.12;

  }

}

function placeTruck() {
  const [fx, fz] = truckPt(5.2, 0), [bx, bz] = truckPt(2.6, 0), hF = walkH(fx, fz), hB = walkH(bx, bz);
  const pitch = Math.atan2(hF - hB, 2.6);

function followTrailer() {
  const [hx, hz] = truckPt(HITCH, 0);

function driveTractor(dt, f, s) {
  if (S.freeze > 0) f = 0;
  const tgt = f > 0.1 ? f * 8 : f < -0.1 ? f * 3.5 : 0;
  const a = Math.sign(tgt - TRUCK.v) !== Math.sign(TRUCK.v) && TRUCK.v ? 9 : tgt ? 3.5 : 4;

  TRUCK.x = nrx - Math.cos(TRUCK.yaw) * RA; TRUCK.z = nrz + Math.sin(TRUCK.yaw) * RA;

    const [x, z] = tr ? trlPt(cx, 0) : truckPt(cx, 0);

    const b = brLocal(x, z);
    if (Math.abs(b.al) < BRIDGE.len / 2 && Math.abs(Math.abs(b.ac) - BRIDGE.w / 2) < cr * 0.85) hit = true;

    for (const L of LOGS) if (segDist(x, z, L).d < cr + L.r) { hit = true; break; }
    if (hit) break;
  }

    Object.assign(TRUCK, { x: ox, z: oz, yaw: oy }); Object.assign(TRL, otr);

      B.x = x + dx / (d || 1) * m; B.z = z + dz / (d || 1) * m;
    }

  if (TRUCK.v > 0.8) { const fw = Math.atan2(Math.cos(TRUCK.yaw), -Math.sin(TRUCK.yaw)); camYaw += angDiff(camYaw, fw) * Math.min(1, dt * 1.8); }
}
