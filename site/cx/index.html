<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b33">
<title>Moș Crăciun și berea · no-santos</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0d1b33; color:#fff8ec;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; }
  #ov { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px;
    background:rgba(8,14,30,.55); }
  #ov.hide { display:none; }
  .card { max-width:420px; width:100%; background:rgba(16,28,56,.92); border:1px solid rgba(255,255,255,.14);
    border-radius:18px; padding:22px 20px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  .card h1 { margin:0 0 6px; font-size:26px; letter-spacing:.3px; }
  .card h1 span { color:#ffcf5a; }
  .card p { margin:8px 0; color:#d5d9e6; line-height:1.45; font-size:15px; }
  .card .keys { font-size:13.5px; color:#aab3c8; }
  .card b { color:#fff; }
  .card .big { font-size:40px; font-weight:800; color:#ffcf5a; margin:6px 0 2px; }
  button.go { margin-top:14px; font:inherit; font-weight:700; font-size:18px; color:#2a1500; background:#ffcf5a;
    border:0; border-radius:12px; padding:12px 30px; cursor:pointer; box-shadow:0 4px 0 #b88a1c; }
  button.go:active { transform:translateY(2px); box-shadow:0 2px 0 #b88a1c; }
  a.back { position:fixed; top:10px; left:12px; color:#aab3c8; font-size:13px; text-decoration:none; z-index:2; }
  #mute { position:fixed; top:6px; right:10px; z-index:2; background:none; border:0; color:#aab3c8; font-size:20px; cursor:pointer; padding:4px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="back" href="/">← no-santos</a>
<button id="mute" title="Sunet (M)">🔊</button>
<div id="ov">
  <div class="card" id="card"></div>
</div>
<script>
'use strict';
// ---------- Nivelurile bradului: fiecare sticlă prinsă adaugă podoabe, fiecare ratată le dă jos ----------
const LEVELS = [
  { name:'Brad gol' },
  { name:'Ghirlandă aurie',                  lost:'ghirlanda aurie' },
  { name:'Globuri roșii',                    lost:'globurile roșii' },
  { name:'Globuri aurii și argintii',        lost:'globurile aurii și argintii' },
  { name:'Instalație cu lumini calde',       lost:'instalația cu lumini calde' },
  { name:'Bastonașe de bomboane',            lost:'bastonașele de bomboane' },
  { name:'Instalație colorată care clipește', lost:'instalația colorată' },
  { name:'Fundițe roșii',                    lost:'fundițele roșii' },
  { name:'Fulgi argintii și beteală',        lost:'fulgii și beteala' },
  { name:'Cadouri sub brad',                 lost:'cadourile' },
  { name:'Steaua din vârf!',                 lost:'steaua din vârf' },
];
const MAXO = LEVELS.length - 1;
const LANES = 5;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ov = document.getElementById('ov'), card = document.getElementById('card');
let W = 0, H = 0, DPR = 1, L = {};

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (W >= H * 1.05) {               // peisaj: teren stânga, bradul dreapta
    const pw = Math.min(W * 0.34, H * 0.62);
    L = { fx:0, fy:0, fw:W - pw, fh:H, px:W - pw, py:0, pw, ph:H, land:true };
  } else {                           // portret (telefon): bradul sus
    const ph = Math.round(H * 0.30);
    L = { fx:0, fy:ph, fw:W, fh:H - ph, px:0, py:0, pw:W, ph, land:false };
  }
  L.lw = L.fw / LANES;
  L.santaH = Math.min(L.fh * 0.22, L.lw * 1.5);
  L.groundY = L.fy + L.fh - 8;
  L.catchY = L.groundY - L.santaH * 0.47;   // marginea de sus a coșului
  L.bh = Math.min(L.lw * 0.62, L.fh * 0.12); // înălțime sticlă
  makeSnow();
}
addEventListener('resize', layout);

// ---------- stare ----------
const S = { mode:'menu', score:0, lives:5, outfit:0, maxOutfit:0, caught:0, missed:0, streak:0,
  lane:2, sx:2, bottles:[], parts:[], flash:0, t:0, spawnT:0, msg:'', msgT:0, best:0, sway:0 };
try { S.best = +localStorage.getItem('cx-best') || 0; } catch (e) {}

function laneX(i) { return L.fx + L.lw * (i + 0.5); }

function reset() {
  Object.assign(S, { mode:'play', score:0, lives:5, outfit:0, maxOutfit:0, caught:0, missed:0, streak:0,
    lane:2, sx:2, bottles:[], parts:[], flash:0, t:0, spawnT:0.6, msg:'Prinde berea!', msgT:1.6, sleigh:0, stageFx:0, coal:0, fw:0 });
  ov.classList.add('hide');
}

// dificultate: crește cu sticlele prinse
function speed() { return L.fh * (0.33 + Math.min(S.caught, 80) * 0.0075); }       // px/s
function gap()   { return Math.max(0.42, 1.25 - S.caught * 0.014); }                  // s între sticle

function spawn() {
  // nu pune sticle imposibil de prins: ultima sticlă trebuie să lase timp de mers
  let lane = Math.floor(Math.random() * LANES);
  const lastB = S.bottles.filter(b => b.kind !== 'coal');
  const last = lastB[lastB.length - 1];
  // cărbune (din 15 sticle): pe altă coloană decât ultima sticlă și decât unde trebuie să fie Moșul
  if (stage(15) && last && Math.random() < Math.min(0.28, 0.12 + S.caught * 0.0015)) {
    const bad = new Set([last.lane, S.lane]);
    const free = [0,1,2,3,4].filter(i => !bad.has(i));
    S.bottles.push({ lane: free[Math.floor(Math.random() * free.length)], y: L.fy - L.bh, kind:'coal',
      rot: Math.random() * 6, vr: (Math.random() - .5) * 3 });
    return;
  }
  if (last) {
    const tLeft = (L.catchY - last.y) / speed();
    const lanesOk = Math.max(1, Math.floor(tLeft / 0.13));
    if (Math.abs(lane - last.lane) > lanesOk) lane = last.lane + Math.sign(lane - last.lane) * lanesOk;
  }
  // nu pune sticla pe o coloană unde mai cade un cărbune (Moșul ar trebui să stea sub el)
  const coalLanes = new Set(S.bottles.filter(b => b.kind === 'coal' && b.y + L.bh < L.catchY + L.bh * .5).map(b => b.lane));
  if (coalLanes.has(lane)) {
    const opts = [0,1,2,3,4].filter(i => !coalLanes.has(i)).sort((a, b) => Math.abs(a - lane) - Math.abs(b - lane));
    if (opts.length) lane = opts[0];
  }
  const kinds = ['brown','brown','brown','green','can'];
  let kind = kinds[Math.floor(Math.random() * kinds.length)];
  if (stage(50) && Math.random() < 0.1) kind = 'gold';
  S.bottles.push({ lane, y: L.fy - L.bh, kind,
    rot: (Math.random() - .5) * 0.3, vr: (Math.random() - .5) * 1.2 });
}

function say(m, t = 1.2) { S.msg = m; S.msgT = t; }

// recompense: ce se deblochează după câte sticle prinse
const STAGES = [
  { at:10,  msg:'Moșul a prins curaj! 🍺' },
  { at:20,  msg:'Bradul sclipește! ✨' },
  { at:25,  msg:'Moșul e cherchelit… hic!' },
  { at:30,  msg:'Petrecere! Lumini disco 🪩' },
  { at:15,  msg:'Atenție la cărbuni! Nu-i prinde ⚫' },
  { at:40,  msg:'Sosesc renii cu sania! 🦌' },
  { at:50,  msg:'Sticle de aur! +50 ✨' },
  { at:75,  msg:'Ninsoare de sărbătoare ❄️' },
  { at:100, msg:'100 de beri! Artificii! 🎆' },
];
function stage(n) { return S.caught >= n; }
function checkStages() {
  for (const st of STAGES) if (S.caught === st.at) { say(st.msg, 2.2); S.stageFx = 1; sfx('stage'); }
  if (S.caught >= 40 && S.caught % 20 === 0) S.sleigh = 0.001;     // sania trece la 40, 60, 80…
  if (S.caught >= 25 && S.caught % 10 === 5 && S.caught !== 25 && S.msgT <= 0.3) say('Hic! 🍺', 0.9);
}

function catchBottle(b) {
  if (b.kind === 'coal') return catchCoal(b);
  S.caught++; S.streak++;
  let pts = 10 + Math.min(S.streak, 20) + (b.kind === 'gold' ? 50 : 0);
  if (S.outfit < MAXO) {
    S.outfit++;
    S.maxOutfit = Math.max(S.maxOutfit, S.outfit);
    say('🎄 ' + LEVELS[S.outfit].name);
  } else { pts += 15; say('Brad complet! +' + pts); }
  if (S.caught % 15 === 0 && S.lives < 5) { S.lives++; say('+1 viață 🎄'); }
  if (b.kind === 'gold') say('Sticlă de aur! +' + pts, 1.4);
  checkStages();
  S.score += pts;
  S.flash = 1;
  for (let i = 0; i < 14; i++) S.parts.push({ x: laneX(b.lane), y: L.catchY, vx:(Math.random()-.5)*220, vy:-Math.random()*260-60,
    life:0.8, c: Math.random() < .5 ? '#ffd54a' : '#fff6d0', r: 2 + Math.random()*3, g:600 });
  sfx('catch');
}

function catchCoal(b) {
  S.streak = 0; S.lives--; S.coal = 1;
  if (S.outfit > 0) { say('Cărbune! Cade ' + LEVELS[S.outfit].lost, 1.6); S.outfit--; }
  else say('Cărbune! ⚫', 1.2);
  for (let i = 0; i < 16; i++) S.parts.push({ x: laneX(b.lane), y: L.catchY, vx:(Math.random()-.5)*240, vy:-Math.random()*200-40,
    life:0.8, c: Math.random() < .5 ? '#2b2b2b' : '#555', r: 2 + Math.random()*3, g:500 });
  sfx('miss');
  if (S.lives <= 0) gameOver();
}

function missBottle(b) {
  if (b.kind === 'coal') { for (let i = 0; i < 6; i++) S.parts.push({ x: laneX(b.lane), y: L.groundY - 4, vx:(Math.random()-.5)*120, vy:-Math.random()*80, life:.5, c:'#333', r:2, g:600 }); return; }
  S.missed++; S.streak = 0; S.lives--;
  if (S.outfit > 0) { say('Ratat! Cade ' + LEVELS[S.outfit].lost, 1.6); S.outfit--; }
  else say('Ratat!');
  for (let i = 0; i < 16; i++) S.parts.push({ x: laneX(b.lane), y: L.groundY - 4, vx:(Math.random()-.5)*300, vy:-Math.random()*220,
    life:0.7, c: b.kind === 'gold' ? '#ffd54a' : b.kind === 'green' ? '#3f9d5a' : b.kind === 'can' ? '#c9ced8' : '#8a4a12', r: 1.5 + Math.random()*2.5, g:800, shard:1 });
  sfx('miss');
  if (S.lives <= 0) gameOver();
}

function gameOver() {
  S.mode = 'over';
  const rec = S.score > S.best;
  if (rec) { S.best = S.score; try { localStorage.setItem('cx-best', S.best); } catch (e) {} }
  card.innerHTML = `<h1>Gata <span>petrecerea</span>!</h1>
    <div class="big">${S.score}</div>
    <p>${rec ? '🎉 Record nou!' : 'Record: <b>' + S.best + '</b>'}</p>
    <p>Sticle prinse: <b>${S.caught}</b> · ratate: <b>${S.missed}</b><br>
    Cel mai împodobit brad: <b>nivelul ${S.maxOutfit} din ${MAXO}</b></p>
    <button class="go" id="go">Încă o tură</button>`;
  ov.classList.remove('hide');
  document.getElementById('go').onclick = () => { audioInit(); reset(); };
}

function menu() {
  card.innerHTML = `<h1>Moș Crăciun <span>și berea</span></h1>
    <p>Sticlele de bere cad pe 5 coloane. Prinde-le în coș!</p>
    <p>La fiecare sticlă prinsă, Moșul mai pune ceva în <b>brad</b>: ghirlandă, globuri, instalații, bastonașe,
    fundițe, cadouri și, la nivelul 10, steaua din vârf. La fiecare sticlă ratată cade ultima podoabă.</p>
    <p class="keys">Cu cât prinzi mai multe: Moșul se cherchelește, bradul sclipește, vine petrecerea disco, trec renii cu sania, apar sticle de aur și artificii. Ai grijă la cărbuni!</p>
    <p class="keys">Calculator: <b>← →</b> sau <b>A D</b> (sau 1–5) · Telefon: atinge coloana unde vrei să meargă Moșul.<br>
    P = pauză · M = sunet</p>
    ${S.best ? '<p>Record: <b>' + S.best + '</b></p>' : ''}
    <button class="go" id="go">Start</button>`;
  ov.classList.remove('hide');
  document.getElementById('go').onclick = () => { audioInit(); reset(); };
}

function pause(on) {
  if (S.mode === 'play' && on) {
    S.mode = 'pause';
    card.innerHTML = `<h1>Pauză</h1><p>Bradul așteaptă.</p><button class="go" id="go">Continuă</button>`;
    ov.classList.remove('hide');
    document.getElementById('go').onclick = () => pause(false);
  } else if (S.mode === 'pause' && !on) { S.mode = 'play'; ov.classList.add('hide'); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });

// ---------- control ----------
function move(d) { if (S.mode === 'play') S.lane = Math.max(0, Math.min(LANES - 1, S.lane + d)); }
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') { move(-1); e.preventDefault(); }
  else if (k === 'arrowright' || k === 'd') { move(1); e.preventDefault(); }
  else if (k >= '1' && k <= '5' && S.mode === 'play') S.lane = +k - 1;
  else if (k === 'p' || k === 'escape') pause(S.mode === 'play');
  else if (k === 'm') toggleMute();
  else if ((k === 'enter' || k === ' ') && S.mode !== 'play') { const g = document.getElementById('go'); if (g) g.click(); e.preventDefault(); }
});
cv.addEventListener('pointerdown', e => {
  if (S.mode !== 'play') return;
  if (e.clientX >= L.fx && e.clientX < L.fx + L.fw && e.clientY >= L.fy) {
    S.lane = Math.max(0, Math.min(LANES - 1, Math.floor((e.clientX - L.fx) / L.lw)));
  } else if (!L.land && e.clientY < L.fy) {
    // atingere pe panoul de sus: stânga/dreapta față de Moș
    move(e.clientX < laneX(S.sx) ? -1 : 1);
  }
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (S.mode === 'play' && e.buttons && e.clientY >= L.fy && e.clientX < L.fx + L.fw)
    S.lane = Math.max(0, Math.min(LANES - 1, Math.floor((e.clientX - L.fx) / L.lw)));
});

// ---------- sunet (WebAudio, fără fișiere) ----------
let AC = null, muted = false;
try { muted = localStorage.getItem('cx-mute') === '1'; } catch (e) {}
const muteBtn = document.getElementById('mute');
muteBtn.textContent = muted ? '🔇' : '🔊';
muteBtn.onclick = toggleMute;
function toggleMute() { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; try { localStorage.setItem('cx-mute', muted ? '1' : '0'); } catch (e) {} }
function audioInit() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type = 'sine', v = 0.15, when = 0, f2) {
  if (!AC || muted) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
function sfx(k) {
  if (k === 'catch') { tone(1568, .12, 'triangle', .12); tone(2093, .18, 'triangle', .1, .06); if (S.outfit === MAXO) tone(2637, .25, 'sine', .08, .12); }
  else if (k === 'stage') { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .18, 'triangle', .09, i * .08)); }
  else if (k === 'miss') { tone(220, .25, 'sawtooth', .08, 0, 90); tone(3200, .05, 'square', .04, .02); tone(2700, .05, 'square', .03, .07); }
}

// ---------- fundal: zăpadă ----------
let snow = [];
function makeSnow() { snow = Array.from({ length: Math.round(W * H / 9000) }, () => ({ x: Math.random()*W, y: Math.random()*H, r: .6 + Math.random()*2, s: 15 + Math.random()*35, p: Math.random()*6 })); }

// ---------- desen ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1730'); g.addColorStop(1, '#1d3561');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // coloane
  for (let i = 0; i < LANES; i++) {
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.025)' : 'rgba(255,255,255,.05)';
    ctx.fillRect(L.fx + i * L.lw, L.fy, L.lw, L.fh);
  }
  if (S.mode !== 'menu' && stage(30)) { // lumini disco pe coloane
    for (let i = 0; i < LANES; i++) {
      const hue = (S.t * 90 + i * 72) % 360;
      ctx.fillStyle = `hsla(${hue},90%,60%,${.06 + .05 * Math.sin(S.t * 6 + i)})`;
      ctx.fillRect(L.fx + i * L.lw, L.fy, L.lw, L.fh);
    }
  }
  // marcaj coloană curentă
  ctx.fillStyle = 'rgba(255,207,90,.06)';
  ctx.fillRect(L.fx + S.lane * L.lw, L.fy, L.lw, L.fh);
  // zăpadă jos
  ctx.fillStyle = '#e9f0fb';
  ctx.beginPath(); ctx.moveTo(L.fx, L.groundY);
  for (let x = 0; x <= L.fw; x += 20) ctx.lineTo(L.fx + x, L.groundY - 3 * Math.sin(x * 0.05));
  ctx.lineTo(L.fx + L.fw, H); ctx.lineTo(L.fx, H); ctx.fill();
  // fulgi (din 75: ninsoare mai deasă și mai mare)
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  const big = S.mode !== 'menu' && stage(75) ? 1.8 : 1;
  for (const f of snow) { ctx.beginPath(); ctx.arc(f.x + Math.sin(S.t + f.p) * 6, f.y, f.r * big, 0, 7); ctx.fill(); }
  drawSleigh();
}

// sanie cu reni care traversează cerul terenului
function drawSleigh() {
  if (!S.sleigh) return;
  const p = S.sleigh, s = Math.min(L.lw * 0.5, 48), x = L.fx - s * 6 + (L.fw + s * 10) * p, y = L.fy + L.fh * 0.16 + Math.sin(p * 12) * 10;
  ctx.save(); ctx.translate(x, y);
  // reni (doi, în față)
  for (let k = 0; k < 2; k++) {
    const rx = s * (1.6 + k * 1.3), leg = Math.sin(S.t * 14 + k) * s * .12;
    ctx.fillStyle = '#8a5a2b';
    ctx.beginPath(); ctx.ellipse(rx, 0, s * .45, s * .2, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(rx + s * .48, -s * .22, s * .14, s * .1, -.4, 0, 7); ctx.fill();
    ctx.fillRect(rx + s * .34, -s * .22, s * .08, s * .2);
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = s * .06;
    ctx.beginPath(); ctx.moveTo(rx - s * .3, s * .12); ctx.lineTo(rx - s * .35 - leg, s * .4); ctx.moveTo(rx + s * .3, s * .12); ctx.lineTo(rx + s * .35 + leg, s * .4); ctx.stroke();
    ctx.strokeStyle = '#d9c39a'; ctx.lineWidth = s * .04;
    ctx.beginPath(); ctx.moveTo(rx + s * .45, -s * .3); ctx.lineTo(rx + s * .4, -s * .48); ctx.moveTo(rx + s * .42, -s * .4); ctx.lineTo(rx + s * .3, -s * .48); ctx.stroke();
  }
  ctx.strokeStyle = '#e8b923'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(s * .9, -s * .05); ctx.lineTo(s * 1.25, 0); ctx.stroke();
  // sanie cu sacul de cadouri
  ctx.fillStyle = '#c8102e'; rr(-s * .2, -s * .35, s * 1.1, s * .45, s * .12); ctx.fill();
  ctx.strokeStyle = '#e8b923'; ctx.lineWidth = s * .06; ctx.beginPath(); ctx.moveTo(-s * .3, s * .2); ctx.lineTo(s * 1, s * .2); ctx.quadraticCurveTo(s * 1.15, s * .2, s * 1.1, s * .05); ctx.stroke();
  ctx.fillStyle = '#7a5230'; ctx.beginPath(); ctx.arc(s * .2, -s * .45, s * .25, 0, 7); ctx.fill();
  ctx.restore();
  // praf de stele în urmă
  if (Math.random() < .6) S.parts.push({ x: x - s * .3, y: y + s * .1, vx: -30, vy: 20, life: .7, c: '#ffe27a', r: 1.5, g: 40 });
}

function fireworks() {
  const x = L.fx + L.fw * (.15 + Math.random() * .7), y = L.fy + L.fh * (.1 + Math.random() * .3), hue = Math.random() * 360;
  for (let i = 0; i < 30; i++) { const a = i / 30 * Math.PI * 2, v = 120 + Math.random() * 60;
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, c: `hsl(${hue},95%,65%)`, r: 2, g: 120 }); }
}

function drawBottle(b) {
  const h = L.bh, w = h * 0.3, x = laneX(b.lane), y = b.y;
  ctx.save(); ctx.translate(x, y + h / 2); ctx.rotate(b.rot);
  if (b.kind === 'coal') {
    const r = h * 0.22;
    ctx.fillStyle = '#1e1e1e';
    ctx.beginPath(); for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2, rr2 = r * (0.75 + 0.25 * Math.sin(i * 2.7)); ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); } ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(-r * .3, -r * .3, r * .25, 0, 7); ctx.fill();
    ctx.restore(); return;
  }
  if (b.kind === 'can') {
    const cw = h * 0.42, ch = h * 0.72;
    const g = ctx.createLinearGradient(-cw/2, 0, cw/2, 0);
    g.addColorStop(0, '#8f96a3'); g.addColorStop(.35, '#f2f4f8'); g.addColorStop(1, '#7c8390');
    ctx.fillStyle = g; rr(-cw/2, -ch/2, cw, ch, cw * .15); ctx.fill();
    ctx.fillStyle = '#c8102e'; ctx.fillRect(-cw/2, -ch*.18, cw, ch*.36);
    ctx.fillStyle = '#ffd54a'; ctx.font = `bold ${Math.round(cw*.34)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('BERE', 0, 1);
    ctx.restore(); return;
  }
  const col = b.kind === 'gold' ? ['#a87b10', '#ffe27a'] : b.kind === 'green' ? ['#1f6b3a', '#3fae66'] : ['#5a2a07', '#b8641c'];
  if (b.kind === 'gold') { ctx.shadowColor = '#ffd54a'; ctx.shadowBlur = 14 + 6 * Math.sin(S.t * 8); }
  const g = ctx.createLinearGradient(-w/2, 0, w/2, 0);
  g.addColorStop(0, col[0]); g.addColorStop(.4, col[1]); g.addColorStop(1, col[0]);
  ctx.fillStyle = g;
  const top = -h/2, nw = w * 0.36;
  ctx.beginPath();
  ctx.moveTo(-nw/2, top + h*.06);
  ctx.lineTo(-nw/2, top + h*.3);
  ctx.quadraticCurveTo(-w/2, top + h*.38, -w/2, top + h*.5);
  ctx.lineTo(-w/2, h/2 - 3); ctx.quadraticCurveTo(-w/2, h/2, -w/2 + 3, h/2);
  ctx.lineTo(w/2 - 3, h/2); ctx.quadraticCurveTo(w/2, h/2, w/2, h/2 - 3);
  ctx.lineTo(w/2, top + h*.5);
  ctx.quadraticCurveTo(w/2, top + h*.38, nw/2, top + h*.3);
  ctx.lineTo(nw/2, top + h*.06); ctx.closePath(); ctx.fill();
  // capac
  ctx.fillStyle = '#e8b923'; ctx.fillRect(-nw/2 - 1, top, nw + 2, h * .07);
  // etichetă
  ctx.fillStyle = '#f7ead0'; ctx.fillRect(-w/2 + 1, top + h*.58, w - 2, h*.24);
  ctx.fillStyle = '#c8102e'; ctx.fillRect(-w/2 + 1, top + h*.58, w - 2, h*.05);
  // reflex
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(-w*.3, top + h*.45, w*.1, h*.45);
  ctx.restore();
}

function drawSanta() {
  const h = L.santaH, x = L.fx + L.lw * (S.sx + 0.5), base = L.groundY, u = h / 100;
  ctx.save(); ctx.translate(x, base);
  const bob = Math.sin(S.t * 8) * (Math.abs(S.lane - S.sx) > .05 ? 2 : .6);
  ctx.translate(0, bob);
  const tipsy = S.mode === 'menu' ? 0 : Math.min(1, Math.max(0, (S.caught - 10) / 40));
  ctx.rotate(Math.sin(S.t * 2.3) * 0.13 * tipsy + Math.sin(S.t * 5.1) * 0.03 * tipsy);
  // cizme
  ctx.fillStyle = '#1b1b1b';
  rr(-22*u, -8*u, 18*u, 8*u, 3*u); ctx.fill(); rr(4*u, -8*u, 18*u, 8*u, 3*u); ctx.fill();
  // corp
  ctx.fillStyle = '#c8102e';
  ctx.beginPath(); ctx.ellipse(0, -34*u, 28*u, 28*u, 0, 0, 7); ctx.fill();
  ctx.fillRect(-18*u, -14*u, 36*u, 7*u);
  // centură
  ctx.fillStyle = '#1b1b1b'; ctx.fillRect(-27*u, -32*u, 54*u, 7*u);
  ctx.fillStyle = '#e8b923'; ctx.strokeStyle = '#e8b923'; ctx.lineWidth = 2*u; ctx.strokeRect(-5*u, -33*u, 10*u, 9*u);
  // cap
  ctx.fillStyle = '#f3c9a8'; ctx.beginPath(); ctx.arc(0, -68*u, 14*u, 0, 7); ctx.fill();
  // barbă
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.moveTo(-15*u, -68*u); ctx.quadraticCurveTo(-16*u, -44*u, 0, -40*u); ctx.quadraticCurveTo(16*u, -44*u, 15*u, -68*u);
  ctx.quadraticCurveTo(0, -58*u, -15*u, -68*u); ctx.fill();
  // ochi, nas
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-5*u, -71*u, 1.6*u, 0, 7); ctx.arc(5*u, -71*u, 1.6*u, 0, 7); ctx.fill();
  ctx.fillStyle = tipsy > .4 ? '#e8343a' : '#e88a7a'; ctx.beginPath(); ctx.arc(0, -66*u, (3 + tipsy * 1.5)*u, 0, 7); ctx.fill();
  if (tipsy > .6) { ctx.fillStyle = 'rgba(255,90,90,.45)'; ctx.beginPath(); ctx.arc(-8*u, -66*u, 3*u, 0, 7); ctx.arc(8*u, -66*u, 3*u, 0, 7); ctx.fill(); }
  // căciulă
  ctx.fillStyle = '#c8102e';
  ctx.beginPath(); ctx.moveTo(-14*u, -76*u); ctx.quadraticCurveTo(0, -102*u, 22*u, -92*u); ctx.lineTo(14*u, -76*u); ctx.fill();
  ctx.fillStyle = '#fff'; rr(-16*u, -80*u, 32*u, 7*u, 3*u); ctx.fill();
  ctx.beginPath(); ctx.arc(22*u, -92*u, 4.5*u, 0, 7); ctx.fill();
  // brațe + coșul ținut în față, deasupra burții
  ctx.strokeStyle = '#c8102e'; ctx.lineWidth = 9*u; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-22*u, -48*u); ctx.lineTo(-32*u, -46*u); ctx.moveTo(22*u, -48*u); ctx.lineTo(32*u, -46*u); ctx.stroke();
  const bw = Math.min(L.lw * 0.9, 80*u), by = -47*u;
  // coș (răchită)
  ctx.fillStyle = '#9a6a33';
  ctx.beginPath(); ctx.moveTo(-bw/2, by); ctx.lineTo(bw/2, by); ctx.lineTo(bw*.38, by + 18*u); ctx.lineTo(-bw*.38, by + 18*u); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#6e4720'; ctx.lineWidth = 1.2*u;
  for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-bw/2 + i*1.5*u, by + i*4.5*u); ctx.lineTo(bw/2 - i*1.5*u, by + i*4.5*u); ctx.stroke(); }
  for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i*bw/8, by); ctx.lineTo(i*bw/10, by + 18*u); ctx.stroke(); }
  ctx.fillStyle = '#c08a4a'; rr(-bw/2 - 2*u, by - 3*u, bw + 4*u, 5*u, 2*u); ctx.fill();
  // mănuși
  ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(-bw/2, by, 4.5*u, 0, 7); ctx.arc(bw/2, by, 4.5*u, 0, 7); ctx.fill();
  // sticle prinse vizibile în coș
  const n = Math.min(S.caught, 5);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = i % 3 === 2 ? '#2f8a4e' : '#7a3c0e';
    ctx.fillRect(-bw*.3 + i * bw*.14, by - 9*u, 4*u, 9*u);
    ctx.fillStyle = '#e8b923'; ctx.fillRect(-bw*.3 + i * bw*.14 + .5*u, by - 11*u, 3*u, 2*u);
  }
  ctx.restore();
}

// Bradul: (cx, top) = centru sus; h = înălțime totală; lvl = 0..10 podoabe
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function treeHW(y) { return Math.max(0, (y - 8) / 80 * 36); }      // jumătatea lățimii coroanei la înălțimea y
function treeSpots(seed, n, y0 = 20, y1 = 84) {                    // puncte fixe pe coroană
  const r = rng(seed), out = [];
  for (let i = 0; i < n; i++) { const y = y0 + (y1 - y0) * (i + r()) / n, w = treeHW(y) * .82; out.push([(r() * 2 - 1) * w, y]); }
  return out;
}
const SPOTS = { red: treeSpots(11, 10), gold: treeSpots(23, 10), cane: treeSpots(37, 7, 26, 80), bow: treeSpots(51, 8, 22, 82), flake: treeSpots(73, 9, 18, 84) };
function swag(y, k) { // linie care atârnă pe brad (pentru ghirlande și instalații), de la stânga la dreapta, ușor înclinată
  return x => y + x * .18 * k + 3.5 * Math.cos(x / 9 * Math.PI) ;
}

function drawTree(cx, top, h, lvl, t) {
  const u = h / 100;
  ctx.save(); ctx.translate(cx, top); ctx.scale(u, u);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const party = S.mode !== 'menu' && S.caught >= 20;
  const sway = party ? Math.sin(t * 3) * .8 : 0;

  // ghiveci + trunchi
  ctx.fillStyle = '#6b3f1f'; ctx.fillRect(-4.5, 84, 9, 10);
  ctx.fillStyle = '#9c2a1f'; ctx.beginPath(); ctx.moveTo(-11, 91); ctx.lineTo(11, 91); ctx.lineTo(8.5, 100); ctx.lineTo(-8.5, 100); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#b8402f'; ctx.fillRect(-12, 90, 24, 3);

  // coroana: 4 etaje cu margine ondulată
  const tiers = [[8, 34, 15], [20, 52, 22], [34, 70, 29], [48, 88, 36]];
  tiers.forEach(([a, b, w], k) => {
    const g = ctx.createLinearGradient(-w, 0, w, 0);
    g.addColorStop(0, '#14532d'); g.addColorStop(.5, '#1f7a3a'); g.addColorStop(1, '#14532d');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(sway * (1 - k * .2), a);
    ctx.lineTo(w, b);
    const n = 4 + k * 2;
    for (let i = n; i > 0; i--) { const x1 = -w + (i - 1) * 2 * w / n, x0 = -w + i * 2 * w / n; ctx.quadraticCurveTo((x0 + x1) / 2, b + 3, x1, b); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = .6; // ace
    for (let i = 0; i < 6 + k * 3; i++) { const yy = a + (b - a) * ((i * 37) % 100) / 100, ww = (yy - a) / (b - a) * w * .9, xx = ((i * 53) % 100) / 50 - 1;
      ctx.beginPath(); ctx.moveTo(xx * ww, yy); ctx.lineTo(xx * ww + 2, yy + 2); ctx.stroke(); }
  });
  // zăpadă pe vârfurile etajelor
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  tiers.forEach(([a, b, w]) => { ctx.beginPath(); ctx.ellipse(-w * .55, b - 1, 3, 1, -.3, 0, 7); ctx.ellipse(w * .5, b - 1.2, 2.5, .9, .3, 0, 7); ctx.fill(); });

  // 1. ghirlandă aurie
  if (lvl >= 1) {
    ctx.strokeStyle = '#e8b923'; ctx.lineWidth = 1.6;
    [[30, 1], [46, -1], [62, 1], [78, -1]].forEach(([y, k]) => {
      const f = swag(y, k), w = treeHW(y + 2) * .95; ctx.beginPath();
      for (let x = -w; x <= w; x += 1) ctx.lineTo(x, f(x)); ctx.stroke();
    });
    ctx.strokeStyle = 'rgba(255,240,170,.6)'; ctx.lineWidth = .5;
    [[30, 1], [46, -1], [62, 1], [78, -1]].forEach(([y, k]) => {
      const f = swag(y, k), w = treeHW(y + 2) * .95;
      for (let x = -w; x <= w; x += 2) { ctx.beginPath(); ctx.moveTo(x, f(x) - .8); ctx.lineTo(x + .6, f(x) + .8); ctx.stroke(); }
    });
  }
  // 4. instalație cu lumini calde (firul + becuri)
  const warm = [[24, -1], [40, 1], [56, -1], [72, 1], [84, -1]];
  if (lvl >= 4) {
    ctx.strokeStyle = 'rgba(30,30,30,.6)'; ctx.lineWidth = .4;
    warm.forEach(([y, k]) => { const f = swag(y, k), w = treeHW(y + 2) * .92; ctx.beginPath(); for (let x = -w; x <= w; x += 1) ctx.lineTo(x, f(x)); ctx.stroke(); });
    warm.forEach(([y, k], j) => { const f = swag(y, k), w = treeHW(y + 2) * .92;
      for (let x = -w + 2, i = 0; x <= w; x += 4.5, i++) { const on = .55 + .45 * Math.sin(t * 2.5 + i * 1.3 + j);
        ctx.fillStyle = `rgba(255,220,140,${.25 * on})`; ctx.beginPath(); ctx.arc(x, f(x) + 1, 2.4, 0, 7); ctx.fill();
        ctx.fillStyle = `rgba(255,236,180,${.6 + .4 * on})`; ctx.beginPath(); ctx.arc(x, f(x) + 1, .9, 0, 7); ctx.fill(); } });
  }
  // 2–3. globuri
  const ball = (x, y, c1, c2, r) => {
    ctx.strokeStyle = '#bbb'; ctx.lineWidth = .3; ctx.beginPath(); ctx.moveTo(x, y - r - 1.5); ctx.lineTo(x, y - r); ctx.stroke();
    const g = ctx.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r); g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#c9a227'; ctx.fillRect(x - .8, y - r - .8, 1.6, 1.2);
  };
  if (lvl >= 2) SPOTS.red.forEach(([x, y]) => ball(x, y, '#ff7a7a', '#a3122a', 2.4));
  if (lvl >= 3) SPOTS.gold.forEach(([x, y], i) => i % 2 ? ball(x, y, '#ffffff', '#8c96a6', 2.1) : ball(x, y, '#fff2b0', '#b8860b', 2.3));
  // 5. bastonașe de bomboane
  if (lvl >= 5) SPOTS.cane.forEach(([x, y]) => {
    ctx.lineWidth = 1.3;
    const path = () => { ctx.beginPath(); ctx.moveTo(x, y + 5); ctx.lineTo(x, y); ctx.arc(x + 1.5, y, 1.5, Math.PI, 0); };
    ctx.strokeStyle = '#fff'; path(); ctx.stroke();
    ctx.strokeStyle = '#d0102a'; ctx.setLineDash([1, 1]); path(); ctx.stroke(); ctx.setLineDash([]);
  });
  // 7. fundițe roșii
  if (lvl >= 7) SPOTS.bow.forEach(([x, y]) => {
    ctx.fillStyle = '#d0102a';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y - 1.8); ctx.lineTo(x - 3, y + 1.8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 3, y - 1.8); ctx.lineTo(x + 3, y + 1.8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - .5, y); ctx.lineTo(x - 1.6, y + 3.5); ctx.moveTo(x + .5, y); ctx.lineTo(x + 1.6, y + 3.5);
    ctx.strokeStyle = '#d0102a'; ctx.lineWidth = .7; ctx.stroke();
    ctx.fillStyle = '#8a0a1c'; ctx.beginPath(); ctx.arc(x, y, .8, 0, 7); ctx.fill();
  });
  // 8. fulgi argintii și beteală (țurțuri)
  if (lvl >= 8) {
    SPOTS.flake.forEach(([x, y], i) => {
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * .5 + i);
      ctx.strokeStyle = '#e6eef8'; ctx.lineWidth = .5;
      for (let k = 0; k < 3; k++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.moveTo(-2.4, 0); ctx.lineTo(2.4, 0); ctx.stroke(); }
      ctx.restore();
    });
    ctx.strokeStyle = 'rgba(220,230,245,.85)'; ctx.lineWidth = .4;
    tiers.forEach(([a, b, w]) => { for (let x = -w + 2; x < w - 1; x += 2.2) { const l = 2 + ((x * 7) % 3 + 3) % 3; ctx.beginPath(); ctx.moveTo(x, b + .5); ctx.lineTo(x + .2, b + l + .5); ctx.stroke(); } });
  }
  // 6. instalație colorată care clipește (aleargă)
  if (lvl >= 6) {
    const cols = ['#ff4d4d', '#ffd54a', '#4dc3ff', '#7dff8a', '#ff7ae0'];
    [[32, -1], [48, 1], [64, -1], [80, 1]].forEach(([y, k], j) => { const f = swag(y + 3, k), w = treeHW(y + 5) * .9;
      for (let x = -w + 1.5, i = 0; x <= w; x += 4, i++) { const on = Math.sin(t * 6 - i * .9 + j) > 0;
        const c = cols[(i + j) % cols.length];
        if (on) { ctx.globalAlpha = .35; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, f(x) + 1, 2.6, 0, 7); ctx.fill(); }
        ctx.globalAlpha = on ? 1 : .35; ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, f(x) + 1.2, .9, 1.3, 0, 0, 7); ctx.fill(); }
    });
    ctx.globalAlpha = 1;
  }
  // 9. cadouri sub brad
  if (lvl >= 9) {
    const gift = (x, w, hh, c, rib) => {
      ctx.fillStyle = c; ctx.fillRect(x - w / 2, 100 - hh, w, hh);
      ctx.fillStyle = rib; ctx.fillRect(x - .8, 100 - hh, 1.6, hh); ctx.fillRect(x - w / 2, 100 - hh * .6, w, 1.4);
      ctx.beginPath(); ctx.ellipse(x - 1.6, 100 - hh - .8, 1.8, 1, -.4, 0, 7); ctx.ellipse(x + 1.6, 100 - hh - .8, 1.8, 1, .4, 0, 7); ctx.fill();
    };
    gift(-22, 12, 9, '#2a6fd6', '#ffd54a'); gift(-31, 8, 6, '#d0102a', '#fff');
    gift(21, 13, 8, '#7a3fc8', '#ffd54a'); gift(31, 8, 11, '#1f9e5a', '#d0102a'); gift(13, 7, 5, '#ffd54a', '#d0102a');
  }
  // 10. steaua din vârf
  if (lvl >= 10) {
    ctx.save(); ctx.translate(sway, 5);
    ctx.rotate(t * .4);
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 14); glow.addColorStop(0, 'rgba(255,230,120,.7)'); glow.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill();
    ctx.restore(); ctx.save(); ctx.translate(sway, 5);
    ctx.fillStyle = '#ffd54a'; ctx.strokeStyle = '#c9a227'; ctx.lineWidth = .5;
    ctx.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 2.6 : 6, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // sclipici în jurul bradului la petrecere (din 20 de sticle)
  if (party) for (let i = 0; i < 8; i++) {
    const a = t * 1.5 + i * .785, x = Math.cos(a) * (20 + 18 * Math.sin(i)), y = 50 + Math.sin(a * 1.3) * 38, s = .6 + .6 * Math.abs(Math.sin(t * 4 + i));
    ctx.fillStyle = 'rgba(255,250,210,.9)'; ctx.beginPath(); ctx.moveTo(x, y - s * 2); ctx.lineTo(x + s * .5, y); ctx.lineTo(x, y + s * 2); ctx.lineTo(x - s * .5, y); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - s * 2, y); ctx.lineTo(x, y + s * .5); ctx.lineTo(x + s * 2, y); ctx.lineTo(x, y - s * .5); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawPanel() {
  const { px, py, pw, ph, land } = L;
  // fundal panou: cameră cu brad și șemineu stilizat
  const g = ctx.createLinearGradient(px, py, px, py + ph);
  g.addColorStop(0, '#3a1f2c'); g.addColorStop(1, '#5b2e2a');
  ctx.fillStyle = g; ctx.fillRect(px, py, pw, ph);
  ctx.fillStyle = 'rgba(255,207,90,.08)'; ctx.fillRect(px, py + ph * .82, pw, ph * .18);
  if (S.mode !== 'menu' && stage(30)) { // spoturi disco în cameră
    for (let i = 0; i < 3; i++) {
      const a = S.t * (1.2 + i * .3) + i * 2, sx = px + pw * (.5 + .4 * Math.sin(a)), sy = py + ph * (.55 + .25 * Math.cos(a * 1.3));
      const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, pw * .3);
      gr.addColorStop(0, `hsla(${(S.t * 80 + i * 120) % 360},90%,60%,.28)`); gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gr; ctx.fillRect(px, py, pw, ph);
    }
    // glob disco
    const gx = px + pw * .5, gy = py + 26, gr2 = Math.min(14, pw * .04);
    ctx.strokeStyle = '#999'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(gx, py); ctx.lineTo(gx, gy - gr2); ctx.stroke();
    ctx.fillStyle = '#cfd6e0'; ctx.beginPath(); ctx.arc(gx, gy, gr2, 0, 7); ctx.fill();
    for (let i = 0; i < 8; i++) { ctx.fillStyle = `hsla(${(S.t * 200 + i * 45) % 360},90%,75%,.9)`; ctx.fillRect(gx - gr2 * .7 + (i % 4) * gr2 * .4, gy - gr2 * .5 + Math.floor(i / 4) * gr2 * .5, gr2 * .3, gr2 * .3); }
  }
  // ghirlandă de beculețe
  for (let i = 0; i < 14; i++) {
    const lx = px + (i + .5) * pw / 14, ly = py + 10 + Math.sin(i * 1.3) * 4;
    const on = Math.sin(S.t * 3 + i) > 0;
    ctx.fillStyle = ['#ff5a4f', '#ffd54a', '#5ad1ff', '#7dff8a'][i % 4];
    ctx.globalAlpha = on ? 1 : .35; ctx.beginPath(); ctx.arc(lx, ly, 3.2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // bradul
  let mh, mx, my;
  if (land) { mh = Math.min(ph * .62, pw * .95); mx = px + pw * .5; my = py + ph * .2; }
  else { mh = ph * .84; mx = px + pw * .27; my = py + ph * .1; }
  // lumină care pulsează când se adaugă o podoabă
  if (S.flash > 0) {
    ctx.fillStyle = `rgba(255,230,150,${S.flash * .35})`;
    ctx.beginPath(); ctx.ellipse(mx, my + mh * .55, mh * .35, mh * .55, 0, 0, 7); ctx.fill();
  }
  drawTree(mx, my, mh, S.outfit, S.t);

  // text + bara de niveluri
  const name = 'Nivel ' + S.outfit + '/' + MAXO + ': ' + LEVELS[S.outfit].name;
  ctx.fillStyle = '#fff8ec'; ctx.textBaseline = 'alphabetic';
  if (land) {
    ctx.textAlign = 'center';
    ctx.font = `700 ${Math.round(Math.min(18, pw / 16))}px system-ui`;
    ctx.fillText('Bradul de Crăciun', px + pw / 2, py + ph * .1);
    ctx.font = `${Math.round(Math.min(15, pw / 20))}px system-ui`; ctx.fillStyle = '#ffd98a';
    wrap(name, px + pw / 2, py + ph * .86, pw * .9, Math.min(18, pw / 17));
    drawWardrobe(px + pw * .1, py + ph * .93, pw * .8);
  } else {
    ctx.textAlign = 'left';
    const tx2 = px + pw * .56, fs = Math.round(Math.min(16, pw / 26));
    ctx.font = `700 ${fs + 2}px system-ui`; ctx.fillText('Bradul de Crăciun', tx2, py + ph * .3);
    ctx.font = `${fs}px system-ui`; ctx.fillStyle = '#ffd98a';
    wrap(name, tx2, py + ph * .3 + fs * 1.6, pw * .42, fs * 1.25, 'left');
    drawWardrobe(tx2, py + ph * .78, pw * .4);
  }
}

function wrap(txt, x, y, maxW, lh, align = 'center') {
  ctx.textAlign = align;
  const words = txt.split(' '); let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += lh; } else line = test;
  }
  ctx.fillText(line, x, yy);
}

function drawWardrobe(x, y, w) {
  const n = LEVELS.length, gap = 3, bw = (w - gap * (n - 1)) / n;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = i <= S.outfit ? (i === MAXO ? '#ffd54a' : '#ff8a6a') : 'rgba(255,255,255,.15)';
    rr(x + i * (bw + gap), y, bw, 7, 3); ctx.fill();
  }
}

function drawHud() {
  const fs = Math.round(Math.min(20, L.fw / 22));
  ctx.textBaseline = 'top';
  ctx.font = `800 ${fs}px system-ui`; ctx.fillStyle = '#fff8ec'; ctx.textAlign = 'center';
  ctx.fillText(S.score, L.fx + L.fw / 2, L.fy + 10);
  ctx.font = `${Math.round(fs * .65)}px system-ui`; ctx.fillStyle = '#aab3c8';
  ctx.fillText('record ' + Math.max(S.best, S.score) + (S.streak > 2 ? ' · serie ' + S.streak : ''), L.fx + L.fw / 2, L.fy + 12 + fs);
  // vieți = brăduți
  ctx.textAlign = 'right'; ctx.font = `${Math.round(fs * .9)}px system-ui`;
  let lv = ''; for (let i = 0; i < 5; i++) lv += i < S.lives ? '🎄' : '·';
  ctx.fillText(lv, L.fx + L.fw - 10, L.fy + (L.land ? 40 : 10));
  // mesaj
  if (S.msgT > 0) {
    ctx.globalAlpha = Math.min(1, S.msgT * 2);
    ctx.font = `700 ${Math.round(fs * .95)}px system-ui`; ctx.textAlign = 'center';
    const mw = Math.min(L.fw - 20, ctx.measureText(S.msg).width + 26);
    ctx.fillStyle = 'rgba(10,18,40,.7)'; rr(L.fx + L.fw / 2 - mw / 2, L.fy + L.fh * .38, mw, fs * 1.8, 10); ctx.fill();
    ctx.fillStyle = '#ffd98a'; ctx.save(); ctx.beginPath(); ctx.rect(L.fx + L.fw / 2 - mw / 2, L.fy, mw, L.fh); ctx.clip();
    ctx.fillText(S.msg, L.fx + L.fw / 2, L.fy + L.fh * .38 + fs * .42); ctx.restore();
    ctx.globalAlpha = 1;
  }
}

// ---------- buclă ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  S.t += dt;
  for (const f of snow) { f.y += f.s * dt; if (f.y > H) { f.y = -4; f.x = Math.random() * W; } }
  if (S.mode === 'play') step(dt);
  else if (S.mode === 'menu') { S.sx += (Math.round(2 + 2 * Math.sin(S.t * .8)) - S.sx) * Math.min(1, dt * 6); }
  S.flash = Math.max(0, S.flash - dt * 2);
  if (S.sleigh) { S.sleigh += dt / 4.5; if (S.sleigh >= 1) S.sleigh = 0; }
  if (S.mode === 'play' && stage(100)) { S.fw -= dt; if (S.fw <= 0) { fireworks(); S.fw = 0.9 + Math.random() * 1.2; } }
  S.msgT = Math.max(0, S.msgT - dt);
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
  S.parts = S.parts.filter(p => p.life > 0);

  drawBg();
  for (const b of S.bottles) drawBottle(b);
  drawSanta();
  for (const p of S.parts) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c;
    if (p.shard) ctx.fillRect(p.x, p.y, p.r * 1.6, p.r); else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); } }
  ctx.globalAlpha = 1;
  drawPanel();
  if (S.mode !== 'menu') drawHud();
  requestAnimationFrame(frame);
}

function step(dt) {
  // Moșul alunecă spre coloana țintă
  const d = S.lane - S.sx;
  S.sx += Math.sign(d) * Math.min(Math.abs(d), dt * 12);
  S.spawnT -= dt;
  if (S.spawnT <= 0) { spawn(); S.spawnT = gap() * (0.8 + Math.random() * 0.4); }
  const v = speed();
  for (const b of S.bottles) {
    b.y += v * dt; b.rot += b.vr * dt;
    const bottom = b.y + L.bh;
    if (!b.done && bottom >= L.catchY && bottom <= L.catchY + L.bh * 0.5) {
      if (Math.abs(S.sx - b.lane) < (b.kind === 'coal' ? 0.3 : 0.55)) { b.done = 'caught'; catchBottle(b); }
    }
    if (!b.done && bottom >= L.groundY) { b.done = 'miss'; missBottle(b); }
    if (S.mode !== 'play') break;
  }
  S.bottles = S.bottles.filter(b => !b.done);
}

layout();
menu();
requestAnimationFrame(frame);
window.__cx = { S, LEVELS, reset, step, L: () => L };
</script>
