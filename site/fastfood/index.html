<!DOCTYPE html>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd0f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  .chip { background: rgba(28, 22, 16, .62); border-radius: 12px; padding: 7px 12px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #hud { position: fixed; left: 12px; top: calc(12px + var(--gb, 0px)); display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; z-index: 5; max-width: calc(100vw - 120px); }
  #hud .chip { font-weight: 800; font-size: 17px; }
  #stars { color: #ffcf3a; letter-spacing: 1px; }
  #clock.closing { background: rgba(190, 70, 30, .85); }
  #btns { position: fixed; right: 12px; top: calc(12px + var(--gb, 0px)); display: flex; gap: 6px; z-index: 5; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; }
  .ib { width: 40px; height: 40px; font-size: 19px; background: rgba(28, 22, 16, .62); color: #fff; }
  .ib:hover { background: rgba(28, 22, 16, .85); }
  #trash { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 9px 16px; background: rgba(28, 22, 16, .7); color: #fff; font-weight: 700; font-size: 15px; z-index: 5; display: none; }
  #trash:hover { background: rgba(160, 40, 30, .9); }
  body.playing #trash { display: block; }
  #layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
  .lbl { position: absolute; transform: translate(-50%, 0); font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: rgba(28, 22, 16, .62); white-space: nowrap; }
  .lbl kbd { font: inherit; background: rgba(255,255,255,.22); padding: 0 5px; border-radius: 4px; margin-right: 3px; }
  .lbl.lock { background: rgba(60, 60, 60, .75); color: #ccc; }
  body.touch .lbl kbd { display: none; }
  .bar { position: absolute; width: 38px; height: 7px; margin-left: -19px; border-radius: 4px; background: rgba(0,0,0,.55); overflow: hidden; display: none; }
  .bar i { display: block; height: 100%; width: 0; background: #ffa53a; }
  .bar.ready i { background: #3fcf4f; }
  .bar.warn i { background: #e8392a; }
  .tag { position: absolute; transform: translate(-50%, -100%); font-size: 18px; display: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .bub { position: absolute; transform: translate(-50%, -100%); background: #fffdf6; color: #2a2118; border-radius: 14px; padding: 6px 9px 7px; box-shadow: 0 4px 14px rgba(0,0,0,.35); pointer-events: auto; cursor: pointer; text-align: center; min-width: 64px; }
  .bub::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #fffdf6; }
  .bub:hover { box-shadow: 0 0 0 3px #ffcf3a, 0 4px 14px rgba(0,0,0,.35); }
  .bub .it { font-size: 24px; line-height: 1.1; white-space: nowrap; }
  .bub .it span { display: inline-block; position: relative; margin: 0 1px; }
  .bub .it span.got { opacity: .35; }
  .bub .it span.got::after { content: "✓"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #1d9a2c; font-size: 22px; font-weight: 900; opacity: 1; }
  .bub .pt { height: 6px; border-radius: 3px; background: #e6dccb; overflow: hidden; margin-top: 4px; }
  .bub .pt i { display: block; height: 100%; background: #3fbf4f; }
  .bub .k { position: absolute; left: -8px; top: -8px; width: 20px; height: 20px; border-radius: 50%; background: #2a2118; color: #fff; font-size: 11px; font-weight: 800; line-height: 20px; }
  body.touch .bub .k { display: none; }
  .bub.mood { min-width: 0; padding: 4px 8px; font-size: 26px; pointer-events: none; }
  .float { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 22px; color: #ffe14d; text-shadow: 0 2px 4px rgba(0,0,0,.7); transition: transform 1.2s ease-out, opacity 1.2s; white-space: nowrap; }
  .float.bad { color: #ff6a5a; }
  #toast { position: fixed; left: 50%; top: calc(64px + var(--gb, 0px)); transform: translateX(-50%); font-size: 18px; font-weight: 800; text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s; max-width: calc(100vw - 32px); z-index: 6; }
  #toast.show { opacity: 1; }
  #toast.good { background: rgba(40, 130, 50, .9); }
  #toast.bad { background: rgba(190, 40, 30, .9); }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: calc(16px + var(--gb, 0px)) 16px 16px; background: rgba(20, 14, 8, .45); z-index: 20; }
  #overlay.show { display: flex; }
  .panel { background: #fff8ea; color: #33291c; border-radius: 22px; padding: 22px 24px; width: min(600px, 100%); max-height: calc(100vh - 32px - var(--gb, 0px)); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .panel h1 { margin: 0 0 6px; font-size: 32px; color: #d4421e; text-align: center; }
  .panel h2 { margin: 0 0 8px; font-size: 26px; color: #2f6b2c; text-align: center; }
  .panel p { margin: 8px 0; line-height: 1.45; }
  .panel ul { margin: 6px 0 10px; padding-left: 20px; line-height: 1.55; }
  .panel kbd { background: #eadfca; border-radius: 5px; padding: 1px 6px; font: inherit; font-weight: 700; font-size: 13px; }
  .menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin: 10px 0; }
  .menu div { background: #f3e7cf; border-radius: 10px; padding: 6px 10px; font-weight: 700; }
  .menu div.off { opacity: .45; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
  .stats div { background: #f3e7cf; border-radius: 10px; padding: 8px 10px; }
  .stats b { display: block; font-size: 22px; }
  .shop { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
  .shop button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 12px; background: #f3e7cf; color: #33291c; }
  .shop button:hover:not(:disabled) { background: #ffe2a6; }
  .shop button:disabled { opacity: .5; cursor: default; }
  .shop button .ic { font-size: 26px; }
  .shop button .tx { flex: 1; }
  .shop button .tx small { display: block; font-weight: 400; opacity: .8; }
  .shop button .pr { font-weight: 800; white-space: nowrap; }
  .go { display: block; margin: 14px auto 2px; padding: 12px 30px; font-size: 20px; font-weight: 800; background: #d4421e; color: #fff; box-shadow: 0 4px 0 #8c2a10; }
  .go:active { transform: translateY(3px); box-shadow: 0 1px 0 #8c2a10; }
  @media (max-width: 520px) { .panel { padding: 16px; } .panel h1 { font-size: 26px; } #hud .chip { font-size: 14px; padding: 5px 9px; } .bub .it { font-size: 19px; } }

<body>
<script src="/games/topbar.js"></script>

</div>

<div id="overlay" class="show"><div class="panel" id="panel"><h1>🍔 Fastfood Owner</h1><p style="text-align:center">Se încarcă orașul…</p></div></div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = THREE.MathUtils.clamp;
const lerp = THREE.MathUtils.lerp;
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');
const rr = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const SAVE = 'fastfood3d';

// ---------------- meniu ----------------
// cook = secunde până e gata, burn = secunde până se arde (Infinity = nu se arde)
const FOOD = {
  drink:   { name: 'Suc',      icon: '🥤', price: 5,  st: 'drink',   cook: 2.2, burn: Infinity, day: 1, waste: 1 },
  fries:   { name: 'Cartofi',  icon: '🍟', price: 8,  st: 'fryer',   cook: 5,   burn: 13,       day: 1, waste: 2 },
  burger:  { name: 'Burger',   icon: '🍔', price: 15, st: 'grill',   cook: 6,   burn: 14,       day: 1, waste: 4 },
  hotdog:  { name: 'Hot dog',  icon: '🌭', price: 10, st: 'hotdog',  cook: 4.5, burn: 12,       day: 2, waste: 3 },
  shaorma: { name: 'Shaorma',  icon: '🌯', price: 20, st: 'shaorma', cook: 5.5, burn: Infinity, day: 3, waste: 0 },
};
const ORDER = ['drink', 'fries', 'burger', 'hotdog', 'shaorma'];
const UPG = [
  { id: 'grill4',  ic: '🔥', name: 'Al 4-lea loc pe grătar',     desc: 'Poți face 4 burgeri deodată.', price: 60 },
  { id: 'fryer2',  ic: '🍟', name: 'Al doilea coș la friteuză',  desc: 'Prăjești două porții de cartofi deodată.', price: 50 },
  { id: 'fastsoda', ic: '🥤', name: 'Automat de suc rapid',       desc: 'Paharul se umple de două ori mai repede.', price: 40 },
  { id: 'tray8',   ic: '🍽️', name: 'Tavă mai mare',              desc: '8 locuri pe tavă în loc de 6.', price: 45 },
  { id: 'music',   ic: '🎵', name: 'Boxă cu muzică',             desc: 'Clienții așteaptă cu 25% mai mult.', price: 80 },
  { id: 'neon',    ic: '💡', name: 'Firmă cu neon',              desc: 'Bacșișuri cu 50% mai mari.', price: 90 },
];

// ---------------- stare ----------------
const S = {
  mode: 'menu', // menu | intro | open | closing | summary | over
  paused: false, day: 1, money: 0, rep: 5, t: 0, dayLen: 150,
  up: {}, tray: [], spawnT: 2,
  dayStats: null, total: { served: 0, angry: 0, earned: 0 },
  sound: true,
};
let best = 0;
try { best = +(localStorage.getItem(SAVE + '.best') || 0); S.sound = localStorage.getItem(SAVE + '.snd') !== '0'; } catch (e) {}
const trayCap = () => S.up.tray8 ? 8 : 6;
const unlocked = k => S.day >= FOOD[k].day;

// ---------------- scenă ----------------
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const SKY = 0x9fd0f0;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 40, 120);
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.05, 300);
scene.add(new THREE.HemisphereLight(0xe8f4ff, 0x8a7a60, 1.6));
const sun = new THREE.DirectionalLight(0xfff0d6, 2.4);
sun.position.set(14, 26, 12); sun.target.position.set(0, 0, -4);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 22, bottom: -22, near: 1, far: 90 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const matCache = {};
function M(c, o) {
  const key = c + (o ? JSON.stringify(o) : '');
  return matCache[key] || (matCache[key] = new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.8 }, o)));
}
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  parent.add(m);
  return m;
}
const box = (w, h, d, mat, x, y, z, p, sh) => mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, p, sh);
const cyl = (rt, rb, h, mat, x, y, z, p, seg = 16, sh) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, p, sh);
function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(rep[0], rep[1]);
  t.anisotropy = 4;
  return t;
}

// ---------------- orașul ----------------
// rulota stă pe o piațetă; în fața ei trotuarul (z -5..4), apoi strada (z -5..-12), trotuarul de vizavi și blocurile.
const texTiles = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#c9c3b8'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#a9a398'; g.lineWidth = 3;
  for (let i = 0; i <= 2; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke(); g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); }
  for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
}, [40, 6]);
const texRoad = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#45474b'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * 0.06})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
}, [20, 2]);
const ground = mesh(new THREE.PlaneGeometry(220, 160), M(0x7c9a52), 0, -0.02, 0, scene); ground.rotation.x = -Math.PI / 2; ground.castShadow = false;
const side1 = mesh(new THREE.PlaneGeometry(120, 10), new THREE.MeshStandardMaterial({ map: texTiles, roughness: 0.9 }), 0, 0.005, -0.5); side1.rotation.x = -Math.PI / 2; side1.castShadow = false;
const road = mesh(new THREE.PlaneGeometry(120, 7), new THREE.MeshStandardMaterial({ map: texRoad, roughness: 0.95 }), 0, 0.0, -8.5); road.rotation.x = -Math.PI / 2; road.castShadow = false;
const texTiles2 = texTiles.clone(); texTiles2.repeat.set(40, 2); texTiles2.needsUpdate = true;
const side2 = mesh(new THREE.PlaneGeometry(120, 4), new THREE.MeshStandardMaterial({ map: texTiles2, roughness: 0.9 }), 0, 0.005, -14); side2.rotation.x = -Math.PI / 2; side2.castShadow = false;
box(120, 0.14, 0.25, M(0xb8b2a6), 0, 0.07, -5.1);
box(120, 0.14, 0.25, M(0xb8b2a6), 0, 0.07, -11.9);
for (let x = -58; x < 60; x += 4) { const d = box(2, 0.01, 0.16, M(0xf2efe6), x, 0.012, -8.5, scene, false); d.receiveShadow = true; }
// trecere de pietoni
for (let i = 0; i < 7; i++) box(0.5, 0.01, 6.4, M(0xf2efe6), -12 + i * 0.9, 0.013, -8.5, scene, false);

// blocuri
function facadeTex(base, win) {
  return canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(0, h - 6, w, 6);
    for (let i = 0; i < 2; i++) {
      const x = 14 + i * 64;
      g.fillStyle = '#f4f1ea'; g.fillRect(x - 4, 26, 44, 64);
      g.fillStyle = win; g.fillRect(x, 30, 36, 56);
      g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x, 30, 12, 56);
      g.fillStyle = '#f4f1ea'; g.fillRect(x + 16, 30, 4, 56);
    }
  });
}
const FACADES = ['#e9b47a', '#d98b78', '#f1d9a8', '#a9c7c9', '#c7b3d6', '#e7e1d2', '#b8c99a', '#f0c3a0'];
const SHOPS = [['PIZZA', '#c0392b'], ['FARMACIE', '#1e8f4e'], ['FLORĂRIE', '#d35b9a'], ['BRUTĂRIE', '#a8642a'], ['CAFENEA', '#5b3a29'], ['ALIMENTARA', '#2d6db5'], ['FRIZERIE', '#7a4fb0'], ['BANCA', '#24506e']];
function shopSign(txt, col) {
  return canvasTex(256, 48, (g, w, h) => {
    g.fillStyle = col; g.fillRect(0, 0, w, h);
    g.fillStyle = '#fff'; g.font = 'bold 30px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, w / 2, h / 2 + 2);
  });
}
let bx = -52, bi = 0;
while (bx < 52) {
  const w = rr(7, 11), hgt = [9, 12, 15, 18, 21][Math.floor(Math.random() * 5)], d = 9;
  const t = facadeTex(FACADES[bi % FACADES.length], '#5d7a91');
  t.repeat.set(Math.round(w / 3.6), Math.round(hgt / 3));
  const b = box(w - 0.3, hgt, d, new THREE.MeshStandardMaterial({ map: t, roughness: 0.85 }), bx + w / 2, hgt / 2, -16 - d / 2);
  b.castShadow = false;
  box(w - 0.1, 0.4, d + 0.2, M(0x8d8577), bx + w / 2, hgt + 0.2, -16 - d / 2);
  // parter cu magazin
  const sh = SHOPS[bi % SHOPS.length];
  box(w - 0.4, 3, 0.1, M(0x2e3a44, { roughness: 0.3, metalness: 0.4 }), bx + w / 2, 1.5, -15.98, scene, false);
  const sg = box(w - 0.6, 0.7, 0.12, new THREE.MeshStandardMaterial({ map: shopSign(sh[0], sh[1]) }), bx + w / 2, 3.4, -15.9, scene, false);
  const aw = box(w - 0.6, 0.08, 1.2, M(sh[1]), bx + w / 2, 2.9, -15.4); aw.rotation.x = -0.25;
  bx += w; bi++;
}
// copaci și stâlpi
function tree(x, z, s = 1) {
  cyl(0.12 * s, 0.16 * s, 2.2 * s, M(0x6b4a2e), x, 1.1 * s, z, scene, 8);
  const c = mesh(new THREE.SphereGeometry(1.3 * s, 10, 8), M(pick([0x4f8a3a, 0x5b9a40, 0x467d34])), x, 3 * s, z); c.scale.y = 1.15;
}
for (let x = -50; x <= 50; x += 11) tree(x + rr(-1, 1), -13.2, rr(0.9, 1.15));
for (const x of [-16, -9, 9, 16, 24, -24]) tree(x, 3.5 + rr(-0.5, 1), rr(0.9, 1.2));
for (let i = 0; i < 14; i++) tree(rr(-40, 40), rr(8, 30), rr(0.9, 1.4));
function lamp(x, z) {
  cyl(0.06, 0.08, 4.6, M(0x2f3438, { metalness: 0.5, roughness: 0.4 }), x, 2.3, z, scene, 8);
  box(0.9, 0.08, 0.1, M(0x2f3438), x, 4.55, z - 0.4).rotation.y = Math.PI / 2;
  box(0.3, 0.12, 0.45, M(0xfff3c8, { emissive: 0x554422 }), x, 4.48, z - 0.8);
}
for (const x of [-20, -8, 8, 20]) lamp(x, -4.8);
// bănci și coș de gunoi lângă rulotă
function bench(x, z, ry) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  box(1.6, 0.06, 0.45, M(0x9a6a3c), 0, 0.45, 0, g); box(1.6, 0.4, 0.06, M(0x9a6a3c), 0, 0.72, 0.22, g);
  box(0.06, 0.45, 0.4, M(0x333333), -0.7, 0.22, 0, g); box(0.06, 0.45, 0.4, M(0x333333), 0.7, 0.22, 0, g);
}
bench(-6.5, -1.2, 0.3); bench(6.8, 0.2, -0.4);
cyl(0.25, 0.22, 0.8, M(0x3c6e3a), -4.6, 0.4, -0.6, scene, 12);

// ---------------- mașini ----------------
const CARS = [];
const CAR_COL = [0xd23a2a, 0x2f6fd8, 0xf2f2f2, 0x222428, 0xf0b81c, 0x3c9a52, 0x8a8f96];
function makeCar() {
  const g = new THREE.Group(); scene.add(g);
  const col = pick(CAR_COL);
  box(3.8, 0.7, 1.7, M(col, { roughness: 0.4, metalness: 0.3 }), 0, 0.65, 0, g);
  box(2.1, 0.6, 1.5, M(col, { roughness: 0.4, metalness: 0.3 }), -0.2, 1.28, 0, g);
  box(2.15, 0.45, 1.52, M(0x22303a, { roughness: 0.2, metalness: 0.5 }), -0.2, 1.3, 0, g, false);
  for (const [wx, wz] of [[1.2, 0.8], [-1.2, 0.8], [1.2, -0.8], [-1.2, -0.8]]) {
    const w = cyl(0.33, 0.33, 0.25, M(0x1a1a1a), wx, 0.33, wz, g, 12); w.rotation.x = Math.PI / 2;
  }
  box(0.05, 0.16, 0.4, M(0xfffbe0, { emissive: 0x888866 }), 1.9, 0.75, 0.55, g, false);
  box(0.05, 0.16, 0.4, M(0xfffbe0, { emissive: 0x888866 }), 1.9, 0.75, -0.55, g, false);

  const a = innerWidth / innerHeight;
  // camera stă în spatele tejghelei, puțin în afara rulotei (peretele din spate lipsește).
  // Pe ecrane înguste (telefon ținut vertical) nu încape toată tejgheaua: atunci se trage stânga-dreapta.
  const fov = a < 1 ? 62 : 54;
  const t = Math.tan(THREE.MathUtils.degToRad(fov / 2)) * a; // tan(jumătate din unghiul orizontal)
  const need = 3.35, minD = 3.3, maxD = 3.9; // distanța de la tejghea
  const d = clamp(need / t, minD, maxD);
  panMax = Math.max(0, need - d * t);
  panX = clamp(panX, -panMax, panMax);
  CAM_IN.fov = fov;
  CAM_IN.pos.set(panX, 3.32, CT_Z + d);
  CAM_IN.look.set(panX, 1.45, -0.7);
  document.body.classList.toggle('narrow', panMax > 0.05);
}
const CAM_OUT = { pos: new THREE.Vector3(7.5, 3.6, -11.5), look: new THREE.Vector3(0, 2.1, 0), fov: 50 };
let camT = 0;
function placeCamera(dt) {
  if (S.mode === 'menu') {
    const a = performance.now() / 9000;
    camera.position.set(Math.sin(a) * 4 + 4, 3.4, -11.5);
    camera.lookAt(0, 2.1, 0); camera.fov = 50;
  } else if (S.mode === 'intro') {
    camT = Math.min(1, camT + dt / 2.2);
    const e = camT < 0.5 ? 2 * camT * camT : 1 - (-2 * camT + 2) ** 2 / 2;
    camera.position.lerpVectors(CAM_OUT.pos, CAM_IN.pos, e);
    // trece pe deasupra rulotei ca să nu treacă prin pereți
    camera.position.y += Math.sin(e * Math.PI) * 2.4;
    const lk = new THREE.Vector3().lerpVectors(CAM_OUT.look, CAM_IN.look, e);
    camera.lookAt(lk); camera.fov = lerp(CAM_OUT.fov, CAM_IN.fov, e);
    if (camT >= 1) openDay();
  } else {
    camera.position.copy(CAM_IN.pos); camera.lookAt(CAM_IN.look); camera.fov = CAM_IN.fov;
  }
  camera.updateProjectionMatrix();
}

// ---------------- zile ----------------
function newDayStats() { return { served: 0, angry: 0, earned: 0, tips: 0, waste: 0 }; }
function openDay() {
  S.mode = 'open'; S.t = S.dayLen; S.spawnT = 1.5;
  document.body.classList.add('playing');
  const nw = ORDER.filter(k => FOOD[k].day === S.day && S.day > 1);
  toast(nw.length ? `Ziua ${S.day} · Nou în meniu: ${nw.map(k => FOOD[k].icon + ' ' + FOOD[k].name).join(', ')}!` : `Ziua ${S.day} · Am deschis! 🔔`, 'good');
  SFX.bell();
}
function spawnEvery() { return Math.max(3.4, 8.5 - S.day * 0.9) * rr(0.8, 1.2); }
function updateDay(dt) {
  if (S.mode === 'open') {
    S.t -= dt;
    S.spawnT -= dt;
    if (S.spawnT <= 0) {
      S.spawnT = spawnEvery();
      if (CUST.filter(c => c.state !== 'leave').length < 7) spawnCustomer();
    }
    if (S.t <= 0) { S.t = 0; S.mode = 'closing'; toast('Închidem! Servește clienții care au rămas.', 'good'); SFX.bell(); }
  } else if (S.mode === 'closing') {
    if (!CUST.some(c => c.state !== 'leave')) endDay();
  }
  if (S.rep <= 0 && (S.mode === 'open' || S.mode === 'closing')) gameOver();
}
function clearDay() {
  for (const c of CUST) { scene.remove(c.p.g); if (c.bub) c.bub.remove(); if (c.mood) c.mood.remove(); }
  CUST.length = 0; LINE.length = 0; WINDOW.fill(null);
  for (let i = PICK.length - 1; i >= 0; i--) if (!PICK[i].userData.st && PICK[i].children.length && !Object.values(ST).some(s => s.g === PICK[i])) PICK.splice(i, 1);
  for (const it of S.tray) trayG.remove(it.m);
  S.tray.length = 0;
  for (const k in ST) for (const s of ST[k].slots) { s.state = 'empty'; s.t = 0; }
}
function endDay() {
  S.mode = 'summary';
  document.body.classList.remove('playing');
  const d = S.dayStats;
  S.total.served += d.served; S.total.angry += d.angry; S.total.earned += d.earned;
  if (S.total.earned > best) { best = S.total.earned; try { localStorage.setItem(SAVE + '.best', best); } catch (e) {} }
  clearDay();
  showSummary();
}
function gameOver() {
  S.mode = 'over';
  document.body.classList.remove('playing');
  const d = S.dayStats;
  S.total.served += d.served; S.total.angry += d.angry; S.total.earned += d.earned;
  if (S.total.earned > best) { best = S.total.earned; try { localStorage.setItem(SAVE + '.best', best); } catch (e) {} }
  clearDay();
  panel(`<h1>😢 Rulota s-a închis</h1>
    <p style="text-align:center">Prea mulți clienți au plecat supărați și nu mai vine nimeni la tine.</p>
    <div class="stats"><div>Ai rezistat<b>${S.day} ${S.day === 1 ? 'zi' : 'zile'}</b></div><div>Clienți serviți<b>${S.total.served}</b></div>
    <div>Ai câștigat în total<b>${S.total.earned} lei</b></div><div>Recordul tău<b>${best} lei</b></div></div>
    <button class="go" id="again">Încearcă din nou</button>`);
  $('again').onclick = () => { reset(); startDay(true); };
}
function stars(r) { const f = Math.round(r); return '★'.repeat(f) + '☆'.repeat(5 - f); }
function showSummary() {
  const d = S.dayStats;
  let h = `<h2>🌇 Sfârșitul zilei ${S.day}</h2>
    <div class="stats"><div>Clienți serviți<b>${d.served}</b></div><div>Plecați supărați<b>${d.angry}</b></div>
    <div>Încasări (cu bacșiș)<b>${d.earned} lei</b></div><div>Bacșiș<b>${d.tips} lei</b></div>
    ${d.waste ? `<div>Mâncare arsă<b>−${d.waste} lei</b></div>` : ''}<div>Reputație<b style="color:#e0a400">${stars(S.rep)}</b></div></div>
    <p style="text-align:center;font-weight:800;font-size:18px">Ai în cont: ${S.money} lei</p>
    <p><b>Cumpără îmbunătățiri pentru rulotă:</b></p><div class="shop">`;
  for (const u of UPG) {
    const own = S.up[u.id];
    h += `<button data-u="${u.id}" ${own || S.money < u.price ? 'disabled' : ''}><span class="ic">${u.ic}</span><span class="tx">${u.name}<small>${u.desc}</small></span><span class="pr">${own ? '✓ Ai' : u.price + ' lei'}</span></button>`;
  }
  const nx = ORDER.filter(k => FOOD[k].day === S.day + 1);
  h += `</div>${nx.length ? `<p style="text-align:center">Mâine apare în meniu: <b>${nx.map(k => FOOD[k].icon + ' ' + FOOD[k].name).join(', ')}</b>, la stația care acum e încuiată.</p>` : ''}
    <button class="go" id="next">Ziua ${S.day + 1} ▶</button>`;
  panel(h);
  document.querySelectorAll('.shop button').forEach(b => b.onclick = () => {
    const u = UPG.find(x => x.id === b.dataset.u);
    if (S.money < u.price || S.up[u.id]) return;
    S.money -= u.price; S.up[u.id] = true; SFX.cash(); updateLabels(); hud(); showSummary();
  });
  $('next').onclick = () => { S.day++; startDay(false); };
}
function startDay(intro) {
  audio();
  hidePanel();
  S.dayStats = newDayStats();
  S.dayLen = 150;
  updateLabels();
  camInside();
  if (intro) { S.mode = 'intro'; camT = 0; } else openDay();
}
function reset() {
  S.day = 1; S.money = 0; S.rep = 5; S.up = {}; S.total = { served: 0, angry: 0, earned: 0 };
  clearDay(); updateLabels();
}

// ---------------- panouri ----------------
function panel(h) { $('panel').innerHTML = h; $('overlay').classList.add('show'); }
function hidePanel() { $('overlay').classList.remove('show'); }
function showStart() {
  const keys = isTouch
    ? '<p>📱 Atinge o stație ca să gătești, atinge-o din nou când e gata ca să pui mâncarea pe tavă, apoi atinge balonul clientului ca să-i dai comanda.</p>'
    : '<p>🖱️ Click pe o stație ca să gătești, încă un click când e gata ca s-o pui pe tavă, apoi click pe client (sau pe balonul lui) ca să-i dai comanda.<br>⌨️ <kbd>1</kbd>–<kbd>5</kbd> stațiile · <kbd>Q</kbd> <kbd>W</kbd> <kbd>E</kbd> servești clientul 1, 2, 3 · <kbd>X</kbd> golești tava · <kbd>Esc</kbd> pauză</p>';
  panel(`<h1>🍔 Fastfood Owner</h1>
    <p style="text-align:center">Ai o rulotă cu mâncare într-o piațetă din oraș. Oamenii vin la geam și comandă, iar tu gătești.</p>
    <ul>
      <li>Deasupra fiecărui client vezi <b>ce a comandat</b> și cât mai are <b>răbdare</b>.</li>
      <li>Burgerii, cartofii și hot dog-ii <b>se ard</b> dacă îi lași prea mult (bara se face roșie ⚠️). Ce e ars aruncă-l cu încă un click.</li>
      <li>Servește repede: primești <b>bacșiș</b> și crește reputația ⭐. Un client care pleacă supărat îți ia o stea. La 0 stele închizi rulota.</li>
      <li>O zi durează 2 minute și jumătate. Seara cumperi îmbunătățiri, iar în zilele următoare apar mâncăruri noi.</li>
    </ul>
    <div class="menu">${ORDER.map(k => `<div>${FOOD[k].icon} ${FOOD[k].name} · ${FOOD[k].price} lei${FOOD[k].day > 1 ? ` <small>(ziua ${FOOD[k].day})</small>` : ''}</div>`).join('')}</div>
    ${keys}
    ${best ? `<p style="text-align:center">Recordul tău: <b>${best} lei</b></p>` : ''}
    <button class="go" id="play">Deschide rulota ▶</button>`);
  $('play').onclick = () => startDay(true);
}

// ---------------- HUD ----------------
function hud() {
  $('money').textContent = `💰 ${S.money} lei`;
  $('stars').textContent = stars(S.rep);
  const t = Math.ceil(S.t), cl = $('clock');
  cl.textContent = S.mode === 'closing' ? `📅 Ziua ${S.day} · Închidem…` : `📅 Ziua ${S.day} · ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  cl.className = 'chip' + (S.mode === 'closing' ? ' closing' : '');
}

// ---------------- input ----------------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hit(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hs = ray.intersectObjects(PICK.concat(trayG), true);
  for (const h of hs) {
    let o = h.object;
    while (o && !o.userData.st && !o.userData.cust && !o.userData.tray) o = o.parent;
    if (o) return o.userData;
  }
  return null;
}
// pe ecrane înguste tragi pe orizontală ca să vezi toate stațiile
let drag = null;
renderer.domElement.addEventListener('pointerdown', e => {
  audio();
  if (!(S.mode === 'open' || S.mode === 'closing') || S.paused) return;
  const u = hit(e);
  if (!u) { drag = { x: e.clientX, pan: panX, moved: false }; return; }
  if (u.st) useStation(u.st);
  else if (u.cust) serve(u.cust);
  else if (u.tray) toast('Dă click pe un client ca să-i dai mâncarea de pe tavă');
});
renderer.domElement.addEventListener('pointermove', e => {
  if (drag && panMax > 0) {
    const d = CAM_IN.pos.z - CT_Z, vis = 2 * d * Math.tan(THREE.MathUtils.degToRad(CAM_IN.fov / 2)) * (innerWidth / innerHeight);
    const dx = e.clientX - drag.x;
    if (Math.abs(dx) > 4) drag.moved = true;
    panX = drag.pan - dx / innerWidth * vis; camInside();
    return;
  }
  if (isTouch) return;
  const u = (S.mode === 'open' || S.mode === 'closing') ? hit(e) : null;
  renderer.domElement.style.cursor = u && (u.st || u.cust) ? 'pointer' : 'default';
});
function trashTray() {
  if (!S.tray.length) return;
  const lost = S.tray.reduce((a, it) => a + FOOD[it.k].waste, 0);
  for (const it of S.tray) trayG.remove(it.m);
  S.tray.length = 0;
  S.money = Math.max(0, S.money - lost); S.dayStats.waste += lost;
  toast(`🗑 Ai aruncat tot de pe tavă (−${lost} lei)`, 'bad'); SFX.burnt();
}
$('trash').addEventListener('pointerdown', e => { e.stopPropagation(); trashTray(); });
function togglePause() {
  if (!(S.mode === 'open' || S.mode === 'closing')) return;
  S.paused = !S.paused;
  $('bPause').textContent = S.paused ? '▶' : '⏸';
  if (S.paused) { panel(`<h2>⏸ Pauză</h2><p style="text-align:center">Clienții te așteaptă.</p><button class="go" id="resume">Continuă ▶</button>`); $('resume').onclick = togglePause; }
  else hidePanel();
}
$('bPause').onclick = togglePause;
function setSound(v) { S.sound = v; $('bSound').textContent = v ? '🔊' : '🔇'; try { localStorage.setItem(SAVE + '.snd', v ? '1' : '0'); } catch (e) {} }
$('bSound').onclick = () => { audio(); setSound(!S.sound); };
setSound(S.sound);
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'escape' || k === 'p') { togglePause(); return; }
  if (k === 'm') { setSound(!S.sound); return; }
  if (k === 'enter' && $('overlay').classList.contains('show')) { const b = document.querySelector('#panel .go'); if (b) b.click(); return; }
  if (!(S.mode === 'open' || S.mode === 'closing') || S.paused) return;
  audio();
  const sk = { '1': 'drink', '2': 'fryer', '3': 'grill', '4': 'hotdog', '5': 'shaorma' }[k];
  if (sk) { useStation(sk); return; }
  const qi = ['q', 'w', 'e'].indexOf(k);
  if (qi >= 0) { if (WINDOW[qi]) serve(WINDOW[qi]); return; }
  if (k === 'x' || k === 'delete' || k === 'backspace') trashTray();
});
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointercancel', () => { drag = null; });
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camInside();
});

// ---------------- buclă ----------------
const clock = new THREE.Clock();
function update(dt) {
  for (const c of CARS) {
    c.x += c.dir * c.v * dt;
    if (c.x > 55) c.x = -55; if (c.x < -55) c.x = 55;
    c.g.position.set(c.x, 0, c.z);
  }
  for (const w of WALKERS) {
    w.x += w.dir * w.v * dt;
    if (w.x > 50) w.x = -50; if (w.x < -50) w.x = 50;
    w.p.g.position.set(w.x, 0, w.z);
    animPerson(w.p, dt, true, w.v);
  }
  ST.shaorma.meat.rotation.y += dt * 0.8;
  for (const r of ST.hotdog.rollers) r.rotation.x += dt * 3;
  ST.grill.glow.material.emissiveIntensity = 0.4 + Math.sin(performance.now() / 300) * 0.1;
  const playing = (S.mode === 'open' || S.mode === 'closing') && !S.paused;
  if (playing) {
    updateDay(dt);
    updateCustomers(dt);
  }
  for (let i = FLY.length - 1; i >= 0; i--) {
    const f = FLY[i]; f.t += dt / f.dur;
    const u = Math.min(1, f.t);
    f.obj.position.lerpVectors(f.from, f.to, u); f.obj.position.y += Math.sin(u * Math.PI) * f.arc;
    if (u >= 1) { FLY.splice(i, 1); f.done && f.done(); }
  }
  updateSmoke(dt);
}
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  if (!S.paused) update(dt);
  placeCamera(dt);
  // etichetele stațiilor
  const showLbl = S.mode === 'open' || S.mode === 'closing';
  for (const k in ST) {
    const st = ST[k];
    const p = toScreen(st.lblPos.clone().applyMatrix4(truck.matrixWorld));
    st.visibleOnScreen = showLbl;
    st.lbl.style.display = showLbl ? 'block' : 'none';
    st.lbl.style.left = p.x + 'px'; st.lbl.style.top = Math.min(p.y, innerHeight - 64) + 'px';
  }
  if (!S.paused && (S.mode === 'open' || S.mode === 'closing' || S.mode === 'intro')) updateStations(S.mode === 'intro' ? 0 : dt);
  else if (sizzle) sizzle.gain.value = 0;
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }
  hud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
camInside();
updateLabels();
showStart();
frame();

// pentru teste
window.__ff = { S, ST, CUST, WINDOW, LINE, FOOD, useStation, serve, spawnCustomer, trashTray, endDay, update, startDay,
  skip() { camT = 0.999; },
  step(n = 60, dt = 1 / 60) { for (let i = 0; i < n; i++) { update(dt); updateStations(dt); } } };
</script>
</body>
</html>
