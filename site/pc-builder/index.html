function drawScreen(state, r) {
  const g = scrC.getContext('2d'), w = scrC.width, h = scrC.height;
  g.fillStyle = state === 'off' ? '#060708' : state === 'err' ? '#14070a' : '#0a1426'; g.fillRect(0, 0, w, h);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (state === 'off') { g.fillStyle = '#1e232b'; g.font = '900 44px system-ui'; g.fillText('PC BUILDER', w / 2, h / 2); }
  else if (state === 'err') {
    g.fillStyle = '#ff5a4a'; g.font = '900 46px system-ui'; g.fillText('✖ NU PORNEȘTE', w / 2, 70);
    g.fillStyle = '#ffb0a6'; g.font = '600 24px system-ui'; g.textAlign = 'left';
    (r.e || []).slice(0, 5).forEach((t, i) => g.fillText('• ' + t, 30, 140 + i * 42));
  } else {
    g.fillStyle = '#6dff86'; g.font = '900 42px system-ui'; g.fillText('✔ POST OK · Windows pornit', w / 2, 56);
    const o = S.order;
    const rows = [['🎮 Gaming', r.pf.gaming, '#7fc0ff'], ['🎬 Video', r.pf.video, '#ffb36a'], ['💻 Programare', r.pf.prog, '#c79bff']];
    rows.forEach(([n, v, c], i) => {
      const y = 125 + i * 72;
      g.textAlign = 'left'; g.fillStyle = '#dfe6ef'; g.font = '700 28px system-ui'; g.fillText(n, 30, y);
      g.fillStyle = '#1f2a3d'; g.fillRect(250, y - 16, 300, 32);
      g.fillStyle = c; g.fillRect(250, y - 16, 300 * v / 100, 32);
      if (o && USES[o.use].n === n.split(' ')[1]) { const m = USES[o.use].tiers[o.tier].min; g.fillStyle = '#fff'; g.fillRect(250 + 300 * m / 100 - 2, y - 22, 4, 44); }
      g.textAlign = 'right'; g.fillStyle = '#fff'; g.font = '800 28px system-ui'; g.fillText(v, w - 20, y);
    });
    if (r.hot) { g.textAlign = 'center'; g.fillStyle = '#ffd34a'; g.font = '700 22px system-ui'; g.fillText('⚠ Procesorul e la 100°C', w / 2, h - 22); }
  }
  scrT.needsUpdate = true;
}

$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; audio(); S.tab = b.dataset.t; renderShop(); $('list').scrollTop = 0; });

const NEXT = { case: 'mb', mb: 'cpu', cpu: 'cool', cool: 'ram', ram: 'gpu', gpu: 'sto', sto: 'psu', psu: 'psu' };

function renderOrder() {

    `<span class="${over ? 'no' : 'ok'}">${over ? '✗' : '✓'} 💰 ≤ ${lei(o.budget)}</span>`;

function powerOn() {

function deliver() {
  if (!S.tested || S.mode !== 'build') return;
  const o = S.order, r = evalBuild(S.B), rs = meets(o, S.B, r);
  const fails = rs.filter(x => !x.ok), over = r.cost > o.budget;
  let pay = o.budget * Math.max(0, 1 - 0.25 * fails.length);
  const perfect = !fails.length && !over;
  const use = rs[0], tip = perfect && r.pf[o.use] >= USES[o.use].tiers[o.tier].min + 12 ? Math.round(o.budget * 0.04 / 10) * 10 : 0;
  pay += tip;
  const profit = pay - r.cost;
  const dRep = perfect ? 1 : -(fails.length + (over ? 1 : 0));
  S.rep = clamp(S.rep + dRep, 0, 5);
  S.money += profit; S.dayProfit += profit; if (perfect) S.dayPerfect++;
  S.idx++; S.mode = 'result';

    : over && !fails.length ? '😠 „Ai depășit bugetul! Îți dau doar cât am zis.”'
    : fails.length >= 2 ? '😡 „Nu seamănă deloc cu ce am comandat!”' : '😐 „Nu e chiar ce am cerut…”';
  const li = rs.map(x => `<li class="${x.ok ? 'g' : 'r'}">${x.ok ? '✓' : '✗'} ${x.l}${x.v ? ' (' + x.v + ')' : ''}${x.ok ? '' : '<b>−25%</b>'}</li>`).join('') +
    `<li class="${over ? 'r' : 'g'}">${over ? '✗' : '✓'} Buget ${lei(o.budget)} · piese ${lei(r.cost)}${over ? '<b>plătește doar bugetul</b>' : ''}</li>` +
    (tip ? `<li class="y">⭐ Performanță peste așteptări<b>+${lei(tip)} bacșiș</b></li>` : '') +
    (r.hot ? `<li class="y">⚠ Procesorul se încinge (merge mai încet)</li>` : '');
  const last = S.idx >= S.perDay;
  showPanel(`<h2>📦 Livrat lui ${o.name}</h2><div class="quote">${quote}</div><ul class="res">${li}</ul>
    <div class="stats"><div>Plătit de client<b>${lei(pay)}</b></div><div>Cost piese<b>${lei(r.cost)}</b></div><div>Profit<b style="color:${profit >= 0 ? '#1f8a3a' : '#c0301e'}">${profit >= 0 ? '+' : ''}${lei(profit)}</b></div><div>Reputație<b>${'★'.repeat(S.rep)}${'☆'.repeat(5 - S.rep)} <small style="font-size:14px">${dRep > 0 ? '+1' : dRep}</small></b></div></div>
    <p style="font-size:13px;opacity:.75;text-align:center">Cel mai ieftin PC care bifa tot costa ${lei(o.cheap)}.</p>
    <button class="go" id="pNext">${S.rep <= 0 ? 'Mai departe' : last ? 'Închide ziua' : 'Următorul client →'}</button>`);
  $('pNext').onclick = () => { audio(); if (S.rep <= 0) gameOver(); else if (last) daySummary(); else nextOrder(); };
}
function showPanel(html) { $('panel').innerHTML = html; $('overlay').classList.add('show'); }

addEventListener('keydown', e => {

// ================= cameră =================
const cam = { th: 0.5, ph: 0.32, zoom: 1, target: new THREE.Vector3(0, 2.2, 0), r: 12 };
const ptrs = new Map(); let drag = null, pinch = 0, moved = 0;
cv.addEventListener('pointerdown', e => { audio(); cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); drag = { x: e.clientX, y: e.clientY }; moved = 0; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); } });
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch) cam.zoom = clamp(cam.zoom * pinch / d, 0.5, 1.8); pinch = d; moved = 99; return; }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy);
  cam.th -= dx * 0.008; cam.ph = clamp(cam.ph + dy * 0.006, -0.1, 1.25);
  drag = { x: e.clientX, y: e.clientY };
});
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function endPtr(e) {
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = 0;
  if (!ptrs.size) {
    if (moved < 6 && S.mode === 'build') {
      ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const h = ray.intersectObject(pc, true)[0];
      if (h) { let o = h.object; while (o && !o.userData.cat) o = o.parent; if (o && o.userData.cat !== S.tab && !locked(o.userData.cat)) { S.tab = o.userData.cat; renderShop(); SFX.click(); } }
    }
    drag = null;
  }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); drag = null; pinch = 0; });
cv.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = clamp(cam.zoom * (1 + clamp(e.deltaY, -100, 100) * 0.0012), 0.5, 1.8); }, { passive: false });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// zona liberă de ecran (fără panouri) în care centrăm PC-ul
function freeArea() {
  const W = innerWidth, H = innerHeight;
  const gb = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gb')) || 0;
  const sh = $('shop').getBoundingClientRect(), od = $('order').getBoundingClientRect();
  if (W <= 900) return { x0: 0, x1: W, y0: od.bottom + 4, y1: sh.top - 4 };
  const top = gb + 60;
  const A = { x0: od.right + 10, x1: sh.left - 10, y0: top, y1: H };
  const B = { x0: 0, x1: sh.left - 10, y0: top, y1: od.top - 10 };
  const sc = a => Math.min(a.x1 - a.x0, (a.y1 - a.y0) * 1.1);
  return sc(A) >= sc(B) ? A : B;
}
function placeCamera() {
  const W = innerWidth, H = innerHeight, a = freeArea();
  const fw = Math.max(120, a.x1 - a.x0), fh = Math.max(120, a.y1 - a.y0);
  const tf = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const cs = S.B.case ? CASED[S.B.case.ff] : CASED.ATX;
  const need = Math.max(cs.H * 1.35 * H / (0.9 * fh * tf), cs.D * 1.45 * H / (0.9 * fw * tf), 7);
  const r = Math.min(40, need * cam.zoom);
  cam.target.y = cs.H * 0.47;
  cam.r += (r - cam.r) * 0.15;
  camera.position.set(cam.target.x + cam.r * Math.cos(cam.ph) * Math.sin(cam.th), cam.target.y + cam.r * Math.sin(cam.ph), cam.target.z + cam.r * Math.cos(cam.ph) * Math.cos(cam.th));
  camera.lookAt(cam.target);
  const cx = (a.x0 + a.x1) / 2, cy = (a.y0 + a.y1) / 2;
  camera.setViewOffset(W, H, W / 2 - cx, H / 2 - cy, W, H);
}

// ================= bucla =================
const clock = new THREE.Clock();
const ease = t => 1 - Math.pow(1 - t, 3);
let tAll = 0;
function update(dt) {
  tAll += dt;
  for (let i = fly.length - 1; i >= 0; i--) {
    const f = fly[i]; f.t = Math.min(1, f.t + dt / 0.5);
    const s = 1 - ease(f.t); f.g.position.set(f.x0 * s, 4.5 * s, 4 * s);
    if (f.t >= 1) { f.g.position.set(0, 0, 0); fly.splice(i, 1); }
  }
  const spin = S.on ? 18 : 0;
  for (const f of fans) f.rotation.z += spin * dt;
  rgbMats.forEach((m, i) => {
    if (S.on) { m.emissive.setHSL((tAll * 0.18 + i * 0.07) % 1, 1, 0.5); m.emissiveIntensity = 1.6; }
    else { m.emissive.setHex(0x444444); m.emissiveIntensity = 0.15; }
  });
  if (ledMat) ledMat.emissive.setHex(S.on ? 0x33ff66 : 0x000000);
  glow.intensity = S.on && rgbMats.length ? 3 : 0;
  if (S.on && rgbMats.length) glow.color.setHSL((tAll * 0.18) % 1, 1, 0.6);
  if (S.mode === 'menu') cam.th += dt * 0.15;
}
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  update(dt);
  placeCamera();
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

drawScreen('ok', evalBuild(S.B));

// pentru teste

  step(n = 60, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); },
