<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Drift 3D · no-santos</title>
<style>
  :root { --ink:#f4f1ea; --ink2:#a9a49b; --glass:rgba(12,14,18,.62); --line:rgba(255,255,255,.12); --acc:#ffb22e; --bad:#ff5a4f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#9fb6c9; color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select:none; -webkit-user-select:none; }
  canvas#game { display:block; position:fixed; inset:0; width:100%; height:100%; }
  .panel { position:fixed; background:var(--glass); border:1px solid var(--line); border-radius:12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #cars { top:12px; left:12px; padding:8px; display:flex; flex-direction:column; gap:6px; width:250px; }
  #cars .car { display:flex; gap:10px; align-items:center; padding:7px 9px; border-radius:9px; cursor:pointer;
    border:1px solid transparent; background:rgba(255,255,255,.03); color:inherit; font:inherit; text-align:left; }
  #cars .car:hover { background:rgba(255,255,255,.08); }
  #cars .car.on { border-color:var(--acc); background:rgba(255,178,46,.12); }
  #cars .sw { width:14px; height:14px; border-radius:50%; flex:none; box-shadow:0 0 0 2px rgba(255,255,255,.25) inset; }
  #cars .nm { font-weight:650; font-size:14px; }
  #cars .tg { font-size:11.5px; color:var(--ink2); line-height:1.3; }
  #cars .k { margin-left:auto; font-size:11px; color:var(--ink2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; }
  #desc { font-size:12px; color:var(--ink2); padding:4px 6px 2px; line-height:1.4; }
  #score { top:12px; left:50%; transform:translateX(-50%); padding:8px 18px; text-align:center; min-width:220px; transition:border-color .2s; }
  #score .cur { font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.5px; }
  #score .mul { font-size:14px; color:var(--acc); font-weight:700; height:18px; }
  #score .lbl { font-size:11px; color:var(--ink2); text-transform:uppercase; letter-spacing:1.5px; }
  #score.drifting { border-color:var(--acc); }
  #score.lost .cur { color:var(--bad); }
  #totals { top:12px; right:12px; padding:10px 14px; font-size:13px; min-width:170px; }
  #totals div { display:flex; justify-content:space-between; gap:14px; padding:2px 0; }
  #totals b { font-variant-numeric:tabular-nums; }
  #speedo { bottom:12px; right:12px; padding:10px 16px; text-align:right; min-width:150px; }
  #speedo .v { font-size:40px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  #speedo .u { font-size:12px; color:var(--ink2); }
  #speedo .a { font-size:13px; margin-top:6px; color:var(--ink2); font-variant-numeric:tabular-nums; }
  #help { bottom:12px; left:12px; padding:9px 12px; font-size:12px; color:var(--ink2); line-height:1.6; }
  #help kbd { display:inline-block; min-width:20px; text-align:center; border:1px solid var(--line); border-bottom-width:2px;
    border-radius:5px; padding:0 5px; color:var(--ink); font:inherit; font-size:11.5px; background:rgba(255,255,255,.05); }
  #pop { position:fixed; top:110px; left:50%; transform:translateX(-50%); font-size:26px; font-weight:800; color:var(--acc);
    text-shadow:0 2px 10px rgba(0,0,0,.5); opacity:0; transition:opacity .3s, transform .6s; pointer-events:none; }
  #pop.show { opacity:1; transform:translateX(-50%) translateY(-10px); }
  #pop.bad { color:var(--bad); }
  #touch { position:fixed; bottom:96px; left:0; right:0; display:none; justify-content:space-between; padding:0 14px; pointer-events:none; }
  #touch .grp { display:flex; gap:10px; pointer-events:auto; }
  #touch button { width:68px; height:68px; border-radius:50%; border:1px solid var(--line); background:var(--glass);
    color:var(--ink); font-size:26px; touch-action:none; }
  #touch button.on { background:rgba(255,178,46,.35); }
  @media (pointer:coarse) { #touch { display:flex; } #help { display:none; } }
  @media (max-width:720px) {
    #cars { width:auto; flex-direction:column; padding:5px; top:auto; bottom:12px; left:12px; }
    #help { display:none; }
    #cars .tg, #cars .k, #desc { display:none; }
    #cars .car { padding:6px 8px; }
    #cars .nm { font-size:12px; }

    #score .cur { font-size:26px; }

    #speedo { min-width:110px; padding:6px 10px; }
    #speedo .v { font-size:28px; }

function noiseTexture(size, base, spread, dots) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  const img = g.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * spread;
    img.data[i] += n; img.data[i+1] += n; img.data[i+2] += n;
  }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < dots; i++) {
    g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},${Math.random() * .12})`;
    g.fillRect(Math.random() * size, Math.random() * size, 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

grass.rotation.x = -Math.PI / 2; grass.position.y = -0.4; scene.add(grass);

// marcaje pe asfalt

const paintY = new THREE.MeshBasicMaterial({ color: 0xffc23a, transparent: true, opacity: 0.6, depthWrite: false });
function ring(x, z, r, w, mat) {

}
for (const p of PILLARS) { ring(p.x, p.z, 12, 0.35, paint); ring(p.x, p.z, 20, 0.35, paint); }
ring(0, 0, 34, 0.5, paintY);
function stripe(x, z, w, l, rot = 0, mat = paint) {

}
for (let i = -ARENA + 10; i < ARENA - 10; i += 8) { stripe(0, i, 0.3, 4); stripe(i, 0, 4, 0.3); }
for (let i = 0; i < 9; i++) stripe(-4 + i, -120, 0.9, 3, 0, i % 2 ? paint : paintY); // linia de start

// stâlpi
const concrete = new THREE.MeshStandardMaterial({ map: noiseTexture(128, '#9a958c', 30, 300), roughness: 0.9 });
const stripeTexC = document.createElement('canvas'); stripeTexC.width = 64; stripeTexC.height = 64;
{ const g = stripeTexC.getContext('2d'); g.fillStyle = '#d8d4cb'; g.fillRect(0,0,64,64); g.fillStyle = '#d63a2c'; g.fillRect(0,0,64,32); }
const stripeTex = new THREE.CanvasTexture(stripeTexC); stripeTex.colorSpace = THREE.SRGBColorSpace;

// zid cu benzi roșu/alb în jurul arenei
{
  const wallTex = stripeTex.clone(); wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;

  for (let i = 0; i < 26; i++) {

    h.position.set(Math.cos(ang) * d, 10, Math.sin(ang) * d); scene.add(h);

// conuri (se pot dărâma)
const cones = [];
{
  const coneGeo = new THREE.ConeGeometry(0.28, 0.75, 14); coneGeo.translate(0, 0.375, 0);
  const coneMat = new THREE.MeshStandardMaterial({ color: 0xff6a1a, roughness: 0.6 });
  const baseGeo = new THREE.BoxGeometry(0.55, 0.05, 0.55); baseGeo.translate(0, 0.025, 0);
  function addCone(x, z) {
    const g = new THREE.Group();
    const c = new THREE.Mesh(coneGeo, coneMat); c.castShadow = true; g.add(c); g.add(new THREE.Mesh(baseGeo, coneMat));
    g.position.set(x, 0, z); scene.add(g);
    cones.push({ g, x, z, vx: 0, vz: 0, hx: x, hz: z, tip: 0 });
  }
  for (let i = 0; i < 28; i++) { const t = i / 28 * Math.PI * 2; addCone(Math.cos(t) * 34, Math.sin(t) * 34); }
  for (let i = 0; i < 9; i++) addCone((i % 2 ? 4 : -4), 40 + i * 14 + 30);
  for (let i = 0; i < 7; i++) addCone(110 + i * 9, -150 + (i % 2) * 6);
}

// ------------------------------------------------------------------
// Modelele mașinilor: caroserie „loft” (secțiuni transversale de tip
// superelipsă de-a lungul mașinii), plus detalii separate.
// ------------------------------------------------------------------
// interpolare netedă între chei [[z, valoare], ...]
function curve(keys) {
  return z => {
    if (z <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const [z1, v1] = keys[i];
      if (z <= z1) {
        const [z0, v0] = keys[i - 1];
        const t = (z - z0) / (z1 - z0), s = t * t * (3 - 2 * t);
        return v0 + (v1 - v0) * s;
      }
    }
    return keys[keys.length - 1][1];
  };
}
const spow = (v, e) => Math.sign(v) * Math.pow(Math.abs(v), e);

// sec(z) -> {yc, hT, hB, hw, nT, nB, hump}; z de la z0 la z1
function loftGeometry(sec, z0, z1, nz, nth, th0 = 0, th1 = Math.PI * 2, caps = true) {
  const pos = [], uv = [], idx = [];
  const full = th1 - th0 > 6.28;
  const ring = full ? nth : nth + 1;
  for (let i = 0; i <= nz; i++) {
    const z = z0 + (z1 - z0) * i / nz, S = sec(z);
    for (let j = 0; j < ring; j++) {
      const th = th0 + (th1 - th0) * j / nth;
      const c = Math.cos(th), s = Math.sin(th);
      const up = s >= 0;
      const n = up ? S.nT : S.nB;
      const x = S.hw * spow(c, 2 / n);
      let y = S.yc + (up ? S.hT : S.hB) * spow(s, 2 / n);
      if (up && S.hump) y += S.hump * Math.pow(Math.abs(x) / S.hw, 3);
      pos.push(x, y, z); uv.push(i / nz, j / nth);
    }
  }
  for (let i = 0; i < nz; i++) for (let j = 0; j < (full ? nth : nth); j++) {
    const a = i * ring + j, b = i * ring + (j + 1) % ring, c = a + ring, d = b + ring;
    idx.push(a, b, c, b, d, c);
  }
  if (caps && full) {
    for (const [i, flip] of [[0, true], [nz, false]]) {
      const z = z0 + (z1 - z0) * i / nz, S = sec(z), ci = pos.length / 3;
      pos.push(0, S.yc, z); uv.push(i / nz, 0.5);
      for (let j = 0; j < nth; j++) {
        const a = i * ring + j, b = i * ring + (j + 1) % ring;
        flip ? idx.push(ci, b, a) : idx.push(ci, a, b);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function plateTexture(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 56;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f4f0'; g.fillRect(0, 0, 256, 56);
  g.fillStyle = '#1d3f9a'; g.fillRect(0, 0, 26, 56);
  g.fillStyle = '#111'; g.font = 'bold 30px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 141, 30);
  g.strokeStyle = '#222'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, 253, 53);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// roată: anvelopă (lathe), jantă cu spițe duble, disc și etrier
function makeWheel(R, width, rimColor, caliperColor, side) {
  const pivot = new THREE.Group(), spin = new THREE.Group(); pivot.add(spin);
  const prof = [];
  const rIn = R * 0.66, hw = width / 2;
  prof.push(new THREE.Vector2(rIn, -hw * 0.92));
  for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 + Math.PI * i / 8; prof.push(new THREE.Vector2(R - 0.035 + Math.cos(a) * 0.035, Math.sin(a) * hw)); }
  prof.push(new THREE.Vector2(rIn, hw * 0.92));
  const tyreGeo = new THREE.LatheGeometry(prof, 36); tyreGeo.rotateZ(Math.PI / 2);
  const tyre = new THREE.Mesh(tyreGeo, MAT.tyre); tyre.castShadow = true; spin.add(tyre);
  const rimMat = new THREE.MeshPhysicalMaterial({ color: rimColor, metalness: 0.9, roughness: 0.28, clearcoat: 0.6 });
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(rIn, rIn, width * 0.9, 28, 1, true), rimMat);
  barrel.rotation.z = Math.PI / 2; spin.add(barrel);
  const face = side * (hw * 0.82);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(rIn - 0.01, 0.012, 6, 32), rimMat);
  lip.rotation.y = Math.PI / 2; lip.position.x = face; spin.add(lip);
  for (let i = 0; i < 5; i++) {
    for (const off of [-0.07, 0.07]) {
      const sp = new THREE.Mesh(new THREE.BoxGeometry(0.03, rIn * 0.92, 0.035), rimMat);
      const a = i / 5 * Math.PI * 2 + off;
      sp.position.set(face - side * 0.015, Math.cos(a) * rIn * 0.48, Math.sin(a) * rIn * 0.48);
      sp.rotation.x = a; spin.add(sp);
    }
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.05, 16), rimMat);
  hub.rotation.z = Math.PI / 2; hub.position.x = face - side * 0.01; spin.add(hub);
  // disc și etrier (nu se rotesc)
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(rIn * 0.86, rIn * 0.86, 0.03, 28), MAT.disc);
  disc.rotation.z = Math.PI / 2; disc.position.x = side * (hw * 0.25); pivot.add(disc);
  const cal = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.13), new THREE.MeshStandardMaterial({ color: caliperColor, roughness: 0.4, metalness: 0.2 }));
  cal.position.set(side * (hw * 0.4), rIn * 0.55, -rIn * 0.35); cal.rotation.x = 0.55; pivot.add(cal);
  return { pivot, spin };
}

  liner: new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 1, side: THREE.DoubleSide }),

function bodySection(M) {
  const top = curve(M.top), sh = curve(M.sh), hw = curve(M.hw), bot = curve(M.bot), hump = M.hump ? curve(M.hump) : () => 0;
  return z => {
    let b = bot(z), w = hw(z);
    for (const zc of [M.zF, M.zR]) {
      const dz = z - zc;
      if (Math.abs(dz) < M.archR) b = Math.max(b, 0.34 + Math.sqrt(M.archR * M.archR - dz * dz));
      w += M.flare * Math.exp(-dz * dz / 0.6);       // aripi lățite peste roți
    }
    const yc = sh(z);
    return { yc, hT: Math.max(0.02, top(z) - yc), hB: Math.max(0.02, yc - b), hw: w, nT: M.nT, nB: M.nB, hump: hump(z) };
  };
}

// lățimea secțiunii superelipsă la înălțimea y (partea de sus)
function widthAt(s, y) {
  if (y <= s.yc) return s.hw;
  const t = Math.min(0.999, (y - s.yc) / s.hT);
  const sn = Math.pow(t, s.nT / 2), c = Math.sqrt(1 - sn * sn);
  return s.hw * Math.pow(c, 2 / s.nT);
}
const PI = Math.PI;

function buildCar(spec) {
  const M = MODELS[spec.body];
  const root = new THREE.Group();         // poziția centrului de greutate
  const body = new THREE.Group();         // ruliu/tangaj
  const cgZ = M.zR + spec.b;              // centrul de greutate față de mijlocul caroseriei
  body.position.z = -cgZ;
  root.add(body);
  const paint = new THREE.MeshPhysicalMaterial({ color: spec.color, metalness: 0.45, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.04 });
  const S = bodySection(M);
  const add = (mesh, shadow = true) => { mesh.castShadow = shadow; mesh.receiveShadow = true; body.add(mesh); return mesh; };
  // „decal” care urmează exact suprafața caroseriei (faruri, stopuri, prize, praguri)
  const grown = (sec, g) => z => { const s = sec(z); return { ...s, hw: s.hw + g, hT: s.hT + g, hB: s.hB + g }; };
  const patch = (zA, zB, thA, thB, mat, g = 0.006, sec = S) =>
    add(new THREE.Mesh(loftGeometry(grown(sec, g), zA, zB, Math.max(4, Math.round((zB - zA) * 40)), 10, thA, thB, false), mat), false);
  const both = (zA, zB, thA, thB, mat, g, sec) => { patch(zA, zB, thA, thB, mat, g, sec); patch(zA, zB, PI - thB, PI - thA, mat, g, sec); };
  // formă plată pe capătul din față/spate (capacul secțiunii)
  const capDecal = (pts, end, mat, dz = 0.004) => {
    const sh = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
    const geo = new THREE.ShapeGeometry(sh);
    const m = new THREE.Mesh(geo, mat);
    if (end > 0) m.position.z = M.z1 + dz; else { m.position.z = M.z0 - dz; m.rotation.y = PI; }
    return add(m, false);
  };
  const rr = (cx, cy, w, h, r = 0.03) => {           // dreptunghi rotunjit ca listă de puncte
    const pts = [];
    for (const [qx, qy, a0] of [[1, 1, 0], [-1, 1, PI / 2], [-1, -1, PI], [1, -1, 1.5 * PI]])
      for (let k = 0; k <= 4; k++) { const a = a0 + k / 4 * PI / 2; pts.push([cx + qx * (w / 2 - r) + Math.cos(a) * r, cy + qy * (h / 2 - r) + Math.sin(a) * r]); }
    return pts;
  };
  const mirrorX = pts => pts.map(([x, y]) => [-x, y]);

  add(new THREE.Mesh(loftGeometry(S, M.z0, M.z1, 120, 48), paint));
  // pasajele roților (căptușeală neagră în decupajul caroseriei)
  for (const zc of [M.zF, M.zR]) {
    const lw = 2 * (S(zc).hw - 0.01);
    const ln = new THREE.Mesh(new THREE.CylinderGeometry(M.archR - 0.01, M.archR - 0.01, lw, 24, 1, true, 0, PI), MAT.liner);
    ln.rotation.z = PI / 2; ln.position.set(0, 0.34, zc); add(ln, false);
  }

  // habitaclu: baza are lățimea caroseriei la linia geamurilor, deci se îmbină curat
  const C = M.cab, roof = curve(C.roof), belt = curve(C.belt);
  const cabSec = (z, g = 0) => {
    const yb = belt(z);
    return { yc: yb, hT: Math.max(0.008, roof(z) - yb) + g, hB: 0.08, hw: widthAt(S(z), yb + 0.01) * C.wf + g, nT: C.nT, nB: 4 };
  };
  add(new THREE.Mesh(loftGeometry(z => cabSec(z), C.z0, C.z1, 70, 40), MAT.glass));
  const roofMat = M.roofColor != null ? new THREE.MeshPhysicalMaterial({ color: M.roofColor, roughness: 0.35, clearcoat: 1 }) : paint;
  const [c0, c1] = C.cap;
  patch(c0, c1, C.capTh * PI, (1 - C.capTh) * PI, roofMat, 0.007, cabSec);
  // stâlpii A, B, C ca benzi pe sticlă
  const pil = (zA, zB, mat) => { both(zA, zB, 0.02 * PI, 0.25 * PI, mat, 0.006, cabSec); };
  pil(c1 - 0.02, C.z1 - 0.01, paint);                       // A
  pil(C.z0 + 0.01, c0 + 0.03, paint);                       // C
  const bz = c0 + (c1 - c0) * C.bPos;
  pil(bz - 0.035, bz + 0.035, MAT.gloss);                   // B
  // chenar negru la baza geamurilor
  both(C.z0 + 0.1, C.z1 - 0.1, 0.0, 0.05 * PI, MAT.gloss, 0.008, cabSec);

  const front = M.z1, rear = M.z0, F = S(front), R = S(rear);
  // praguri laterale
  both(M.zR + M.archR, M.zF - M.archR, 1.70 * PI, 1.80 * PI, MAT.gloss, 0.006);
  // plăcuțe
  const plateMat = new THREE.MeshStandardMaterial({ map: plateTexture(M.plate), roughness: 0.5 });
  const pf = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.1), plateMat);
  pf.position.set(0, F.yc - F.hB * 0.35, front + 0.012); add(pf, false);
  const pr = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.1), plateMat);
  pr.position.set(0, R.yc + R.hT * 0.05, rear - 0.012); pr.rotation.y = PI; add(pr, false);
  // difuzor spate
  capDecal(rr(0, R.yc - R.hB * 0.7, R.hw * 1.3, R.hB * 0.5, 0.03), -1, MAT.gloss);

  const tailMat = new THREE.MeshStandardMaterial({ color: 0x3a0000, emissive: 0xff1208, emissiveIntensity: 0.7, roughness: 0.25 });
  root.userData.tailMat = tailMat;
  const exhaust = (x, y, r, sx = 1) => {
    const e = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.16, 18, 1, true), MAT.chrome);
    e.rotation.x = PI / 2; e.scale.x = sx; e.position.set(x, y, rear + 0.03); add(e);
    const d = new THREE.Mesh(new THREE.CircleGeometry(r * 0.85, 18), MAT.black); d.rotation.y = PI; d.scale.x = sx; d.position.set(x, y, rear - 0.0); add(d, false);
  };

  if (spec.body === 'm4') {
    // grilele verticale mari, cu ramă cromată și lamele
    for (const sx of [-1, 1]) {
      capDecal(rr(sx * 0.17, F.yc - 0.01, 0.30, 0.36, 0.06), 1, MAT.chrome, 0.004);
      capDecal(rr(sx * 0.17, F.yc - 0.01, 0.26, 0.32, 0.05), 1, MAT.gloss, 0.008);
      for (let k = 0; k < 6; k++) { const sl = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.012, 0.012), MAT.chrome); sl.position.set(sx * 0.17, F.yc - 0.14 + k * 0.052, front + 0.015); add(sl, false); }
    }
    both(front - 0.30, front - 0.02, 0.10 * PI, 0.24 * PI, MAT.lens, 0.005);       // faruri
    both(front - 0.26, front - 0.05, 0.16 * PI, 0.19 * PI, MAT.head, 0.008);       // DRL
    both(front - 0.22, front - 0.01, 1.62 * PI, 1.80 * PI, MAT.gloss, 0.005);      // prize laterale
    capDecal(rr(0, F.yc - F.hB * 0.75, 0.9, 0.1, 0.03), 1, MAT.gloss);
    both(rear + 0.02, rear + 0.32, 0.12 * PI, 0.30 * PI, tailMat, 0.005);          // stopuri
    for (const sx of [-1, 1]) capDecal(rr(sx * (R.hw - 0.2), R.yc + R.hT * 0.45, 0.32, 0.08, 0.02), -1, tailMat);
    for (const sx of [-1, 1]) for (const ox of [0.42, 0.56]) exhaust(sx * ox, R.yc - R.hB * 0.62, 0.045);
    both(0.75, 1.05, 0.02 * PI, 0.06 * PI, MAT.gloss, 0.008);                      // branhii
    const lip = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.025, 0.14), MAT.gloss); lip.position.set(0, S(rear + 0.25).yc + S(rear + 0.25).hT + 0.01, rear + 0.24); add(lip);
  } else if (spec.body === 'rs6') {
    const gp = rr(0, F.yc - 0.02, 1.0, 0.34, 0.08);
    capDecal(gp, 1, MAT.gloss);
    for (let k = 0; k < 5; k++) { const sl = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.01, 0.012), MAT.black); sl.position.set(0, F.yc - 0.15 + k * 0.065, front + 0.012); add(sl, false); }
    const ring4 = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.007, 6, 18), MAT.chrome);
    for (let k = 0; k < 4; k++) { const r = ring4.clone(); r.position.set(-0.075 + k * 0.05, F.yc + 0.1, front + 0.016); add(r, false); }
    both(front - 0.34, front - 0.02, 0.10 * PI, 0.26 * PI, MAT.lens, 0.005);
    both(front - 0.30, front - 0.04, 0.12 * PI, 0.15 * PI, MAT.head, 0.008);
    both(front - 0.24, front - 0.01, 1.60 * PI, 1.80 * PI, MAT.gloss, 0.005);
    both(rear + 0.02, rear + 0.30, 0.16 * PI, 0.32 * PI, tailMat, 0.005);
    capDecal(rr(0, R.yc + R.hT * 0.55, R.hw * 1.75, 0.035, 0.015), -1, tailMat);
    for (const sx of [-1, 1]) exhaust(sx * 0.55, R.yc - R.hB * 0.6, 0.065, 1.5);
    const sp = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.035, 0.26), MAT.gloss); sp.position.set(0, roof(C.z0 + 0.12) - 0.01, C.z0 + 0.1); sp.rotation.x = -0.12; add(sp);
  } else {
    // 911 (997): faruri ovale pe aripi
    for (const sx of [-1, 1]) {
      const hz = front - 0.42, s = S(hz), y = s.yc + s.hT + (s.hump || 0) - 0.02;
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.16, 28, 14, 0, PI * 2, 0, PI / 2), MAT.lens);
      lamp.scale.set(0.95, 0.45, 1.55); lamp.rotation.x = 0.28; lamp.position.set(sx * (s.hw - 0.27), y - 0.04, hz); add(lamp, false);
      const proj = new THREE.Mesh(new THREE.CircleGeometry(0.06, 20), MAT.head); proj.rotation.x = -1.15; proj.position.set(sx * (s.hw - 0.27), y + 0.005, hz + 0.1); add(proj, false);
    }
    capDecal(rr(0, F.yc - F.hB * 0.45, 0.62, 0.12, 0.04), 1, MAT.gloss);
    for (const sx of [-1, 1]) capDecal(rr(sx * 0.45, F.yc - F.hB * 0.45, 0.22, 0.11, 0.04), 1, MAT.gloss);
    both(front - 0.10, front - 0.01, 0.0 * PI, 0.08 * PI, MAT.amber, 0.006);
    both(rear + 0.03, rear + 0.32, 0.16 * PI, 0.34 * PI, tailMat, 0.005);
    for (const sx of [-1, 1]) capDecal(rr(sx * (R.hw - 0.22), R.yc + R.hT * 0.4, 0.3, 0.1, 0.03), -1, tailMat);
    for (const sx of [-1, 1]) for (const ox of [0.16, 0.27]) exhaust(sx * ox, R.yc - R.hB * 0.6, 0.042);
    // grila motorului + eleronul
    const gz = rear + 0.42, gs = S(gz);
    patch(gz - 0.18, gz + 0.18, 0.4 * PI, 0.6 * PI, MAT.gloss, 0.004);
    const wing = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.03, 0.24), paint); wing.position.set(0, gs.yc + gs.hT + 0.05, gz - 0.08); wing.rotation.x = -0.12; add(wing);
  }

  // oglinzi și mânere
  for (const sx of [-1, 1]) {
    const zc = C.z1 - 0.22, s = cabSec(zc);
    const hous = new THREE.Mesh(new THREE.SphereGeometry(0.1, 18, 12), paint); hous.scale.set(0.75, 0.5, 0.55);
    hous.position.set(sx * (s.hw + 0.11), s.yc + 0.1, zc); add(hous);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.03, 0.05), MAT.gloss); arm.position.set(sx * (s.hw + 0.04), s.yc + 0.06, zc); add(arm);
    const hz = bz - 0.3, hs = S(hz), hy = hs.yc + hs.hT * 0.45;
    const dh = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.025, 0.17), spec.body === 'rs6' ? MAT.chrome : paint);
    dh.position.set(sx * (widthAt(hs, hy) + 0.006), hy, hz); add(dh, false);
  }
  // roțile
  const wheels = [];
  const track = spec.wid / 2 - 0.15;
  for (const [z, isFront] of [[M.zF, true], [M.zR, false]]) {
    for (const sx of [-1, 1]) {
      const w = makeWheel(spec.wheelR, isFront ? 0.25 : 0.29, M.rim, M.caliper, sx);
      w.pivot.position.set(sx * track, spec.wheelR, z - cgZ);
      root.add(w.pivot);
      wheels.push({ pivot: w.pivot, spin: w.spin, front: isFront, sx });
    }
  }
  // umbră de contact (ambient occlusion falsă sub mașină)
  const ao = new THREE.Mesh(new THREE.PlaneGeometry(spec.wid + 0.4, spec.len + 0.4), new THREE.MeshBasicMaterial({ map: aoTex, transparent: true, depthWrite: false, opacity: 0.75 }));
  ao.rotation.x = -Math.PI / 2; ao.position.set(0, 0.02, -cgZ); root.add(ao);

  mergeStatic(body);
  for (const w of wheels) { mergeStatic(w.spin); }
  root.userData.body = body;
  root.userData.wheels = wheels;
  return root;
}

const aoTex = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 64, 10, 32, 64, 64);
  gr.addColorStop(0, 'rgba(0,0,0,.85)'); gr.addColorStop(0.6, 'rgba(0,0,0,.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.save(); g.scale(1, 1); g.fillRect(0, 0, 64, 128); g.restore();
  return new THREE.CanvasTexture(c);
})();

const carMeshes = CARS.map(spec => { const m = buildCar(spec); m.visible = false; scene.add(m); return m; });

// unește toate meshurile statice dintr-un grup într-unul singur per material (mai puține draw calls)
function mergeStatic(root, opts = {}) {
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();

  p.s.position.set(x, 0.35, z); p.s.visible = true;
  p.life = 0; p.max = 1.2 + Math.random() * 1.0; p.k = k;
  p.vx = vx * 0.25 + (Math.random() - 0.5); p.vz = vz * 0.25 + (Math.random() - 0.5); p.vy = 0.5 + Math.random() * 0.6;
}
function updateSmoke(dt) {
  for (const p of smoke) {
    if (!p.s.visible) continue;
    p.life += dt;
    if (p.life > p.max) { p.s.visible = false; continue; }
    const t = p.life / p.max;
    p.s.position.x += p.vx * dt; p.s.position.y += p.vy * dt; p.s.position.z += p.vz * dt;
    p.vx *= 0.97; p.vz *= 0.97;
    const sz = 0.8 + t * 4.5; p.s.scale.set(sz, sz, sz);
    p.s.material.opacity = (1 - t) * 0.45 * p.k;
  }
}

// ------------------------------------------------------------------
// Fizica: model „bicicletă” cu punte față/spate, transfer de greutate,
// curbă de aderență tip Pacejka și cerc de frecare pe fiecare punte.
// ------------------------------------------------------------------
const car = {
  spec: CARS[0], x: 0, z: -125, yaw: 0, vx: 0, vz: 0, w: 0,
  steer: 0, ax: 0, ay: 0, rpm: 900, wheelSpin: 0, wheelRot: [0, 0, 0, 0],
  slipR: 0, slipF: 0, spinR: 0, beta: 0, long: 0, lat: 0,
};
const keys = {};

function tyreCurve(alpha, B, C) { return Math.sin(C * Math.atan(B * alpha)); }

function physicsStep(dt) {
  const S = car.spec;
  const L = S.a + S.b;
  const sn = Math.sin(car.yaw), cs = Math.cos(car.yaw);
  // înainte = (sin ψ, cos ψ), stânga (axa locală +x) = (cos ψ, −sin ψ)
  const long = car.vx * sn + car.vz * cs;
  const lat = car.vx * cs - car.vz * sn;
  const speed = Math.hypot(car.vx, car.vz);
  car.long = long; car.lat = lat;

  const up = keys.ArrowUp, down = keys.ArrowDown, hb = keys.Space;
  let throttle = 0, brake = 0;
  if (up && long > -0.5) throttle = 1;
  else if (up) brake = 1;
  if (down && long > 0.5) brake = 1;
  else if (down && !up) throttle = -0.45;

  // unghiul de derivă al caroseriei (β): pozitiv = mașina alunecă spre stânga
  const beta = speed > 2 ? Math.atan2(lat, Math.abs(long)) : 0;
  car.beta = beta;

  // direcția: tastatura e digitală, deci volanul se mișcă treptat; plus contrabracaj asistat
  const steerIn = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  const maxSteer = S.steerMax * (1 - 0.55 * Math.min(speed / 55, 1));
  let target = steerIn * maxSteer;
  if (speed > 4 && long > 0) target += S.assist * beta;
  target = Math.max(-S.steerMax, Math.min(S.steerMax, target));
  const rate = (Math.abs(target) > Math.abs(car.steer) ? S.steerRate : S.steerRate * 1.6) * dt;
  car.steer += Math.max(-rate, Math.min(rate, target - car.steer));
  const d = car.steer;

  // sarcina pe punți (transfer longitudinal de greutate)
  const m = S.mass;
  const Nf = Math.max(0.15 * m * G, m * G * S.b / L - m * car.ax * S.h / L);
  const Nr = Math.max(0.15 * m * G, m * G * S.a / L + m * car.ax * S.h / L);

  // forța motorului, limitată de putere
  const vl = Math.max(Math.abs(long), 4);
  const engineF = throttle * Math.min(S.maxForce, S.power / vl);
  let FxF = engineF * S.frontDrive;
  let FxR = engineF * (1 - S.frontDrive);
  // frâne (65% față)
  if (brake) {
    const bf = S.brake * m * G * 0.95;
    const dir = Math.sign(long) || 1;
    FxF -= dir * bf * 0.65; FxR -= dir * bf * 0.35;
  }
  let gripR = S.muR;
  if (hb) {
    gripR *= S.hbGrip;
    FxR = -(Math.sign(long) || 0) * S.muR * Nr * 0.55 + FxR * 0.2;
  }

  // cercul de frecare: ce consumă tracțiunea/frânarea nu mai e disponibil lateral
  const capF = S.muF * Nf, capR = gripR * Nr;
  let spinR = 0;
  if (Math.abs(FxR) > capR) { spinR = Math.abs(FxR) / capR - 1; FxR = Math.sign(FxR) * capR * 0.92; }
  if (Math.abs(FxF) > capF) { FxF = Math.sign(FxF) * capF * 0.92; }
  const latCapF = Math.sqrt(Math.max(0, capF * capF - FxF * FxF));
  const latCapR = Math.sqrt(Math.max(0, capR * capR - FxR * FxR)) * (1 / (1 + spinR * 1.5));
  car.spinR = throttle > 0 ? spinR : 0;

  // unghiurile de alunecare ale punților
  const vlo = Math.max(Math.abs(long), 3);
  const dirSign = long >= 0 ? 1 : -1;
  const alphaF = Math.atan2(lat + car.w * S.a, vlo) - d * dirSign;
  const alphaR = Math.atan2(lat - car.w * S.b, vlo);
  car.slipF = alphaF; car.slipR = alphaR;
  const FyF = -latCapF * tyreCurve(alphaF, S.BF, S.CF);
  const FyR = -latCapR * tyreCurve(alphaR, S.BR, S.CR);

  // forțe totale în sistemul mașinii
  const cd = Math.cos(d), sd = Math.sin(d);
  let Fx = FxR + FxF * cd - FyF * sd;
  let Fy = FyR + FyF * cd + FxF * sd;
  const torque = S.a * (FyF * cd + FxF * sd) - S.b * FyR;

  // rezistența aerului + rulare
  const dragX = -S.cd * long * Math.abs(long) - 14 * long;
  const dragY = -S.cd * lat * Math.abs(lat) - 14 * lat;
  Fx += dragX; Fy += dragY;

  // integrare în coordonate globale
  const fxW = Fx * sn + Fy * cs;
  const fzW = Fx * cs - Fy * sn;
  car.vx += fxW / m * dt;
  car.vz += fzW / m * dt;
  const I = m * S.a * S.b * S.inertiaF;
  car.w += torque / I * dt;
  // la viteză foarte mică, fără motor, mașina se oprește de tot
  if (speed < 0.6 && !throttle) { car.vx *= 0.9; car.vz *= 0.9; car.w *= 0.85; }
  if (brake && Math.abs(long) < 0.6) {
    car.vx -= long * sn * 0.5; car.vz -= long * cs * 0.5;
  }
  car.yaw += car.w * dt;
  car.x += car.vx * dt;
  car.z += car.vz * dt;

  const axNew = Fx / m;
  car.ax += (axNew - car.ax) * Math.min(1, dt * 8);
  car.ay += (Fy / m - car.ay) * Math.min(1, dt * 8);

  collide();
}

function hitPenalty(impact) {
  if (impact > 3 && drift.active) loseDrift();
}

function collide() {
  const sn = Math.sin(car.yaw), cs = Math.cos(car.yaw);
  const R = 1.0, off = car.spec.len / 2 - 1.0;
  for (const k of [-1, 0, 1]) {
    const cx = car.x + sn * off * k, cz = car.z + cs * off * k;
    // zidurile
    const lim = ARENA - R;
    for (const [axis, sign] of [['x', 1], ['x', -1], ['z', 1], ['z', -1]]) {
      const p = axis === 'x' ? cx : cz;
      const pen = sign * p - lim;
      if (pen > 0) {
        const vn = sign * (axis === 'x' ? car.vx : car.vz);
        if (axis === 'x') car.x -= sign * pen; else car.z -= sign * pen;
        if (vn > 0) {
          if (axis === 'x') car.vx -= sign * vn * 1.35; else car.vz -= sign * vn * 1.35;
          car.vx *= 0.9; car.vz *= 0.9; car.w *= 0.6; car.w += (Math.random() - 0.5) * vn * 0.05;
          hitPenalty(vn);
        }
      }
    }
    // stâlpi, copaci, tancuri, rachetă...
    for (const p of OBSTACLES) {
      const dx = cx - p.x, dz = cz - p.z, dd = Math.hypot(dx, dz), min = p.r + R;
      if (dd < min && dd > 1e-4) {
        const nx = dx / dd, nz = dz / dd;
        car.x += nx * (min - dd); car.z += nz * (min - dd);
        const vn = car.vx * nx + car.vz * nz;
        if (vn < 0) {
          car.vx -= nx * vn * 1.35; car.vz -= nz * vn * 1.35; car.vx *= 0.9; car.vz *= 0.9; car.w *= 0.6;
          hitPenalty(-vn);
        }
      }
    }
    // conurile
    for (const c of cones) {
      const dx = c.x - cx, dz = c.z - cz, dd = Math.hypot(dx, dz);
      if (dd < R + 0.3 && dd > 1e-4) {
        const nx = dx / dd, nz = dz / dd;
        c.x += nx * (R + 0.3 - dd); c.z += nz * (R + 0.3 - dd);
        const vn = car.vx * nx + car.vz * nz;
        if (vn > 0) { c.vx = car.vx * 1.2 + nx * 2; c.vz = car.vz * 1.2 + nz * 2; c.tip = 1; sound.thump(); }
      }
    }
  }
}

function updateCones(dt) {
  for (const c of cones) {
    if (c.vx || c.vz) {
      c.x += c.vx * dt; c.z += c.vz * dt;
      const f = Math.exp(-dt * 2.2); c.vx *= f; c.vz *= f;
      if (Math.hypot(c.vx, c.vz) < 0.05) { c.vx = c.vz = 0; }
      c.x = Math.max(-ARENA + 1, Math.min(ARENA - 1, c.x)); c.z = Math.max(-ARENA + 1, Math.min(ARENA - 1, c.z));
    }
    c.g.position.set(c.x, c.tip ? 0.28 : 0, c.z);
    if (c.tip) { c.g.rotation.z = Math.PI / 2; c.g.rotation.y += (c.vx + c.vz) * dt; }
  }
}

const drift = { active: false, points: 0, time: 0, grace: 0, mult: 1, total: 0, best: {}, maxAng: 0 };
try { drift.best = JSON.parse(localStorage.getItem('drift-best') || '{}') || {}; } catch (e) { drift.best = {}; }
const $ = id => document.getElementById(id);
const popEl = $('pop'); let popT = 0;
function pop(text, bad) { popEl.textContent = text; popEl.className = 'show' + (bad ? ' bad' : ''); popT = 1.6; }
function bankDrift() {
  const pts = Math.round(drift.points * drift.mult);
  if (pts > 50) {
    drift.total += pts;
    const id = car.spec.id;
    if (pts > (drift.best[id] || 0)) { drift.best[id] = pts; try { localStorage.setItem('drift-best', JSON.stringify(drift.best)); } catch (e) {} pop('Record nou! +' + pts.toLocaleString('ro-RO')); }
    else pop('+' + pts.toLocaleString('ro-RO'));
  }
  drift.active = false; drift.points = 0; drift.time = 0; drift.mult = 1;
}
function loseDrift() {
  if (drift.points > 50) pop('Lovit! Drift pierdut', true);
  drift.active = false; drift.points = 0; drift.time = 0; drift.mult = 1;
  $('score').classList.add('lost'); setTimeout(() => $('score').classList.remove('lost'), 700);
}
function updateDrift(dt) {
  const speed = Math.hypot(car.vx, car.vz);
  const ang = Math.abs(car.beta) * 180 / Math.PI;
  const drifting = speed > 7 && ang > 12 && ang < 120 && car.long > 0;
  if (drifting) {
    drift.active = true; drift.grace = 0.9;
    drift.time += dt;
    drift.points += ang * speed * dt * 0.35;
    drift.mult = Math.min(5, 1 + Math.floor(drift.time / 2.5));
    if (ang > drift.maxAng) drift.maxAng = ang;
  } else if (drift.active) {
    drift.grace -= dt;
    if (drift.grace <= 0 || speed < 3) bankDrift();
  }
}

// Sunet (WebAudio, pornește la prima tastă)
// ------------------------------------------------------------------
const sound = (() => {
  let ctx = null, on = true, eng1, eng2, engGain, filt, sqGain, sqFilt, master;
  function init() {
    if (ctx) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ctx.createGain(); master.gain.value = on ? 0.5 : 0; master.connect(ctx.destination);
    filt = ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 900; filt.Q.value = 2;
    engGain = ctx.createGain(); engGain.gain.value = 0.12;
    eng1 = ctx.createOscillator(); eng1.type = 'sawtooth';
    eng2 = ctx.createOscillator(); eng2.type = 'square';
    const g2 = ctx.createGain(); g2.gain.value = 0.5;
    eng1.connect(filt); eng2.connect(g2); g2.connect(filt); filt.connect(engGain); engGain.connect(master);
    eng1.start(); eng2.start();
    const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
    sqFilt = ctx.createBiquadFilter(); sqFilt.type = 'bandpass'; sqFilt.frequency.value = 1400; sqFilt.Q.value = 6;
    sqGain = ctx.createGain(); sqGain.gain.value = 0;
    noise.connect(sqFilt); sqFilt.connect(sqGain); sqGain.connect(master); noise.start();
  }
  function update(rpm, load, squeal) {
    if (!ctx) return;
    const t = ctx.currentTime, f = rpm / 60 * 2;
    eng1.frequency.setTargetAtTime(f, t, 0.03); eng2.frequency.setTargetAtTime(f * 0.5, t, 0.03);
    filt.frequency.setTargetAtTime(500 + load * 1400 + rpm * 0.08, t, 0.05);
    engGain.gain.setTargetAtTime(0.07 + load * 0.08, t, 0.05);
    sqGain.gain.setTargetAtTime(Math.min(0.22, squeal * 0.25), t, 0.05);
    sqFilt.frequency.setTargetAtTime(1100 + squeal * 500, t, 0.1);
  }
  function thump() {
    if (!ctx || !on) return;
    const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 120; o.type = 'triangle';
    g.gain.setValueAtTime(0.25, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime + 0.25);
  }
  function toggle() { on = !on; if (master) master.gain.value = on ? 0.5 : 0; pop(on ? 'Sunet pornit' : 'Sunet oprit'); }
  return { init, update, thump, toggle };
})();

selectCar(startCar);

let camMode = 0;
const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
addEventListener('keydown', e => {
  const k = e.code === 'Space' ? 'Space' : e.key;
  if (GAME_KEYS.includes(k)) { keys[k] = true; e.preventDefault(); }

});
addEventListener('keyup', e => { const k = e.code === 'Space' ? 'Space' : e.key; if (GAME_KEYS.includes(k)) keys[k] = false; });

const camPos = new THREE.Vector3(0, 5, -135), camLook = new THREE.Vector3();
let last = performance.now(), acc = 0, prevWheels = null;
const STEP = 1 / 240;

function visuals(dt) {
  const mesh = carMeshes[CARS.indexOf(car.spec)];
  const S = car.spec;
  mesh.position.set(car.x, 0, car.z);
  mesh.rotation.y = car.yaw;
  const body = mesh.userData.body;
  body.rotation.z = THREE.MathUtils.clamp(-car.ay * 0.009, -0.07, 0.07);   // ruliu
  body.rotation.x = THREE.MathUtils.clamp(-car.ax * 0.006, -0.05, 0.05);   // tangaj
  mesh.userData.tailMat.emissiveIntensity = keys.ArrowDown || keys.Space ? 2.2 : 0.6;

  const sn = Math.sin(car.yaw), cs = Math.cos(car.yaw);
  const speed = Math.hypot(car.vx, car.vz);
  const roll = car.long / S.wheelR * dt;
  const spin = roll + (car.spinR > 0 ? 40 * dt : 0) * Math.sign(car.long || 1);
  for (const wh of mesh.userData.wheels) {
    if (wh.front) wh.pivot.rotation.y = car.steer;
    wh.spin.rotation.x += wh.front && S.frontDrive === 0 ? roll : spin;
  }

  // poziția roților din spate pe sol, pentru urme și fum
  const track = S.wid / 2 - 0.16;
  const wheelsW = [];
  for (const [zo, sx] of [[-S.b, -1], [-S.b, 1], [S.a, -1], [S.a, 1]]) {
    wheelsW.push([car.x + sn * zo + cs * sx * track, car.z + cs * zo - sn * sx * track]);
  }
  const latSlipR = Math.abs(car.lat - car.w * S.b);
  const latSlipF = Math.abs(car.lat + car.w * S.a);
  const intR = Math.max(0, latSlipR - 2.2) * 0.25 + car.spinR * 3 + (keys.Space && speed > 3 ? 1 : 0) + (keys.ArrowDown && car.long > 8 ? 0.6 : 0);
  const intF = Math.max(0, latSlipF - 3) * 0.2 + (keys.ArrowDown && car.long > 8 ? 0.6 : 0);
  if (prevWheels) {
    for (let i = 0; i < 4; i++) {
      const it = i < 2 ? intR : intF;
      if (it > 0.35 && speed > 1.5) addSkid(prevWheels[i][0], prevWheels[i][1], wheelsW[i][0], wheelsW[i][1], 0.24);
      if (i < 2 && it > 0.8 && Math.random() < Math.min(1, it * 0.5) * dt * 60 * 0.5) puff(wheelsW[i][0], wheelsW[i][1], car.vx, car.vz, Math.min(1.5, it * 0.6));
    }
  }
  prevWheels = wheelsW;

  // camera
  const vdir = speed > 3 ? Math.atan2(car.vx, car.vz) : car.yaw;
  let dy = vdir - car.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  const camYaw = car.yaw + dy * 0.45;
  const dist = camMode === 1 ? 13 : 7.8, hgt = camMode === 1 ? 5.5 : 2.9;
  let target;
  if (camMode === 2) target = new THREE.Vector3(car.x + 0.01, 42, car.z - 18);
  else target = new THREE.Vector3(car.x - Math.sin(camYaw) * dist, hgt, car.z - Math.cos(camYaw) * dist);
  const co = window.__drift && window.__drift.camOverride;
  if (co) { target = new THREE.Vector3(car.x + Math.sin(co.ang) * co.dist, co.h, car.z + Math.cos(co.ang) * co.dist); camPos.copy(target); }
  else camPos.lerp(target, 1 - Math.exp(-dt * (camMode === 2 ? 4 : 6)));
  camera.position.copy(camPos);
  if (co) camLook.set(car.x, 0.6, car.z); else camLook.set(car.x + sn * 2.5, 1.0, car.z + cs * 2.5);
  camera.lookAt(camLook);
  camera.fov = 60 + Math.min(speed, 60) * 0.18; camera.updateProjectionMatrix();

  sun.position.set(car.x + 40, 80, car.z + 25); sun.target.position.set(car.x, 0, car.z);

  // sunet
  const gearSpeeds = [0, 14, 25, 36, 48, 62, 90];
  let g = 1; while (g < 6 && Math.abs(car.long) > gearSpeeds[g]) g++;
  const lo = gearSpeeds[g - 1], hi = gearSpeeds[g];
  let rpmT = 1200 + (Math.abs(car.long) - lo) / (hi - lo) * 5600 + (g === 1 ? 0 : 1200);
  if (car.spinR > 0 || keys.Space) rpmT = Math.max(rpmT, 5000 + car.spinR * 3000);
  car.rpm += (Math.min(7400, rpmT) - car.rpm) * Math.min(1, dt * 10);
  sound.update(car.rpm, keys.ArrowUp ? 1 : 0.2, Math.max(0, Math.min(1, (intR + intF) * 0.35)));

  // HUD
  $('spd').textContent = Math.round(speed * 3.6);
  const angDeg = speed > 4 ? Math.round(Math.abs(car.beta) * 180 / Math.PI) : 0;
  $('ang').textContent = 'unghi ' + angDeg + '°';
  $('cur').textContent = Math.round(drift.points * drift.mult).toLocaleString('ro-RO');
  $('mul').textContent = drift.active ? '×' + drift.mult : '';
  $('score').classList.toggle('drifting', drift.active);
  $('tot').textContent = drift.total.toLocaleString('ro-RO');
  $('best').textContent = (drift.best[S.id] || 0).toLocaleString('ro-RO');
  $('maxang').textContent = Math.round(drift.maxAng) + '°';
  if (popT > 0) { popT -= dt; if (popT <= 0) popEl.className = ''; }
}

// rezoluție adaptivă: dacă placa video nu ține pasul, scade pixel ratio
let perfT = 0, perfN = 0, pr = renderer.getPixelRatio();
function adaptQuality(dt) {
  perfT += dt; perfN++;
  if (perfT < 2) return;
  const fps = perfN / perfT; perfT = 0; perfN = 0;
  if (fps < 40 && pr > 0.7) { pr = Math.max(0.7, pr - 0.35); renderer.setPixelRatio(pr); resize(); }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  adaptQuality(dt);
  acc += dt;
  while (acc >= STEP) { physicsStep(STEP); acc -= STEP; }
  updateDrift(dt);
  updateCones(dt);
  updateSmoke(dt);
  visuals(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
$('loading').remove();
requestAnimationFrame(frame);

// pentru testare din consolă
window.__drift = { car, drift, keys, CARS, selectCar, physicsStep, updateDrift, camOverride: null };
</script>
