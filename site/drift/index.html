  #cars .hb { font-size:18px; line-height:1; width:18px; text-align:center; }
  #cars .cur { font-weight:700; font-size:14px; }
  #cars .chev { display:inline-block; margin-left:auto; color:var(--ink2); transition:transform .2s; }
  #cars.collapsed { width:auto; }
  #cars.collapsed .car, #cars.collapsed #desc { display:none; }

  #minimap { bottom:12px; left:12px; width:180px; height:180px; padding:6px; }

  #score .mul { font-size:14px; color:var(--acc); font-weight:700; height:18px; }

  #score.lost .cur { color:var(--bad); }

function noiseTexture(size, base, spread, dots) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  const img = g.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * spread;
    img.data[i] += n; img.data[i+1] += n; img.data[i+2] += n;
  }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < dots; i++) {
    g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},${Math.random() * .12})`;
    g.fillRect(Math.random() * size, Math.random() * size, 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// ------------------------------------------------------------------
// Modelele mașinilor: caroserie „loft” (secțiuni transversale de tip
// superelipsă de-a lungul mașinii), plus detalii separate.
// ------------------------------------------------------------------
// interpolare netedă între chei [[z, valoare], ...]
function curve(keys) {
  return z => {
    if (z <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const [z1, v1] = keys[i];
      if (z <= z1) {
        const [z0, v0] = keys[i - 1];
        const t = (z - z0) / (z1 - z0), s = t * t * (3 - 2 * t);
        return v0 + (v1 - v0) * s;
      }
    }
    return keys[keys.length - 1][1];
  };
}
const spow = (v, e) => Math.sign(v) * Math.pow(Math.abs(v), e);

// sec(z) -> {yc, hT, hB, hw, nT, nB, hump}; z de la z0 la z1
function loftGeometry(sec, z0, z1, nz, nth, th0 = 0, th1 = Math.PI * 2, caps = true) {
  const pos = [], uv = [], idx = [];
  const full = th1 - th0 > 6.28;
  const ring = full ? nth : nth + 1;
  for (let i = 0; i <= nz; i++) {
    const z = z0 + (z1 - z0) * i / nz, S = sec(z);
    for (let j = 0; j < ring; j++) {
      const th = th0 + (th1 - th0) * j / nth;
      const c = Math.cos(th), s = Math.sin(th);
      const up = s >= 0;
      const n = up ? S.nT : S.nB;
      const x = S.hw * spow(c, 2 / n);
      let y = S.yc + (up ? S.hT : S.hB) * spow(s, 2 / n);
      if (up && S.hump) y += S.hump * Math.pow(Math.abs(x) / S.hw, 3);
      pos.push(x, y, z); uv.push(i / nz, j / nth);
    }
  }
  for (let i = 0; i < nz; i++) for (let j = 0; j < (full ? nth : nth); j++) {
    const a = i * ring + j, b = i * ring + (j + 1) % ring, c = a + ring, d = b + ring;
    idx.push(a, b, c, b, d, c);
  }
  if (caps && full) {
    for (const [i, flip] of [[0, true], [nz, false]]) {
      const z = z0 + (z1 - z0) * i / nz, S = sec(z), ci = pos.length / 3;
      pos.push(0, S.yc, z); uv.push(i / nz, 0.5);
      for (let j = 0; j < nth; j++) {
        const a = i * ring + j, b = i * ring + (j + 1) % ring;
        flip ? idx.push(ci, b, a) : idx.push(ci, a, b);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function bodySection(M) {
  const top = curve(M.top), sh = curve(M.sh), hw = curve(M.hw), bot = curve(M.bot), hump = M.hump ? curve(M.hump) : () => 0;
  const arches = M.wheel ? [[M.zF, M.wheel.rF], [M.zR, M.wheel.rR]] : [[M.zF, 0.34], [M.zR, 0.34]];
  return z => {
    let b = bot(z), w = hw(z);
    for (const [zc, r] of arches) {
      const dz = z - zc, aR = M.archR || r + 0.07;
      if (Math.abs(dz) < aR) b = Math.max(b, r + Math.sqrt(aR * aR - dz * dz));
      w += M.flare * Math.exp(-dz * dz / 0.5);       // aripi lățite peste roți
    }
    const yc = sh(z);
    return { yc, hT: Math.max(0.02, top(z) - yc), hB: Math.max(0.02, yc - b), hw: w, nT: M.nT, nB: M.nB, hump: hump(z) };
  };
}

// lățimea secțiunii superelipsă la înălțimea y (partea de sus)
function widthAt(s, y) {
  if (y <= s.yc) return s.hw;
  const t = Math.min(0.999, (y - s.yc) / s.hT);
  const sn = Math.pow(t, s.nT / 2), c = Math.sqrt(1 - sn * sn);
  return s.hw * Math.pow(c, 2 / s.nT);
}
// unghiul θ al secțiunii la înălțimea y (partea de sus / de jos)
function thetaAt(s, y) {
  if (y >= s.yc) return Math.asin(Math.min(1, Math.pow(Math.min(1, (y - s.yc) / s.hT), s.nT / 2)));
  return -Math.asin(Math.min(1, Math.pow(Math.min(1, (s.yc - y) / s.hB), s.nB / 2)));
}

// roată cu design specific fiecărei mașini
function makeWheel(W, front, side) {
  const R = front ? W.rF : W.rR, width = front ? W.wF : W.wR;
  const pivot = new THREE.Group(), spin = new THREE.Group(); pivot.add(spin);
  const rIn = R * (W.style === 'v' ? 0.76 : 0.72), hw = width / 2;
  // anvelopă: flanc rotunjit, banda de rulare puțin mai lată
  const prof = [new THREE.Vector2(rIn + 0.01, -hw * 0.9)];
  for (let i = 0; i <= 10; i++) { const a = -PI / 2 + PI * i / 10; prof.push(new THREE.Vector2(R - 0.03 + Math.cos(a) * 0.03, Math.sin(a) * hw)); }
  prof.push(new THREE.Vector2(rIn + 0.01, hw * 0.9));
  const tyreGeo = new THREE.LatheGeometry(prof, 44); tyreGeo.rotateZ(PI / 2);
  spin.add(new THREE.Mesh(tyreGeo, MAT.tyre));
  const rimMat = new THREE.MeshPhysicalMaterial({ color: W.rim, metalness: 0.85, roughness: W.style === 'twin' ? 0.22 : 0.32, clearcoat: 0.8 });
  const face = side * hw * 0.78;
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(rIn, rIn, width * 0.85, 32, 1, true), MAT.matte);
  barrel.rotation.z = PI / 2; spin.add(barrel);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(rIn - 0.008, 0.014, 8, 40), rimMat);
  lip.rotation.y = PI / 2; lip.position.x = face; spin.add(lip);
  const spoke = (a, r0, r1, w, depth = 0.04, off = 0) => {
    const len = r1 - r0, m = new THREE.Mesh(new THREE.BoxGeometry(depth, len, w), rimMat);
    const rm = (r0 + r1) / 2;
    m.position.set(face - side * (0.02 + off), Math.cos(a) * rm, Math.sin(a) * rm); m.rotation.x = a; spin.add(m);
  };
  const branch = (a0, a1, r0, r1, w) => {      // spiță oblică între (r0,a0) și (r1,a1)
    const y0 = Math.cos(a0) * r0, z0 = Math.sin(a0) * r0, y1 = Math.cos(a1) * r1, z1 = Math.sin(a1) * r1;
    const len = Math.hypot(y1 - y0, z1 - z0), m = new THREE.Mesh(new THREE.BoxGeometry(0.035, len, w), rimMat);
    m.position.set(face - side * 0.02, (y0 + y1) / 2, (z0 + z1) / 2); m.rotation.x = -Math.atan2(z1 - z0, y1 - y0) + 0; 
    m.rotation.x = Math.atan2(z1 - z0, y1 - y0); spin.add(m);
  };
  const n = 5, hubR = 0.075;
  for (let i = 0; i < n; i++) {
    const a = i / n * PI * 2;
    if (W.style === 'y') {                  // spițe în Y (M)
      spoke(a, hubR, rIn * 0.55, 0.05);
      branch(a, a - 0.22, rIn * 0.5, rIn - 0.01, 0.032);
      branch(a, a + 0.22, rIn * 0.5, rIn - 0.01, 0.032);
    } else if (W.style === 'v') {           // spițe în V, „trapez” (RS)
      branch(a - 0.08, a - 0.2, hubR, rIn - 0.01, 0.034);
      branch(a + 0.08, a + 0.2, hubR, rIn - 0.01, 0.034);
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.02, rIn * 0.42), rimMat);
      bar.position.set(face - side * 0.022, Math.cos(a) * rIn * 0.8, Math.sin(a) * rIn * 0.8); bar.rotation.x = a + PI / 2 - PI / 2; bar.rotation.x = -a; spin.add(bar);
    } else if (W.style === 'truck') {      // jantă de camion: disc plin cu 10 prezoane
      if (i === 0) {
        const disc = new THREE.Mesh(new THREE.CylinderGeometry(rIn - 0.005, rIn - 0.005, 0.03, 36), rimMat); disc.rotation.z = PI / 2; disc.position.x = face - side * 0.06; spin.add(disc);
        const hubT = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.1, 20), rimMat); hubT.rotation.z = PI / 2; hubT.position.x = face - side * 0.02; spin.add(hubT);
        for (let k = 0; k < 10; k++) { const an = k / 10 * PI * 2, nut = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.03, 6), MAT.chrome); nut.rotation.z = PI / 2; nut.position.set(face - side * 0.045, Math.cos(an) * 0.17, Math.sin(an) * 0.17); spin.add(nut); }
      }
      const hole = new THREE.Mesh(new THREE.CircleGeometry(0.04, 12), MAT.black); hole.rotation.y = side * PI / 2; hole.position.set(face - side * 0.043, Math.cos(a + 0.6) * rIn * 0.7, Math.sin(a + 0.6) * rIn * 0.7); spin.add(hole);
    } else if (W.style === 'steel') {       // jantă de tablă cu capac cromat
      if (i === 0) {
        const disc = new THREE.Mesh(new THREE.CylinderGeometry(rIn - 0.005, rIn - 0.005, 0.02, 32), rimMat); disc.rotation.z = PI / 2; disc.position.x = face - side * 0.03; spin.add(disc);
        const cap = new THREE.Mesh(new THREE.SphereGeometry(rIn * 0.62, 24, 10, 0, PI * 2, 0, PI / 2), MAT.chrome); cap.scale.y = 0.25; cap.rotation.z = -side * PI / 2; cap.position.x = face - side * 0.02; spin.add(cap);
      }
      const hole = new THREE.Mesh(new THREE.CircleGeometry(0.018, 10), MAT.black); hole.rotation.y = side * PI / 2; hole.position.set(face - side * 0.018, Math.cos(a + 0.6) * rIn * 0.82, Math.sin(a + 0.6) * rIn * 0.82); spin.add(hole);
    } else if (W.style === 'five') {        // 5 spițe simple, late (jante VW de 17")

  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(hubR, hubR, 0.05, 20), rimMat);
  hub.rotation.z = PI / 2; hub.position.x = face - side * 0.01; spin.add(hub);
  for (let i = 0; i < 5; i++) { const a = i / 5 * PI * 2, nut = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.02, 6), MAT.chrome); nut.rotation.z = PI / 2; nut.position.set(face + side * 0.008, Math.cos(a) * 0.05, Math.sin(a) * 0.05); spin.add(nut); }

  capM.rotation.y = side * PI / 2; capM.position.x = face + side * 0.012; capM.userData.keep = false; spin.add(capM);

  const disc = new THREE.Mesh(new THREE.CylinderGeometry(rIn * 0.9, rIn * 0.9, 0.032, 32), MAT.disc);

  return { pivot, spin };
}

function vehicleShell(spec, M) {
  const root = new THREE.Group(), body = new THREE.Group();
  const cgZ = M.zR + spec.b; body.position.z = -cgZ; root.add(body);
  const add = (m, sh = true, parent = body) => { m.castShadow = sh; m.receiveShadow = true; parent.add(m); return m; };
  const box = (w, h, d, x, y, z, mat, parent = body, sh = true) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); return add(m, sh, parent); };
  const cyl = (r0, r1, h, x, y, z, mat, rot = [0, 0, 0], parent = body, seg = 14) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg), mat); m.position.set(x, y, z); m.rotation.set(...rot); return add(m, true, parent); };
  const sph = (r, x, y, z, mat, sc = [1, 1, 1], parent = body) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 12), mat); m.position.set(x, y, z); m.scale.set(...sc); return add(m, true, parent); };
  const tube = (a, b, r, mat, parent = body) => {         // țeavă între două puncte
    const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b), len = va.distanceTo(vb);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), mat); m.position.copy(va).add(vb).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vb.clone().sub(va).normalize()); return add(m, true, parent);
  };
  const tailMat = new THREE.MeshStandardMaterial({ color: 0x3a0000, emissive: 0xff1208, emissiveIntensity: 1.2, roughness: 0.25 });
  const revMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, emissive: 0xffffff, emissiveIntensity: 0 });
  const brakeMat = new THREE.MeshStandardMaterial({ color: 0x2a0000, emissive: 0xff1208, emissiveIntensity: 0 });
  const G = { head: glowMat(0xdfe9ff), tail: glowMat(0xff2a12), brake: glowMat(0xff1a0a), rev: glowMat(0xf4f6ff), list: [] };
  const glow = (kind, x, y, z, size, parent = body) => { for (const sx of x === 0 ? [1] : [-1, 1]) { const sp = new THREE.Sprite(G[kind]); sp.position.set(sx * x, y, z); sp.scale.setScalar(size); sp.renderOrder = 5; parent.add(sp); } };
  const ao = new THREE.Mesh(new THREE.PlaneGeometry(spec.wid + 0.4, spec.len + 0.4), new THREE.MeshBasicMaterial({ map: aoTex, transparent: true, depthWrite: false, opacity: 0.75 }));
  ao.rotation.x = -PI / 2; ao.position.set(0, 0.02, -cgZ); root.add(ao);
  Object.assign(root.userData, { body, ao, tailMat, revMat, brakeMat, glow: G, wheels: [] });
  return { root, body, cgZ, add, box, cyl, sph, tube, tailMat, revMat, brakeMat, glow };
}

function walkStep(W, dt) {
  const v = car.long, run = Math.min(1, Math.max(0, (Math.abs(v) - 1.6) / 2));
  const prev = W.ph; W.ph += v * dt * (1.6 - run * 0.5);
  const amp = Math.min(1, Math.abs(v) / 1.2) * (0.45 + run * 0.35);
  for (const L of W.legs) {
    const a = Math.sin(W.ph * PI + (L.sx > 0 ? 0 : PI));
    L.hip.rotation.x = -a * amp; L.knee.rotation.x = Math.max(0, Math.cos(W.ph * PI + (L.sx > 0 ? 0 : PI))) * amp * 1.4;
  }
  W.man.position.y = Math.abs(Math.sin(W.ph * PI)) * amp * 0.06;
  W.man.rotation.x = 0.18 + run * 0.18;
  if (Math.floor(prev) !== Math.floor(W.ph) && Math.abs(v) > 0.3) sound.clop(0.25 + run * 0.3, true);
}

  const grown = (sec, g) => z => { const s = sec(z); return { ...s, hw: s.hw + g, hT: s.hT + g, hB: s.hB + g }; };

    add(new THREE.Mesh(loftGeometry(grown(sec, g), zA, zB, Math.max(3, Math.round((zB - zA) * 40)), nth, thA, thB, false), mat), false);

    const s = S(z), y = s.yc + s.hT + lift, dzz = 0.04;

  };

  patch(c0, c1, C.capTh * PI, (1 - C.capTh) * PI, roofMat, 0.008, cabSec, 16);

// Fizica: model „bicicletă” cu punte față/spate, transfer de greutate,
// curbă de aderență tip Pacejka și cerc de frecare pe fiecare punte.
// ------------------------------------------------------------------
const car = {
  spec: CARS[0], x: 0, z: -125, yaw: 0, vx: 0, vz: 0, w: 0,
  steer: 0, ax: 0, ay: 0, rpm: 900, wheelSpin: 0, wheelRot: [0, 0, 0, 0],

  car.steer += Math.max(-rate, Math.min(rate, target - car.steer));

  orbit.dist = Math.max(4, Math.min(22, orbit.dist * (1 + Math.sign(e.deltaY) * 0.1)));
}, { passive: false });
const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'];
addEventListener('keydown', e => {
  if (e.key === 'Control') { if (!orbit.on) { orbit.on = true; orbit.yaw = 0; orbit.pitch = 0.28; } e.preventDefault(); }
  const k = e.code === 'Space' ? 'Space' : e.key;
  if (GAME_KEYS.includes(k)) { keys[k] = true; e.preventDefault(); }
  sound.init();
  if (e.repeat) return;
  if (e.key >= '1' && e.key <= '9' && +e.key <= CARS.length) selectCar(+e.key - 1);
  if (e.key === '0' && CARS.length >= 10) selectCar(9);
  if (e.key === 'r' || e.key === 'R') { resetCar(false); resetBall(); }
  if (e.key === 'c' || e.key === 'C') camMode = (camMode + 1) % 3;
  if (e.key === 'm' || e.key === 'M') sound.toggle();
  if (e.key === 'n' || e.key === 'N') setNight(!night);
  if (e.key === 'h' || e.key === 'H') sound.horn(true, car.spec.horn);
  if ((e.key === 's' || e.key === 'S') && car.spec.police) { setSiren(!sirenOn); pop(sirenOn ? 'Girofar și sirenă pornite' : 'Sirenă oprită'); }
});
addEventListener('keyup', e => { if (e.key === 'Control') orbit.on = false; if (e.key === 'h' || e.key === 'H') sound.horn(false); const k = e.code === 'Space' ? 'Space' : e.key; if (GAME_KEYS.includes(k)) keys[k] = false; });
addEventListener('blur', () => { GAME_KEYS.forEach(k => keys[k] = false); orbit.on = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const set = v => e => { e.preventDefault(); keys[k] = v; b.classList.toggle('on', v); sound.init(); };
  b.addEventListener('pointerdown', set(true)); b.addEventListener('pointerup', set(false));
  b.addEventListener('pointerleave', set(false)); b.addEventListener('pointercancel', set(false));
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ------------------------------------------------------------------
// Bucla principală
// ------------------------------------------------------------------
const camPos = new THREE.Vector3(0, 5, -135), camLook = new THREE.Vector3(), _orbLook = new THREE.Vector3();
let last = performance.now(), acc = 0, prevWheels = null;
const STEP = 1 / 240;

// mersul cailor: pas → trap → galop după viteză; caii se întorc spre direcția virajului
function horseGait(ud, dt) {
  const v = Math.abs(car.long), gallop = v > 7;
  ud.team.rotation.y += (car.steer * 0.9 - ud.team.rotation.y) * Math.min(1, dt * 6);
  const prev = ud.gait; ud.gait += dt * (v < 0.2 ? 0 : 1.2 + v * 0.38);
  const amp = Math.min(0.75, v * 0.12);
  ud.horses.forEach((h, hi) => {
    const ph0 = ud.gait * PI * 2 + hi * 0.4;
    for (const L of h.userData.legs) {
      const off = gallop ? (L.front ? 0 : PI * 0.9) + (L.sx > 0 ? 0.35 : 0) : (L.front === (L.sx > 0) ? 0 : PI);
      const a = Math.sin(ph0 + off);
      L.piv.rotation.x = a * amp * (L.front ? 1 : 0.8);
      L.knee.rotation.x = (L.front ? 1 : -1) * Math.max(0, Math.cos(ph0 + off)) * amp * 1.3;
    }
    h.position.y = Math.abs(Math.sin(ph0)) * amp * 0.12;
    h.rotation.x = gallop ? Math.sin(ph0) * 0.06 : 0;
    h.userData.headG.rotation.x = Math.sin(ph0 * (gallop ? 1 : 2)) * 0.12 * Math.min(1, v / 3);
    h.userData.tail.rotation.x = 0.35 + v * 0.05 + Math.sin(ph0 * 0.5) * 0.08;
  });
  if (Math.floor(prev * 2) !== Math.floor(ud.gait * 2)) sound.clop(Math.min(1, v / 8));   // tropotul copitelor
}

function visuals(dt) {
  const mesh = carMeshes[CARS.indexOf(car.spec)];
  const S = car.spec;
  mesh.position.set(car.x, car.y, car.z);
  mesh.rotation.order = 'YXZ'; mesh.rotation.y = car.yaw;
  if (car.air) { car.pitch += (0.1 - car.pitch) * Math.min(1, dt * 0.9); car.roll *= 1 - Math.min(1, dt); }
  else { car.pitch += (-Math.atan(car.gradL) - car.pitch) * Math.min(1, dt * 14); car.roll += (Math.atan(car.gradT) - car.roll) * Math.min(1, dt * 14); }
  mesh.rotation.x = car.pitch; mesh.rotation.z = car.roll;
  if (mesh.userData.ao) mesh.userData.ao.visible = !car.air && car.y < 0.05;
  const body = mesh.userData.body;
  if (S.bike) {                                   // motocicleta se înclină în viraj (unghiul de echilibru)
    const want = THREE.MathUtils.clamp(Math.atan2(-car.ay, 9.81), -0.95, 0.95) * Math.min(1, Math.hypot(car.vx, car.vz) / 4);
    body.rotation.z += (want - body.rotation.z) * Math.min(1, dt * 8);
  } else body.rotation.z = THREE.MathUtils.clamp(-car.ay * 0.009, -0.07, 0.07);   // ruliu
  if (mesh.userData.steerWheel) mesh.userData.steerWheel.rotation.z = -car.steer * 2.2;
  if (mesh.userData.horses) horseGait(mesh.userData, dt);
  if (mesh.userData.walker) walkStep(mesh.userData.walker, dt);
  body.rotation.x = THREE.MathUtils.clamp(-car.ax * 0.006, -0.05, 0.05);   // tangaj
  updateLights(mesh, dt);
  placeTrailer(dt);

  const sn = Math.sin(car.yaw), cs = Math.cos(car.yaw);
  const speed = Math.hypot(car.vx, car.vz);
  const roll = car.long / S.wheelR * dt;
  const spin = roll + (car.spinR > 0 ? 40 * dt : 0) * Math.sign(car.long || 1);
  for (const wh of mesh.userData.wheels) {
    if (wh.front) wh.pivot.rotation.y = car.steer;
    wh.spin.rotation.x += wh.r ? car.long / wh.r * dt : (wh.front ? S.frontDrive === 0 : S.frontDrive === 1) ? roll : spin;
  }

  // poziția roților din spate pe sol, pentru urme și fum
  const track = S.bike || S.walker ? 0.02 : S.wid / 2 - 0.16;
  const wheelsW = [];
  for (const [zo, sx] of [[-S.b, -1], [-S.b, 1], [S.a, -1], [S.a, 1]]) {
    wheelsW.push([car.x + sn * zo + cs * sx * track, car.z + cs * zo - sn * sx * track]);
  }
  const latSlipR = Math.abs(car.lat - car.w * S.b);
  const latSlipF = Math.abs(car.lat + car.w * S.a);
  const intR = Math.max(0, latSlipR - 2.2) * 0.25 + car.spinR * 3 + (keys.Space && speed > 3 ? 1 : 0) + (keys.ArrowDown && car.long > 8 ? 0.6 : 0);
  const intF = Math.max(0, latSlipF - 3) * 0.2 + (keys.ArrowDown && car.long > 8 ? 0.6 : 0);
  if (prevWheels) {
    for (let i = 0; i < 4; i++) {
      const it = i < 2 ? intR : intF;
      if (car.air || car.y > 0.05) continue;
      const wet = wetAt(wheelsW[i][0], wheelsW[i][1]);
      if (wet > 0.5) {                               // pe ud: stropi de apă în loc de urme și fum
        if (i < 2 && speed > 6 && Math.random() < Math.min(1, (speed / 30 + it * 0.3)) * dt * 60 * 0.6) puff(wheelsW[i][0], wheelsW[i][1], car.vx, car.vz, Math.min(1.4, 0.4 + speed / 40 + it * 0.2), 0xbfd8f2);
        continue;
      }
      if (grassAt(wheelsW[i][0], wheelsW[i][1])) {     // pe iarbă: fără urme negre, doar praf și fire de iarbă
        if (i < 2 && (it > 0.5 || speed > 12) && Math.random() < Math.min(1, it * 0.3 + speed / 60) * dt * 60 * 0.4) puff(wheelsW[i][0], wheelsW[i][1], car.vx, car.vz, Math.min(1.2, 0.4 + it * 0.3), 0x9a8f62);
        continue;
      }
      if (it > 0.35 && speed > 1.5) addSkid(prevWheels[i][0], prevWheels[i][1], wheelsW[i][0], wheelsW[i][1], 0.24);
      if (i < 2 && it > 0.8 && Math.random() < Math.min(1, it * 0.5) * dt * 60 * 0.5) puff(wheelsW[i][0], wheelsW[i][1], car.vx, car.vz, Math.min(1.5, it * 0.6));
    }
  }
  prevWheels = wheelsW;

  // camera
  const vdir = speed > 3 ? Math.atan2(car.vx, car.vz) : car.yaw;
  let dy = vdir - car.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  const camYaw = car.yaw + dy * 0.45;
  const ck = S.camK || 1, dist = (camMode === 1 ? 13 : 7.8) * ck, hgt = (camMode === 1 ? 5.5 : 2.9) * (1 + (ck - 1) * 0.8);
  let target;
  if (camMode === 2) target = new THREE.Vector3(car.x + 0.01, 42, car.z - 18);
  else target = new THREE.Vector3(car.x - Math.sin(camYaw) * dist, hgt + car.y * 0.8, car.z - Math.cos(camYaw) * dist);
  orbit.k += ((orbit.on ? 1 : 0) - orbit.k) * Math.min(1, dt * 8);
  if (orbit.k > 0.01) {                                  // camera liberă în jurul mașinii
    const a = car.yaw + PI + orbit.yaw, hd = Math.cos(orbit.pitch) * orbit.dist;
    const free = new THREE.Vector3(car.x + Math.sin(a) * hd, car.y + 0.9 + Math.sin(orbit.pitch) * orbit.dist, car.z + Math.cos(a) * hd);
    free.y = Math.max(free.y, groundAt(free.x, free.z).h + 0.3);
    target.lerp(free, orbit.k);
  }
  const co = window.__drift && window.__drift.camOverride;
  if (co) { target = new THREE.Vector3(car.x + Math.sin(co.ang) * co.dist, co.h, car.z + Math.cos(co.ang) * co.dist); camPos.copy(target); }
  else if (orbit.k > 0.5) camPos.copy(target);
  else camPos.lerp(target, 1 - Math.exp(-dt * (camMode === 2 ? 4 : 6)));
  camera.position.copy(camPos);
  if (co) camLook.set(car.x, 0.6, car.z); else camLook.set(car.x + sn * 2.5, 1.0 + car.y, car.z + cs * 2.5);
  if (!co && orbit.k > 0.01) camLook.lerp(_orbLook.set(car.x, car.y + 0.7, car.z), orbit.k);
  camera.lookAt(camLook);
  camera.fov = 60 + Math.min(speed, 60) * 0.18; camera.updateProjectionMatrix();

  sun.position.set(car.x + 40, 80, car.z + 25); sun.target.position.set(car.x, 0, car.z);

  // sunet
  const gearSpeeds = [0, 14, 25, 36, 48, 62, 90];
  let g = 1; while (g < 6 && Math.abs(car.long) > gearSpeeds[g]) g++;
  const lo = gearSpeeds[g - 1], hi = gearSpeeds[g];
  let rpmT = 1200 + (Math.abs(car.long) - lo) / (hi - lo) * 5600 + (g === 1 ? 0 : 1200);
  if (car.spinR > 0 || keys.Space) rpmT = Math.max(rpmT, 5000 + car.spinR * 3000);
  car.rpm += (Math.min(7400, rpmT) - car.rpm) * Math.min(1, dt * 10);
  sound.update(car.rpm * (S.rpmK ?? 1), keys.ArrowUp ? 1 : 0.2, Math.max(0, Math.min(1, (intR + intF) * 0.35)));

  // HUD
  $('spd').textContent = Math.round(speed * 3.6);
  const angDeg = speed > 4 ? Math.round(Math.abs(car.beta) * 180 / Math.PI) : 0;
  $('ang').textContent = 'unghi ' + angDeg + '°' + (car.air ? ' · în aer' : car.wet > 0.5 ? ' · asfalt ud' : '');
  $('cur').textContent = Math.round(drift.points * drift.mult).toLocaleString('ro-RO');
  $('mul').textContent = drift.active ? '×' + drift.mult : '';
  $('score').classList.toggle('drifting', drift.active);
  $('tot').textContent = drift.total.toLocaleString('ro-RO');
  $('best').textContent = (drift.best[S.id] || 0).toLocaleString('ro-RO');
  $('maxang').textContent = Math.round(drift.maxAng) + '°';
  if (popT > 0) { popT -= dt; if (popT <= 0) popEl.className = ''; }
}

// rezoluție adaptivă: dacă placa video nu ține pasul, scade pixel ratio
let perfT = 0, perfN = 0, pr = renderer.getPixelRatio();
function adaptQuality(dt) {
  perfT += dt; perfN++;
  if (perfT < 2) return;
  const fps = perfN / perfT; perfT = 0; perfN = 0;
  if (fps < 40 && pr > 0.7) { pr = Math.max(0.7, pr - 0.35); renderer.setPixelRatio(pr); resize(); }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  adaptQuality(dt);
  acc += dt;
  while (acc >= STEP) { physicsStep(STEP); ballStep(STEP); ballVsTrailer(ball); acc -= STEP; }
  updateBallMesh(dt);
  if (WET.water) { WET.water.normalMap.offset.x += dt * 0.012; WET.water.normalMap.offset.y += dt * 0.007; }
  parkStep(dt);
  updateDrift(dt);
  updateCones(dt);
  updateSmoke(dt);
  visuals(dt);
  drawMinimap();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
$('loading').remove();
requestAnimationFrame(frame);

// ------------------------------------------------------------------
// Minimapa (stânga jos): stratul fix se desenează o singură dată, mașina și mingea la fiecare cadru
// ------------------------------------------------------------------
const mmCanvas = $('mm'), mmCtx = mmCanvas.getContext('2d');
let mmStatic = null, mmSize = 0, mmFrame = 0;
const mmPos = (x, z) => [(ARENA + 6 - x) / (2 * ARENA + 12) * mmSize, (ARENA + 6 - z) / (2 * ARENA + 12) * mmSize];   // +z în sus, +x la stânga (ca în cameră)
function mmBuild() {
  const dpr = Math.min(2, devicePixelRatio || 1), css = mmCanvas.clientWidth || 168;
  mmSize = Math.round(css * dpr); mmCanvas.width = mmCanvas.height = mmSize;
  mmStatic = document.createElement('canvas'); mmStatic.width = mmStatic.height = mmSize;
  const g = mmStatic.getContext('2d'), k = mmSize / (2 * ARENA + 12);
  g.fillStyle = '#3a6b3a'; g.fillRect(0, 0, mmSize, mmSize);
  const [ax0, az0] = mmPos(ARENA, ARENA); g.fillStyle = '#4b4e53'; g.fillRect(ax0, az0, 2 * ARENA * k, 2 * ARENA * k);
  g.strokeStyle = '#e8e8e8'; g.lineWidth = Math.max(1, k * 1.5); g.strokeRect(ax0, az0, 2 * ARENA * k, 2 * ARENA * k);
  { const [x0, z0] = mmPos(WET.x1, WET.z1); g.fillStyle = 'rgba(40,130,240,.85)'; g.fillRect(x0, z0, (WET.x1 - WET.x0) * k, (WET.z1 - WET.z0) * k); }
  for (const r of RAMPS) {
    g.save(); const [x, z] = mmPos(r.x, r.z); g.translate(x, z); g.rotate(-r.dir);
    g.fillStyle = '#ffc400'; g.fillRect(-r.W / 2 * k, -r.L * k, r.W * k, r.L * k); g.restore();
  }
  { const [x0, z0] = mmPos(PARK.x1, PARK.z1); g.fillStyle = '#5a9a3a'; g.beginPath(); g.roundRect(x0, z0, (PARK.x1 - PARK.x0) * k, (PARK.z1 - PARK.z0) * k, PARK.r * k); g.fill();
    const [lx, lz] = mmPos(LAKE.x, LAKE.z); g.strokeStyle = '#d8cba8'; g.lineWidth = Math.max(1, 2.8 * k); g.beginPath(); g.arc(lx, lz, 16 * k, 0, 7); g.stroke(); }
  for (const o of OBSTACLES) { if (o.lake) continue; const [x, z] = mmPos(o.x, o.z); g.fillStyle = o.r > 1.5 ? '#6b6f4a' : o.r > 0.3 ? '#2f7d36' : '#bbb'; g.beginPath(); g.arc(x, z, Math.max(1, o.r * k), 0, 7); g.fill(); }
  for (const pl of PILLARS) { const [x, z] = mmPos(pl.x, pl.z); g.fillStyle = '#9a9a9a'; g.beginPath(); g.arc(x, z, pl.r * k, 0, 7); g.fill(); }
  { const [x, z] = mmPos(LAKE.x, LAKE.z); g.fillStyle = '#2f8fd8'; g.beginPath(); g.arc(x, z, LAKE.r * k, 0, 7); g.fill(); }
  { const [x, z] = mmPos(BALL_SPAWN[0], BALL_SPAWN[1]); g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1; g.beginPath(); g.arc(x, z, (BALL_R + 0.7) * k, 0, 7); g.stroke(); }
}
function drawMinimap() {
  if (!mmStatic || mmCanvas.clientWidth && Math.abs(mmCanvas.clientWidth * Math.min(2, devicePixelRatio || 1) - mmSize) > 2) mmBuild();
  if (++mmFrame % 2) return;
  const g = mmCtx, k = mmSize / (2 * ARENA + 12);
  g.drawImage(mmStatic, 0, 0);
  if (car.spec.trailer) {
    const [hx, hz] = hitchPos(), rear = TRAILER.len - TRAILER.front;
    const [a, b] = mmPos(hx + Math.sin(trailer.yaw) * TRAILER.front, hz + Math.cos(trailer.yaw) * TRAILER.front), [c, d] = mmPos(hx - Math.sin(trailer.yaw) * rear, hz - Math.cos(trailer.yaw) * rear);
    g.strokeStyle = '#f2f2f2'; g.lineWidth = Math.max(3, TRAILER.wid * k); g.lineCap = 'butt'; g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke();
  }
  { const [x, z] = mmPos(ball.x, ball.z); g.fillStyle = '#fff'; g.strokeStyle = '#111'; g.lineWidth = 1.5; g.beginPath(); g.arc(x, z, Math.max(3, BALL_R * k), 0, 7); g.fill(); g.stroke(); }
  // mașina: săgeată în culoarea ei, cu contur alb
  const [x, z] = mmPos(car.x, car.z), sz = Math.max(7, car.spec.len * k * 1.6);
  g.save(); g.translate(x, z); g.rotate(-car.yaw);
  g.beginPath(); g.moveTo(0, -sz * 0.6); g.lineTo(sz * 0.42, sz * 0.5); g.lineTo(0, sz * 0.25); g.lineTo(-sz * 0.42, sz * 0.5); g.closePath();
  g.fillStyle = '#' + car.spec.color.toString(16).padStart(6, '0'); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 1.6; g.stroke();
  g.restore();
}

// pentru testare din consolă
window.__drift = { car, drift, keys, CARS, selectCar, physicsStep, updateDrift, camOverride: null, orbit, setSiren, carMeshes, trailer, trailerStep, groundAt, wetAt, setNight, ball, ballStep, resetBall };
</script>
