<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setări vehicule · Drift 3D</title>
<style>
  :root { --bg:#14171c; --card:#1d2128; --ink:#f4f1ea; --ink2:#a9a49b; --line:rgba(255,255,255,.1); --acc:#ffb22e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-top:var(--gb, 0px); }
  header { position:sticky; top:var(--gb, 0px); z-index:2; display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 16px; background:rgba(20,23,28,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(6px); }
  header h1 { font-size:19px; margin:0 auto 0 0; }
  a.btn, button { font:inherit; font-size:14px; padding:8px 14px; border-radius:9px; border:1px solid var(--line); background:#262b33; color:var(--ink); cursor:pointer; text-decoration:none; }
  a.btn.play { background:var(--acc); color:#1a1408; border-color:var(--acc); font-weight:650; }
  button:hover, a.btn:hover { filter:brightness(1.15); }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:14px; }
  .note { max-width:1100px; margin:14px auto 0; padding:0 16px; color:var(--ink2); font-size:14px; line-height:1.45; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .card.changed { border-color:rgba(255,178,46,.55); }
  .top { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .dot { width:16px; height:16px; border-radius:50%; flex:none; box-shadow:0 0 0 2px rgba(255,255,255,.25) inset; }
  .nm { font-weight:650; font-size:16px; }
  .tg { font-size:12px; color:var(--ink2); }
  .reset { margin-left:auto; font-size:12px; padding:5px 9px; }
  .row { display:grid; grid-template-columns:150px 1fr 56px; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line); font-size:14px; }
  .row.tog { grid-template-columns:1fr auto; }
  .row label { color:var(--ink); }
  .row .v { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink2); font-size:13px; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  input[type=number] { width:100%; background:#262b33; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:5px 7px; font:inherit; }
  select { background:#262b33; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 8px; font:inherit; font-size:14px; }
  .sw { position:relative; width:44px; height:24px; }
  .sw input { opacity:0; width:0; height:0; }
  .sw span { position:absolute; inset:0; border-radius:12px; background:#3a3f48; transition:.15s; cursor:pointer; }
  .sw span::after { content:''; position:absolute; left:3px; top:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.15s; }
  .sw input:checked + span { background:var(--acc); }
  .sw input:checked + span::after { left:23px; }
  .err { color:#ff8a80; padding:16px; }
  @media (max-width:480px) { .row { grid-template-columns:120px 1fr 48px; } main { padding:12px; grid-template-columns:1fr; } }
</style>
</head>
<body>
<script src="/games/topbar.js"></script>
<header>
  <h1>⚙ Setări vehicule</h1>
  <button id="resetAll">Resetează tot</button>
  <a class="btn play" href="../">Joacă ▶</a>
</header>
<p class="note">Modificările se salvează automat în browserul tău și se aplică data viitoare când pornești (sau reîncarci) jocul. Un chenar galben arată vehiculele cu setări schimbate.</p>
<main id="list"></main>
<script>
const KEY = 'drift-settings', HP = 735.5;
let st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// lista de vehicule se citește direct din joc, ca să nu existe două surse
async function loadCars() {
  const html = await fetch('../?t=' + Date.now()).then(r => r.text());
  const a = html.indexOf('const CARS = ['), b = html.indexOf('\n];', a);
  if (a < 0 || b < 0) throw new Error('lista de vehicule nu a fost găsită');
  return new Function('return ' + html.slice(a + 'const CARS = '.length, b + 2))();
}
const driveOf = c => c.frontDrive === 1 ? 'fwd' : c.frontDrive === 0 ? 'rwd' : 'awd';
function defaults(c) {
  return { lights: !c.noLights, police: !!c.police, wings: !!c.wings, cp: Math.round(c.power / HP), drive: driveOf(c),
    muF: c.muF, muR: c.muR, steerDeg: Math.round(c.steerMax * 180 / Math.PI), assist: c.assist };
}
const SLIDERS = [
  ['muF', 'Aderență față', 0.3, 2.0, 0.05, v => v.toFixed(2)],
  ['muR', 'Aderență spate', 0.3, 2.0, 0.05, v => v.toFixed(2)],
  ['steerDeg', 'Unghi de virare', 10, 60, 1, v => v + '°'],
  ['assist', 'Contrabracaj automat', 0, 1, 0.05, v => Math.round(v * 100) + '%'],
];
function card(c) {
  const d = defaults(c), cur = Object.assign({}, d, st[c.id] || {});
  const el = document.createElement('section'); el.className = 'card';
  const tog = (k, label) => `<div class="row tog"><label for="v-${c.id}-${k}">${label}</label><label class="sw"><input type="checkbox" id="v-${c.id}-${k}" data-k="${k}" ${cur[k] ? 'checked' : ''}><span></span></label></div>`;
  el.innerHTML = `
    <div class="top"><span class="dot" style="background:#${c.color.toString(16).padStart(6, '0')}"></span>
      <div><div class="nm">${esc(c.name)}</div><div class="tg">${esc(c.tag)}</div></div>
      <button class="reset">Din fabrică</button></div>
    ${tog('lights', 'Faruri')}
    ${tog('police', 'Girofar și sirenă (tasta S)')}
    ${tog('wings', 'Se pot monta aripi (tasta A)')}
    <div class="row"><label for="v-${c.id}-cp">Putere</label><input type="range" id="v-${c.id}-cpr" min="1" max="${Math.max(1200, d.cp * 3)}" step="1" value="${cur.cp}"><span class="v"><span id="v-${c.id}-cpv">${cur.cp}</span> CP</span></div>
    <div class="row"><label for="v-${c.id}-drive">Tracțiune</label><select id="v-${c.id}-drive" data-k="drive">
      <option value="rwd">Spate</option><option value="fwd">Față</option><option value="awd">Integrală (4×4)</option></select><span></span></div>
    ${SLIDERS.map(([k, label, mn, mx, step, f]) => `<div class="row"><label for="v-${c.id}-${k}">${label}</label><input type="range" id="v-${c.id}-${k}" data-k="${k}" min="${mn}" max="${mx}" step="${step}" value="${cur[k]}"><span class="v" id="v-${c.id}-${k}-v">${f(cur[k])}</span></div>`).join('')}`;
  el.querySelector('select').value = cur.drive;
  const set = (k, v) => {
    const o = st[c.id] = st[c.id] || {};
    if (v === d[k]) delete o[k]; else o[k] = v;
    if (!Object.keys(o).length) delete st[c.id];
    save(); el.classList.toggle('changed', !!st[c.id]);
  };
  el.querySelectorAll('input[type=checkbox]').forEach(i => i.addEventListener('change', () => set(i.dataset.k, i.checked)));
  el.querySelector('select').addEventListener('change', e => set('drive', e.target.value));
  const cpr = el.querySelector(`#v-${c.id}-cpr`);
  cpr.addEventListener('input', () => { el.querySelector(`#v-${c.id}-cpv`).textContent = cpr.value; set('cp', +cpr.value); });
  for (const [k, , , , , f] of SLIDERS) {
    const i = el.querySelector(`#v-${c.id}-${k}`);
    i.addEventListener('input', () => { el.querySelector(`#v-${c.id}-${k}-v`).textContent = f(+i.value); set(k, +i.value); });
  }
  el.querySelector('.reset').addEventListener('click', () => { delete st[c.id]; save(); el.replaceWith(card(c)); });
  el.classList.toggle('changed', !!st[c.id]);
  return el;
}
let CARS = [];
loadCars().then(cars => {
  CARS = cars; const list = document.getElementById('list');
  for (const c of cars) list.appendChild(card(c));
}).catch(e => { document.getElementById('list').innerHTML = `<div class="err">Nu am putut încărca vehiculele: ${esc(e.message)}</div>`; });
document.getElementById('resetAll').addEventListener('click', () => {
  if (!confirm('Revii la setările din fabrică pentru toate vehiculele?')) return;
  st = {}; save(); const list = document.getElementById('list'); list.innerHTML = ''; for (const c of CARS) list.appendChild(card(c));
});
</script>
</body>
</html>
